<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daybook</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daybook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: phone = greeting band, 2-column tiles, bottom tab bar and a + button; each tile opens a one-topic sheet.
   Desktop = left rail + wider tile grid. Palette: always white with mint accents (one light theme by design, whatever the phone's dark-mode setting). */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F2F6F4; --line:#E3EBE7; --ink:#14261F; --muted:#5E6E68;
  --mint:#7BE0BF; --mint-soft:#EDFAF5; --accent:#0F7F60; --accent-ink:#063A2C;
  --good:#1F7D4C; --good-soft:#DBF0E2; --warn:#9A620A; --warn-soft:#F6EAD2; --bad:#B3362A; --bad-soft:#F6DDD9;
  --en:#3A62C9; --de:#AD780D; --es:#C44E3A; --ielts:#7450BE;
  --scrim:rgba(8,40,30,.38); --shadow:0 1px 2px rgba(18,60,45,.07),0 6px 18px rgba(18,60,45,.07);
  --f-display:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px;flex:none}
h1{font:650 22px/1.15 var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:32px;height:32px;border-radius:10px;background:var(--mint);color:var(--accent-ink);display:grid;place-items:center;font:700 18px/1 var(--f-display);flex:none}
.brand-name{font:700 18px/1.05 var(--f-display);letter-spacing:-.01em}
.brand-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;min-width:0}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.timer-pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;background:var(--mint);color:var(--accent-ink);border:0;font-weight:600;font-size:13px;white-space:nowrap}
.timer-pill .pulse{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

main{padding-block:6px calc(130px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%;max-width:1200px;margin:0 auto;min-width:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;background:none;border:0;color:var(--muted);font-size:11.5px;font-weight:600;min-width:0}
.tab svg.i{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg.i{stroke-width:2.3}
.fab{position:fixed;z-index:31;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--mint);color:var(--accent-ink);box-shadow:0 8px 20px rgba(18,90,64,.25);display:grid;place-items:center}
.fab svg.i{width:28px;height:28px;stroke-width:2.3}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:210px minmax(0,1fr)}
  .top{grid-column:1/-1;grid-row:1}
  nav.tabs{grid-column:1;grid-row:2;position:sticky;top:70px;align-self:start;display:flex;flex-direction:column;gap:2px;border:0;background:transparent;padding:12px 0 16px max(16px,env(safe-area-inset-left,0px))}
  .tab{flex-direction:row;gap:10px;padding:10px 12px;border-radius:12px;font-size:14.5px;justify-content:flex-start}
  .tab[aria-current="page"]{background:var(--mint-soft)}
  main{grid-column:2;grid-row:2;padding-bottom:70px}
  .fab{bottom:28px}
}

.banner{background:var(--warn-soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.cards{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:720px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1180px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;min-width:0}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px;min-width:0}
.ch h2{font:600 17px/1.2 var(--f-display);margin:0 auto 0 0;letter-spacing:-.005em}
.sec{font:600 12.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--mint-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--mint);border-color:var(--mint);color:var(--accent-ink)}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.big{min-height:56px;font-size:16.5px;width:100%;border-radius:16px}
.btn.danger{color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.on{background:var(--mint);border-color:var(--mint);color:var(--accent-ink)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);flex:none;position:relative;padding:0}
.in{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;font-size:16px;min-width:0}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--mint-soft)}
textarea.in{height:auto;min-height:110px;padding:10px 12px;resize:vertical;line-height:1.5}
.in.big{height:56px;font-size:24px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.empty{color:var(--muted);font-size:14.5px;padding:6px 0;margin:0}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;font-size:14px}

/* Today */
.hello{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin:8px 0 14px}
.hello-top{display:flex;gap:12px;align-items:center}
.hello-txt{flex:1;min-width:0}
.greet{font-size:14px;color:var(--accent);font-weight:600}
.hello h1{font-size:25px;margin-top:2px}
.dsub{font-size:13px;color:var(--muted)}
.ring{width:76px;height:76px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .rv b{font:650 20px var(--f-display);display:block}
.ring .rv small{font-size:11px;color:var(--muted);font-weight:600}
.daynav{display:flex;gap:8px;align-items:center;margin:14px 0 12px}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.tgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tl{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);text-align:left;min-height:112px;position:relative;min-width:0;transition:transform .12s}
.tl:active{transform:scale(.98)}
.tl .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);color:var(--accent)}
.tl .nm{font-weight:600;font-size:15.5px;line-height:1.2}
.tl .st{font-size:13px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.tl.done{background:var(--surface);border-color:var(--mint)}
.tl.done .ic{background:var(--mint);color:var(--accent-ink)}
.tl .badge{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--mint);color:var(--accent-ink);display:grid;place-items:center}
.tl .badge svg.i{width:14px;height:14px}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.welcome h2{font:600 17px var(--f-display);margin:0 0 6px}
.welcome p{margin:0 0 6px;font-size:14.5px;max-width:62ch}
.attn{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-top:14px;overflow:hidden}
.attn-h{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;background:none;border:0;text-align:left;font-weight:600;font-size:15px}
.attn-h .more{margin-left:auto;color:var(--accent);font-size:13.5px}
.attn ul{list-style:none;margin:0;padding:0 16px 8px}
.allclear{display:flex;gap:8px;align-items:center;color:var(--good);font-weight:600;font-size:14px;margin:14px 0 0;justify-content:center}
.count{background:var(--bad);color:#fff;border-radius:999px;padding:3px 8px;font-size:12px;letter-spacing:0;font-weight:600}
.alerts{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2px 16px 8px;margin-bottom:14px}
.alerts .sec{margin:12px 0 4px}
.alerts ul{list-style:none;margin:0;padding:0}
.al{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.al:first-child{border-top:0}
.al .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--warn)}
.al.bad .dot{background:var(--bad)}
.al-t{flex:1;min-width:0;font-size:14px}

/* Focus sheets */
.q{font:600 17px/1.3 var(--f-display);margin:6px 0 10px}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pk{min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:500 16px var(--f-mono);font-variant-numeric:tabular-nums}
.pk[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--accent-ink);font-weight:600}
.other{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13.5px;color:var(--muted);font-weight:600}
.other .in{width:auto;flex:0 1 150px;height:42px}
.result{margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--mint-soft);font-size:15px}
.result b{font:650 24px var(--f-display)}
.lang{padding:14px 0;border-top:1px solid var(--line)}
.lang.first{border-top:0;padding-top:4px}
.lang-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;margin-bottom:10px}
.ltag{font:500 11px/1 var(--f-mono);padding:5px 7px;border-radius:7px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);letter-spacing:.03em}
.stepper{display:flex;align-items:center;gap:8px}
.sbtn{min-width:54px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;padding:0 10px}
.sbtn.plus{background:var(--mint-soft);border-color:transparent;color:var(--accent)}
.sval{flex:1;display:flex;align-items:baseline;justify-content:center;gap:4px;min-width:0;color:var(--muted);font-size:13px}
.sval input{width:100%;max-width:80px;text-align:right;border:0;border-bottom:2px solid var(--line);background:transparent;font:650 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink);padding:0 2px}
.sval input:focus{outline:none;border-bottom-color:var(--accent)}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--c,var(--mint))}
.clsrow{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.clsrow:first-child{border-top:0;padding-top:0}
.clsinfo b{display:block;font-size:15.5px}
.cbtns{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hbig{display:flex;align-items:center;gap:10px;min-height:60px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15.5px;text-align:left}
.hbig .hcheck{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.hbig[aria-pressed="true"]{background:var(--surface);border-color:var(--mint)}
.hbig[aria-pressed="true"] .hcheck{background:var(--mint);border-color:var(--mint)}
.hbig .hcheck svg.i{width:16px;height:16px}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mood{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-width:0}
.mood b{font:650 19px var(--f-display)}
.mood span{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mood[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--accent-ink)}
.mood[aria-pressed="true"] span{color:var(--accent-ink)}
.t3{display:flex;gap:10px;align-items:center;margin-top:10px}
.tick{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;color:var(--accent-ink);padding:0}
.tick.on{background:var(--mint);border-color:var(--mint)}
.tick svg.i{width:16px;height:16px}
.t3.done .in{text-decoration:line-through;color:var(--muted)}
.step-ind{font-size:12.5px;color:var(--muted);font-weight:600}
.dots{display:flex;gap:4px;margin:0 0 6px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--mint)}

/* Lists, pages */
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg label,.seg>button{position:relative;flex:none}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span,.seg>button{display:block;padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);background:none;border:0;white-space:nowrap;cursor:pointer}
.seg input:checked+span,.seg>button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.seg.full{display:flex}
.seg.full label,.seg.full>button{flex:1}
.seg.full span{text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-block;padding:8px 13px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:var(--surface);cursor:pointer}
.chip input:checked+span{background:var(--mint);border-color:var(--mint);color:var(--accent-ink);font-weight:600}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;min-width:0}
.list>.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t,.row .s{display:block}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.amt.in{color:var(--good)}
.day-h{font-size:12.5px;font-weight:600;color:var(--muted);margin:16px 0 0;display:flex;justify-content:space-between;gap:8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.day-h+.list>.row:first-child{border-top:0}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.ph h1{margin-right:auto}
.pnav{display:flex;align-items:center;gap:8px;min-width:0}
.pnav .lbl{min-width:0;text-align:center;padding:0 4px}
.pnav b{display:block;font:600 16px/1.2 var(--f-display);white-space:nowrap}
.pnav small{display:block;color:var(--muted);font-size:12px;white-space:nowrap}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .k{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font:600 23px/1.15 var(--f-display);margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.up{color:var(--good)} .down{color:var(--bad)}
.stat-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.stat-row:first-child{border-top:0}
.stat-row b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.chart{margin-top:12px}
.plot{position:relative;height:150px;margin-left:36px;border-bottom:1px solid var(--line)}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.gl span{position:absolute;right:100%;margin-right:6px;transform:translateY(-50%);font:10.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.goal{position:absolute;left:0;right:0;border-top:1.5px solid var(--ink);opacity:.55;z-index:2;pointer-events:none}
.goal span{position:absolute;right:0;bottom:3px;font-size:11px;font-weight:600;background:var(--surface);padding:0 4px;border-radius:4px}
.cols{position:absolute;inset:0;display:flex;align-items:stretch;gap:3px}

  const sched=activeClasses().filter(c=>scheduledOn(c,d)).sort((a,b)=>String(a.time||'').localeCompare(String(b.time||'')));
  const mk=Object.values(S.sessions).filter(s=>s.status==='cancelled'&&s.makeup===d&&!sched.find(c=>c.id===s.classId)).map(s=>classOf(s.classId)).filter(Boolean);
  return [...sched.map(c=>({c,mk:false})),...mk.map(c=>({c,mk:true}))].map(x=>({...x,s:Object.values(S.sessions).find(s=>s.classId===x.c.id&&s.date===d)}));
}
function lastBook(d){const ks=Object.keys(S.days).filter(k=>k<d).sort().reverse();for(const k of ks){const b=S.days[k].read&&S.days[k].read.book;if(b)return b}return ''}

function secState(sec,d){const day=dayOf(d);
  if(sec==='sleep'){const m=sleepMins(day);return {done:m!=null,text:m!=null?fmtDur(m)+' of sleep':'Tap to log'}}
  if(sec==='top3'){const t3=day.top3||{},set=[1,2,3].filter(i=>t3[i]&&String(t3[i].t||'').trim()),dn=set.filter(i=>t3[i].done).length;return {done:set.length>0,text:set.length?`${dn} of ${set.length} done`:'Set 3 priorities'}}
  if(sec==='study'){const t=studyTotal(day),g=studyGoal();return {done:t>0,text:t?`${fmtDur(t)}${g?' of '+fmtDur(g):''}`:'Nothing yet'}}
  if(sec==='classes'){const c=classesDue(d),left=c.filter(x=>!x.s).length;return {done:c.length>0&&!left,has:c.length>0,text:!c.length?'None today':left?`${left} to mark`:'All marked'}}
  if(sec==='reading'){const m=readMin(day)+learnReadMin(d),g=+S.settings.goals.reading||0;return {done:m>0,text:m?`${m}${g?' of '+g:''} min`:'Nothing yet'}}
  if(sec==='habits'){const hs=habits(),h=day.habits||{},n=hs.filter(x=>h[x]).length;return {done:hs.length>0&&n===hs.length,text:hs.length?`${n} of ${hs.length} done`:'None set'}}
  if(sec==='money'){const l=Object.values(S.money).filter(m=>m.date===d);return {done:l.length>0,text:l.length?`${l.length} entr${l.length>1?'ies':'y'}`:'Nothing logged'}}
  if(sec==='review'){const r=reviewDone(day);return {done:r,text:r?'Done':'Not yet'}}
  return {done:false,text:''};
}
const counted=d=>['sleep','top3','study','reading','review'].concat(secState('classes',d).has?['classes']:[]);

function alerts(scope='all'){
  const t=todayISO(),out=[],life=scope!=='pastel';
  if(life&&(Object.keys(S.days).length||Object.keys(S.money).length)){const lb=S.meta.lastBackup;if(!lb||lb<addDays(t,-7)){const n=lb?Math.round((parseISO(t)-parseISO(lb))/864e5):0;out.push({kind:'warn',text:lb?`Last backup was ${n} days ago`:'You have not made a backup yet',act:'backupNow',cta:'Back up'})}}
  for(let i=7;i>=1;i--){const d=addDays(t,-i);for(const c of activeClasses())if(scheduledOn(c,d)&&!anySession(c.id,d))out.push({kind:'bad',text:`${c.name}: ${shortDate(d)} session not logged`,act:'logSession',args:{c:c.id,d},cta:'Log'})}
  for(const s of Object.values(S.sessions)){if(s.status!=='cancelled'||s.date<addDays(t,-45))continue;
    if(s.makeup){if(s.makeup<t&&!heldOn(s.classId,s.makeup))out.push({kind:'bad',text:`${className(s.classId)}: make-up on ${shortDate(s.makeup)} not logged`,act:'logSession',args:{c:s.classId,d:s.makeup},cta:'Log'})}
    else if(s.cause&&s.cause!=='Student')out.push({kind:'warn',text:`${className(s.classId)}: cancelled ${shortDate(s.date)}, no make-up date yet`,act:'editSession',args:{id:s.id},cta:'Set date'})}
  for(const st of Object.values(S.students).filter(x=>(x.status||'Active')==='Active').sort(byName)){const k=studentStats(st.id);if(!k.classes.length)continue;
    if(k.remaining<0)out.push({kind:'bad',text:`${st.name} has used ${-k.remaining} unpaid session${k.remaining<-1?'s':''}`,act:'student',args:{id:st.id},cta:'Open'});
    else if(k.remaining<=1)out.push({kind:'warn',text:`${st.name}: ${k.remaining} paid session${k.remaining===1?'':'s'} left`,act:'student',args:{id:st.id},cta:'Open'})}
  if(life){const ns=Object.values(S.money).filter(m=>txLines(m).some(needsSort)).length;if(ns)out.push({kind:'warn',text:`${ns} transaction${ns>1?'s':''} to sort in Finance`,act:'finSort',cta:'Sort'})}
  if(life&&S.fin&&typeof finAlerts==='function')out.push(...finAlerts());
  if(life)out.push(...inboxAlerts(),...syncAlerts());
  const open=Object.values(S.tasks).filter(x=>x.status!=='done'&&x.due);
  const over=open.filter(x=>x.due<t&&(scope!=='pastel'||x.area==='Pastel')),due=open.filter(x=>x.due===t&&(scope!=='pastel'||x.area==='Pastel'));
  if(over.length)out.push({kind:'bad',text:`${over.length} overdue task${over.length>1?'s':''}`,act:'gotoTasks',args:{v:'overdue'},cta:'Show'});
  if(due.length)out.push({kind:'warn',text:`${due.length} task${due.length>1?'s':''} due today`,act:'gotoTasks',args:{v:'today'},cta:'Show'});
  if(life){for(let i=3;i>=1;i--){const d=addDays(t,-i),day=dayOf(d),miss=[];if(sleepMins(day)==null)miss.push('sleep');if(!reviewDone(day))miss.push('review');
    if(miss.length)out.push({kind:'warn',text:`${shortDate(d)}: no ${miss.join(' or ')} logged`,act:'goDay',args:{d},cta:'Fill in'})}}
  return out;
}

/* ---------------- timer (kept on this device) ---------------- */
let TIMER=null;
try{TIMER=JSON.parse(localStorage.getItem('daybook.timer')||'null')}catch(e){TIMER=null}
function saveTimer(){try{TIMER?localStorage.setItem('daybook.timer',JSON.stringify(TIMER)):localStorage.removeItem('daybook.timer')}catch(e){}}
function startTimer(k){if(TIMER)stopTimer(true);TIMER={k,start:Date.now(),date:todayISO()};saveTimer();render();toast('Timer started. Tap the green pill at the top to stop it.')}
function stopTimer(quiet){if(!TIMER)return;const mins=Math.max(1,Math.round((Date.now()-TIMER.start)/60000)),l=LANGS.find(x=>x.k===TIMER.k);const day=dayOf(TIMER.date);setDay(TIMER.date,{study:{[TIMER.k]:studyOf(day,TIMER.k)+mins}},{render:false});
  if(!quiet)toast(`Added ${mins} min of ${l?l.name:'study'}`);TIMER=null;saveTimer();render()}
function timerText(){if(!TIMER)return '';const s=Math.floor((Date.now()-TIMER.start)/1000);return `${Math.floor(s/3600)?Math.floor(s/3600)+':':''}${pad(Math.floor(s/60)%60)}:${pad(s%60)}`}

/* ---------------- render plumbing ---------------- */
let ptrDown=false,dirty=false;
document.addEventListener('pointerdown',()=>{ptrDown=true},true);
document.addEventListener('click',()=>{ptrDown=false;if(dirty)setTimeout(()=>render(),0)},true);
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>setTimeout(()=>{if(ptrDown){ptrDown=false;if(dirty)render()}},350),true));
document.addEventListener('click',e=>{const t=e.target;if(t.matches&&t.matches('input[type=date][data-f=pick]')&&t.showPicker){try{t.showPicker()}catch(err){}}});
const inUI=a=>a&&a.closest&&(a.closest('#main')||a.closest('#sheetBody'));
function typing(){const a=document.activeElement;return !!(inUI(a)&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&/^(text|search|)$/.test(a.type||''))))}
let rq=false;
function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;if(typing()){dirty=true;return}render()})}
document.addEventListener('focusout',e=>{if(inUI(e.target)&&dirty)setTimeout(()=>{if(!typing())render()},0)});
const TABS=[['today','Today',I.today],['money','Finance',I.money],['pastel','Pastel',I.pastel],['tasks','Tasks',I.tasks],['reports','Reports',I.reports]];
function render(){
  if(ptrDown){dirty=true;return}
  dirty=false;
  const a=document.activeElement,fid=a&&a.id&&a.closest&&a.closest('#main')?a.id:null;let sel=null;try{if(fid)sel=[a.selectionStart,a.selectionEnd]}catch(e){}
  $('#tabs').innerHTML=navHtml();
  $('#sync').textContent=S.db==='loading'?'Loading…':'';
  $('#timerSlot').innerHTML=TIMER?`<button class="timer-pill" data-act="stopTimer" aria-label="Stop timer"><span class="pulse"></span>${esc((LANGS.find(l=>l.k===TIMER.k)||{}).tag||'')} <span class="num" data-timer>${timerText()}</span> · Stop</button>`:'';
  let html='';
  if(S.db==='private'){html=`<div class="private"><h1>This daybook is private</h1><p>Only its owner can see and change what is logged here.</p></div>`;$('#fab').hidden=true}
  else{
    if(S.db==='off')html+=`<div class="banner"><b>Not saving.</b> This browser is blocking storage (for example a private window), so anything you enter disappears when you close it.</div>`;
    html+=(VIEWS[S.ui.tab]||VIEWS.today)();
  }
  $('#main').innerHTML=html;
  if(fid){const n=document.getElementById(fid);if(n){n.focus({preventScroll:true});try{if(sel&&sel[0]!=null)n.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  if(S.sheet&&S.sheet.kind==='sec')renderSheet();
}
setInterval(()=>{if(TIMER)document.querySelectorAll('[data-timer]').forEach(n=>n.textContent=timerText())},1000);
let lastDay=todayISO();

const attrs=o=>Object.entries(o||{}).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ');
const card=(title,chip,body,cls='')=>`<section class="card ${cls}"><header class="ch"><h2>${title}</h2>${chip||''}</header>${body}</section>`;

function pnav(key,kind){const l=periodLabel(kind,S.ui[key]);return `<div class="pnav"><button class="icon-btn" data-act="shift" data-key="${key}" data-kind="${kind}" data-n="-1" aria-label="Previous">${I.left}</button><div class="lbl"><b>${esc(l.main)}</b><small>${esc(l.sub)}</small></div><button class="icon-btn" data-act="shift" data-key="${key}" data-kind="${kind}" data-n="1" aria-label="Next">${I.right}</button></div>`}
const alertItems=list=>list.map(a=>`<li class="al ${a.kind}"><span class="dot"></span><span class="al-t">${esc(a.text)}</span>${a.act?`<button class="btn sm" data-act="${a.act}" ${attrs(a.args)}>${esc(a.cta||'Open')}</button>`:''}</li>`).join('');
function alertsBlock(list){
  if(!list.length)return `<div class="allclear" style="margin:0 0 14px">${I.tick} Nothing needs attention</div>`;
  const show=S.ui.allAlerts?list:list.slice(0,5);
  return `<section class="alerts"><h2 class="sec">Needs attention <span class="count">${list.length}</span></h2><ul>${alertItems(show)}</ul>${list.length>5?`<button class="link" data-act="toggleAlerts">${S.ui.allAlerts?'Show fewer':'Show all '+list.length}</button>`:''}</section>`;
}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,1.5,2,2.5,3,4,5,6,8,10])if(m*p>=v)return m*p;return 10*p}
function bars(days,series,{goal=0,goalLabel='',fmtY=v=>v}={}){
  const totals=days.map((d,i)=>sum(series,se=>se.values[i]));const max=niceMax(Math.max(goal,...totals,0)||1);
  const lab=days.length<=7?days.map(d=>WD[parseISO(d).getDay()].slice(0,2)):days.map((d,i)=>{const n=dayNum(d);return (i===0||n===1||n%5===0)?String(n):''});
  return `<div class="chart"><div class="plot">${[1,.5].map(f=>`<div class="gl" style="bottom:${f*100}%"><span>${fmtY(max*f)}</span></div>`).join('')}<div class="gl" style="bottom:0;border:0"><span>0</span></div>
  ${goal?`<div class="goal" style="bottom:${Math.min(goal/max,1)*100}%"><span>${esc(goalLabel)}</span></div>`:''}
  <div class="cols">${days.map((d,i)=>`<div class="col" title="${esc(shortDate(d))}: ${esc(series.map(se=>se.name+' '+fmtY(se.values[i]||0)).join(', '))}">${series.map(se=>{const v=se.values[i]||0;return v>0?`<i style="height:${v/max*100}%;background:${se.colorAt?se.colorAt(i):se.color}"></i>`:''}).join('')}</div>`).join('')}</div></div>
  <div class="xl">${lab.map(x=>`<span>${x}</span>`).join('')}</div>${series.length>1?`<div class="legend">${series.map(se=>`<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')}</div>`:''}</div>`;
}
function ring(done,total){const C=2*Math.PI*31,p=total?done/total:0;return `<div class="ring" role="img" aria-label="${done} of ${total} logged"><svg viewBox="0 0 76 76" width="76" height="76"><circle cx="38" cy="38" r="31" fill="none" stroke="var(--sunk)" stroke-width="8"/><circle cx="38" cy="38" r="31" fill="none" stroke="var(--mint)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(p*C).toFixed(1)} ${C.toFixed(1)}"/></svg><div class="rv"><div><b>${done}/${total}</b><small>logged</small></div></div></div>`}

function stats(r){
  const t=todayISO(),end=r.end<=addDays(t,1)?r.end:addDays(t,1),days=r.start<end?daysBetween(r.start,end):[];
  const o={days,n:days.length,sleep:[],beds:[],wakes:[],study:{},studyTotal:0,studyDays:0,read:0,pages:0,readDays:0,books:new Set(),rev:0,revMin:0,mood:[],energy:[],habits:{},top3Set:0,top3Done:0,notes:[]};
  LANGS.forEach(l=>o.study[l.k]=0);
  for(const d of days){const day=dayOf(d),sm=sleepMins(day);
    if(sm!=null){o.sleep.push(sm);const b=tmin(day.sleep.bed);o.beds.push(b<720?b+1440:b);o.wakes.push(tmin(day.sleep.wake))}
    LANGS.forEach(l=>o.study[l.k]+=studyOf(day,l.k));const st=studyTotal(day);o.studyTotal+=st;if(st)o.studyDays++;
    const rm=readMin(day)+learnReadMin(d);o.read+=rm;o.pages+=+(day.read&&day.read.pages)||0;if(rm)o.readDays++;if(day.read&&day.read.book)o.books.add(day.read.book);
    if(reviewDone(day)){o.rev++;o.revMin+=+day.review.min||0}
    if(day.review){if(day.review.mood)o.mood.push(+day.review.mood);if(day.review.energy)o.energy.push(+day.review.energy);if(String(day.review.note||'').trim())o.notes.push({d,note:day.review.note,mood:day.review.mood})}
    habits().forEach(h=>{if(day.habits&&day.habits[h])o.habits[h]=(o.habits[h]||0)+1});
    const t3=day.top3||{};[1,2,3].forEach(i=>{if(t3[i]&&String(t3[i].t||'').trim()){o.top3Set++;if(t3[i].done)o.top3Done++}});
  }
  const avg=a=>a.length?sum(a)/a.length:null;
  o.sleepAvg=avg(o.sleep);o.bedAvg=avg(o.beds);o.wakeAvg=avg(o.wakes);o.moodAvg=avg(o.mood);o.energyAvg=avg(o.energy);
  o.money=finTotals(r);
  const ss=sessionsIn(r);o.sess={held:ss.filter(s=>s.status==='held').length,canc:ss.filter(s=>s.status==='cancelled').length,ns:ss.filter(s=>s.status==='noshow').length,mine:ss.filter(s=>S.team[s.teacherId]&&S.team[s.teacherId].isMe),list:ss};
  o.learn=learnMinIn(r);o.learnN=lsessAll().filter(s=>inRange(s.date,r)&&s.kind==='learn').length;o.revN=lsessAll().filter(s=>inRange(s.date,r)&&s.kind==='review').length;
  o.tasksDone=Object.values(S.tasks).filter(x=>x.status==='done'&&x.doneAt&&inRange(x.doneAt,r)).length;
  return o;
}

  const good=(p>0)===goodWhenUp;return `<div class="d"><span class="${good?'up':'down'}">${p>0?'▲':'▼'} ${Math.abs(p)}%</span> vs ${prevWord(kind)}</div>`}

SEC.classes=d=>{
  if(!classesAll().length)return `<p class="empty">You haven't added any classes yet. Add them with their days in Pastel → Classes and they will show up here.</p><button type="button" class="btn" data-act="openClass" style="margin-top:12px">Add a class</button>`;
  const due=classesDue(d),ids=new Set(due.map(x=>x.c.id)),extra=Object.values(S.sessions).filter(s=>s.date===d&&!ids.has(s.classId));
  return `${due.length?due.map(({c,s,mk})=>`<div class="clsrow"><div class="clsinfo"><b>${esc(c.name)}${mk?' · make-up':''}</b><span class="hint">${c.time?esc(c.time)+' · ':''}${esc(teamName(c.teacherId))} · ${(c.studentIds||[]).length} student${(c.studentIds||[]).length===1?'':'s'}</span></div>${s?`<div style="display:flex;gap:8px;align-items:center">${statusPill(s)}<button type="button" class="btn sm" data-act="editSession" data-id="${s.id}">Change</button></div>`:`<div class="cbtns"><button type="button" class="btn primary" data-act="quickHeld" data-c="${c.id}" data-d="${d}">Held</button><button type="button" class="btn" data-act="quickStatus" data-s="cancelled" data-c="${c.id}" data-d="${d}">Cancelled</button><button type="button" class="btn" data-act="quickStatus" data-s="noshow" data-c="${c.id}" data-d="${d}">No-show</button></div>`}</div>`).join(''):'<p class="empty">No classes on your schedule for this day.</p>'}
  ${extra.length?`<div class="list" style="margin-top:8px">${extra.map(s=>`<button type="button" class="row" data-act="editSession" data-id="${s.id}"><span class="main"><span class="t">${esc(className(s.classId))}</span><span class="s">${esc(teamName(s.teacherId))}</span></span>${statusPill(s)}</button>`).join('')}</div>`:''}
  <button type="button" class="btn" data-act="logSession" data-d="${d}" style="margin-top:14px">Log another session</button>`};
SEC.reading=d=>{const r=dayOf(d).read||{},last=lastBook(d),books=[...new Set(Object.values(S.days).map(x=>x.read&&x.read.book).filter(Boolean))].slice(-30);
  return `<label class="fld"><span>Book</span><input class="in" id="f-book" data-f="book" list="booklist" value="${esc(r.book||'')}" placeholder="What are you reading?" autocomplete="off"><datalist id="booklist">${books.map(b=>`<option value="${esc(b)}">`).join('')}</datalist></label>
  ${!r.book&&last?`<button type="button" class="btn sm" data-act="useBook" data-v="${esc(last)}" style="margin-top:8px">Same as last time: ${esc(last)}</button>`:''}
  <p class="q" style="margin-top:20px">Minutes${learnReadMin(d)?` <span class="hint" style="font:500 13px var(--f-body)">+ ${learnReadMin(d)} min from Learning, already counted</span>`:''}</p><div class="stepper"><button type="button" class="sbtn" data-act="readAdd" data-n="-5" ${readMin(dayOf(d))?'':'disabled'}>−5</button><label class="sval"><input id="f-rmin" data-f="readMin" inputmode="numeric" value="${readMin(dayOf(d))}" aria-label="Reading minutes">min</label><button type="button" class="sbtn plus" data-act="readAdd" data-n="15">+15</button><button type="button" class="sbtn plus" data-act="readAdd" data-n="30">+30</button></div>
  <p class="q" style="margin-top:20px">Pages</p><div class="stepper"><button type="button" class="sbtn" data-act="pagesAdd" data-n="-5" ${+r.pages?'':'disabled'}>−5</button><label class="sval"><input id="f-pages" data-f="pages" inputmode="numeric" value="${+r.pages||0}" aria-label="Pages read">pages</label><button type="button" class="sbtn plus" data-act="pagesAdd" data-n="5">+5</button><button type="button" class="sbtn plus" data-act="pagesAdd" data-n="10">+10</button></div>`};
SEC.habits=d=>{const hs=habits(),h=dayOf(d).habits||{};if(!hs.length)return '<p class="empty">You have no habits set. Add some in Settings.</p><button type="button" class="link" data-act="settings">Open Settings</button>';
  return `<div class="hgrid">${hs.map(x=>`<button type="button" class="hbig" data-act="habit" data-h="${esc(x)}" aria-pressed="${!!h[x]}"><span class="hcheck">${h[x]?I.tick:''}</span>${esc(x)}</button>`).join('')}</div><button type="button" class="link" data-act="settings" style="margin-top:8px">Change the habit list</button>`};
SEC.money=d=>{const list=Object.values(S.money).filter(m=>m.date===d).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const inn=sum(list.filter(m=>m.type==='in'),m=>m.amount),out=sum(list.filter(m=>m.type==='out'),m=>m.amount);
  return `${list.length?`<div class="list">${list.map(moneyRow).join('')}</div><div class="result" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>In <span class="amt in">${fmtT(inn)}</span></span><span>Out <span class="amt">${fmtT(out)}</span></span></div>`:'<p class="empty">Nothing logged for this day. If you spent or received money, add it here.</p>'}
  <div class="addgrid" style="margin-top:14px"><button type="button" class="btn" data-act="addMoney" data-t="out">${I.out}Add expense</button><button type="button" class="btn" data-act="addMoney" data-t="in">${I.inn}Add income</button></div>`};
SEC.review=d=>{const r=dayOf(d).review||{};
  const row=(k,labels)=>`<div class="moods">${labels.map((l,i)=>`<button type="button" class="mood" data-act="rate" data-k="${k}" data-v="${i+1}" aria-pressed="${+r[k]===i+1}"><b>${i+1}</b><span>${l}</span></button>`).join('')}</div>`;
  return `<p class="q">How was your day?</p>${row('mood',MOODS)}<p class="q" style="margin-top:18px">Your energy</p>${row('energy',ENERGY)}
  <p class="q" style="margin-top:18px">Notes</p><textarea class="in" id="f-note" data-f="note" placeholder="What went well? What didn't? What will you change tomorrow?">${esc(r.note||'')}</textarea>
  <p class="q" style="margin-top:18px">How long did this review take?</p><div class="pick">${[5,10,15,20,30,45].map(v=>`<button type="button" class="pk" data-act="revSet" data-v="${v}" aria-pressed="${+r.min===v}">${v} min</button>`).join('')}</div>
  ${d===todayISO()?`<button type="button" class="btn" data-act="planTomorrow" style="margin-top:16px">Plan tomorrow's Top 3 ${I.right}</button>`:''}`};
function secTitle(sec,d){const t=todayISO();if(sec==='top3')return d>t?"Tomorrow's Top 3":d===t?"Today's Top 3":'Top 3';if(sec==='sleep')return 'Sleep';if(sec==='classes')return d===t?"Today's classes":'Classes';if(sec==='money')return d===t?'Money today':'Money';return SECS[sec][0]}

/* ---------------- sheets (forms) ---------------- */
const SHEETS={},READ={},SAVE={};
const head=(title)=>`<div class="sh-head"><h2 style="margin-right:auto">${esc(title)}</h2><button type="button" class="icon-btn" data-act="closeSheet" aria-label="Close">${I.x}</button></div>`;
const foot=(delKind,label='Save')=>`<div class="sh-foot">${delKind?`<button type="button" class="btn danger" data-act="del" data-k="${delKind}">Delete</button>`:''}<span class="spacer"></span><button type="button" class="btn" data-act="closeSheet">Cancel</button><button class="btn primary" type="submit">${label}</button></div>`;
const errLine=dr=>dr.err?`<div class="err" role="alert">${esc(dr.err)}</div>`:'';
function fd(form){const o={};for(const [k,v] of new FormData(form).entries()){if(k in o)o[k]=[].concat(o[k],v);else o[k]=v}return o}
const arr=v=>v==null?[]:[].concat(v);
const amtPrev=v=>{const n=parseAmount(v);return isFinite(n)&&n>0?`= ${fmtT(n)}`:'Type 3500000, 3.5m or 250k'};
const optList=(items,val,empty)=>`${empty!=null?`<option value="">${esc(empty)}</option>`:''}${items.map(([id,n])=>`<option value="${esc(id)}" ${String(id)===String(val??'')?'selected':''}>${esc(n)}</option>`).join('')}`;

SHEETS.sec=dr=>{const d=dr.date||S.ui.date,sec=dr.sec,f=S.flow,inFlow=!!(f&&!dr.date&&f.steps[f.i]===sec),st=secState(sec,d);
  const sub=`${inFlow?`Step ${f.i+1} of ${f.steps.length} · `:''}${shortDate(d)}${d===todayISO()?' · today':''}`;
  return `<div class="sh-head"><div style="margin-right:auto;min-width:0"><h2>${esc(secTitle(sec,d))}</h2><div class="step-ind">${esc(sub)}</div></div><button type="button" class="icon-btn" data-act="closeSheet" aria-label="Close">${I.x}</button></div>
  ${inFlow?`<div class="dots">${f.steps.map((s,i)=>`<i class="${i<=f.i?'on':''}"></i>`).join('')}</div>`:''}
  <div>${SEC[sec](d,dr)}</div>
  <div class="sh-foot">${inFlow?`${f.i>0?'<button type="button" class="btn" data-act="flowBack">Back</button>':''}<span class="spacer"></span>${st.done?'':'<button type="button" class="btn" data-act="flowNext">Skip</button>'}<button type="button" class="btn primary" data-act="flowNext">${f.i===f.steps.length-1?'Finish':'Next'}</button>`:`<span class="spacer"></span><button type="button" class="btn primary" data-act="closeSheet">Done</button>`}</div>`};

SHEETS.add=()=>`${head('Add something')}${capBox()}<div class="addgrid"><button class="btn" data-act="addMoney" data-t="out">${I.out}Money out</button><button class="btn" data-act="addMoney" data-t="in">${I.inn}Money in</button><button class="btn" data-act="addMove">${I.money}Withdrawal or transfer</button><button class="btn" data-act="finImport">${I.reports}Import bank file</button><button class="btn" data-act="logSession">${I.pastel}Class session</button><button class="btn" data-act="openTask">${I.tasks}Task</button><button class="btn" data-act="addWatch">${I.film}Film or series</button></div>`;

SHEETS.session=dr=>{
  const cls=classOf(dr.classId),opts=classesAll().filter(c=>(c.status||'Active')==='Active'||c.id===dr.classId).map(c=>[c.id,c.name+' · '+teamName(c.teacherId)]);

  <div class="row2"><label class="fld"><span>Date</span><input class="in" type="date" id="s-date" name="date" value="${esc(dr.date||S.ui.date)}"></label><label class="fld"><span>Minutes</span><input class="in num" id="s-min" name="minutes" inputmode="numeric" value="${esc(dr.minutes??(cls&&cls.minutes)??'')}" list="durs"><datalist id="durs"><option value="60"><option value="75"><option value="90"></datalist></label></div>

  <label class="fld"><span>${status==='held'?'What you covered':'Note'}</span><input class="in" id="s-note" name="note" value="${esc(dr.note||'')}" placeholder="Optional" autocomplete="off"></label>
  ${foot(dr.id?'session':'')}</form>`;
};
READ.session=f=>{const o=fd(f);o.absent=arr(o.absent);return o};
SAVE.session=dr=>{
  const cls=classOf(dr.classId);if(!cls){dr.err='Choose a class.';return false}
  const id=dr.id||uid(),old=dr.id?S.sessions[dr.id]:null,date=dr.date||S.ui.date,status=dr.status||'held';

  const e={date,classId:cls.id,teacherId:dr.teacherId||cls.teacherId||null,status,minutes:toInt(dr.minutes)||+cls.minutes||0,roster:roster.slice(),absent:status==='held'?arr(dr.absent).filter(x=>roster.includes(x)):[],
    cause:status==='cancelled'?(dr.cause||'Student'):null,reason:status==='cancelled'?String(dr.reason||'').trim():'',makeup:status==='cancelled'&&dr.makeup?dr.makeup:null,note:String(dr.note||'').trim(),deleted:false,updatedAt:Date.now(),createdAt:(old&&old.createdAt)||Date.now()};

    ...Object.values(S.sessions).filter(s=>(s.roster||[]).includes(dr.id)).map(s=>({d:s.date,html:`<button type="button" class="row" data-act="editSession" data-id="${s.id}"><span class="main"><span class="t">${esc(className(s.classId))}</span><span class="s">${esc(shortDate(s.date))}${(s.absent||[]).includes(dr.id)?' · absent':''}</span></span>${statusPill(s)}</button>`}))].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,30):[];

READ.student=f=>{const o=fd(f);o.classIds=arr(o.classIds);return o};
SAVE.student=dr=>{const name=String(dr.name||'').trim();if(!name){dr.err='Enter the student’s name.';return false}
  const id=dr.id||uid(),old=S.students[dr.id]||{};
  saveDoc('students',id,{name,phone:String(dr.phone||'').trim(),level:String(dr.level||'').trim(),goal:String(dr.goal||'').trim(),status:dr.status||'Active',note:String(dr.note||'').trim(),deleted:false,createdAt:old.createdAt||Date.now(),updatedAt:Date.now()},{render:false});
  const want=new Set(arr(dr.classIds));
  for(const c of classesAll()){const has=(c.studentIds||[]).includes(id);if(want.has(c.id)&&!has)saveDoc('classes',c.id,{studentIds:[...(c.studentIds||[]),id]},{render:false});if(!want.has(c.id)&&has)saveDoc('classes',c.id,{studentIds:(c.studentIds||[]).filter(x=>x!==id)},{render:false})}

  const r=periodRange('month',todayISO()),k=dr.id?teacherStats(dr.id,r):null,tasks=dr.id?Object.values(S.tasks).filter(x=>x.owner===dr.id&&x.status!=='done'):[];

/* sheet stack: a form opened from a topic sheet returns to it when closed */
function openSheet(kind,draft){S.sheet={kind,draft:draft||{}};renderSheet();$('#sheet').hidden=false;document.body.classList.add('locked');$('#sheet .panel').scrollTop=0;
  setTimeout(()=>{const a=$('#sheetBody [autofocus]');if(a&&window.matchMedia('(pointer:fine)').matches)a.focus()},40)}
function openSub(kind,draft){S.back=(S.sheet&&S.sheet.kind==='sec')?{kind:'sec',draft:S.sheet.draft}:null;openSheet(kind,draft)}
function closeSheet(){if(S.back&&S.sheet&&!(S.sheet.kind==='sec'&&!S.sheet.draft.date)){const b=S.back;S.back=null;openSheet(b.kind,b.draft);render();return}
  S.back=null;S.sheet=null;S.flow=null;$('#sheet').hidden=true;document.body.classList.remove('locked');$('#sheetBody').innerHTML='';render()}
function renderSheet(){if(!S.sheet)return;const a=document.activeElement,fid=a&&a.id&&a.closest&&a.closest('#sheetBody')?a.id:null;let sel=null;try{if(fid)sel=[a.selectionStart,a.selectionEnd]}catch(e){}
  const p=$('#sheet .panel'),sc=p.scrollTop;$('#sheetBody').innerHTML=SHEETS[S.sheet.kind](S.sheet.draft);p.scrollTop=sc;
  if(fid){const n=document.getElementById(fid);if(n){n.focus({preventScroll:true});try{if(sel&&sel[0]!=null)n.setSelectionRange(sel[0],sel[1])}catch(e){}}}}
function syncDraft(form){if(!S.sheet||!READ[form.dataset.form])return;const o=READ[form.dataset.form](form);const keep={id:S.sheet.draft.id,roster:S.sheet.draft.roster,isMe:S.sheet.draft.isMe};S.sheet.draft={...S.sheet.draft,...o,...Object.fromEntries(Object.entries(keep).filter(([,v])=>v!==undefined))}}
function openFlow(name,forToday){
  const d=forToday?todayISO():S.ui.date;if(forToday){S.ui.tab='today';S.ui.date=d;saveUi()}
  let steps=(FLOWS[name]||FLOWS.all).filter(s=>s!=='classes'||secState('classes',d).has).filter(s=>s!=='habits'||habits().length);
  if(name==='all'){const left=steps.filter(s=>!secState(s,d).done);if(left.length)steps=left}
  if(!steps.length)steps=['review'];
  S.back=null;S.flow={name,steps,i:0};render();openSheet('sec',{sec:steps[0]});
}
function startPendingFlow(){if(PENDING_FLOW){const f=PENDING_FLOW;PENDING_FLOW=null;openFlow(f,true)}}
window.addEventListener('hashchange',()=>{readHash();if(PENDING_FLOW&&S.db!=='loading')startPendingFlow();else render()});

const ACT={};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.form;
  if(k==='qtask'){const o=fd(f),title=String(o.title||'').trim();if(!title)return;const id=uid();
    saveDoc('tasks',id,{title,owner:o.owner||'me',due:o.due===''?null:addDays(todayISO(),+o.due),area:o.owner&&o.owner!=='me'?'Pastel':'Personal',status:'open',note:'',doneAt:null,deleted:false,createdAt:Date.now(),updatedAt:Date.now()},{render:false});
    S.ui.taskView='open';render();const n=$('#f-qt');if(n){n.value='';n.focus()}toast('Task added');return}
  if(S.sheet&&SAVE[k]){syncDraft(f);const ok=SAVE[k](S.sheet.draft);if(ok==='keep')return;if(ok)closeSheet();else renderSheet()}});
document.addEventListener('input',e=>{const el=e.target;
  if(el.closest('#sheetBody')&&!el.dataset.f){if(el.name==='amount'){const p=$('#amtPrev');if(p)p.textContent=amtPrev(el.value)}
    if(el.dataset.filter){const q=el.value.trim().toLowerCase();document.querySelectorAll(el.dataset.filter+' label').forEach(l=>{l.hidden=!!q&&!l.dataset.name.includes(q)})}
    const f=el.closest('form[data-form]');if(f&&el.name)syncDraft(f);return}
  const f=el.dataset.f,d=curDate();
  if(f==='book')setDay(d,{read:{book:el.value}},{render:false,debounce:900});
  else if(f==='note')setDay(d,{review:{note:el.value}},{render:false,debounce:900});
  else if(f==='top')setDay(d,{top3:{[el.dataset.i]:{t:el.value}}},{render:false,debounce:900});
  else if(f==='sq'){S.ui.studentQuery=el.value;render()}
  else if(f==='txq'){S.ui.txQ=el.value;S.ui.txSel=[];render()}
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.closest('#sheetBody')&&!el.dataset.f){const f=el.closest('form[data-form]');if(!f)return;const prev={...S.sheet.draft};syncDraft(f);const dr=S.sheet.draft;
    if(f.dataset.form==='session'&&el.name==='classId'){const c=classOf(dr.classId);dr.roster=c?(c.studentIds||[]).slice():[];dr.absent=[];if(c){dr.minutes=c.minutes;dr.teacherId=c.teacherId}}
    if(f.dataset.form==='money'&&el.name==='studentId'&&dr.studentId&&!dr.id){const c=Object.values(S.classes).find(x=>(x.studentIds||[]).includes(dr.studentId));if(c){dr.sessions=String(termSize(c));if(!dr.amount&&c.price)dr.amount=String(c.price)}}
    if(f.dataset.form==='money'&&(el.name==='type'||el.name==='area')&&prev.cat===dr.cat)dr.cat=null;
    if(el.hasAttribute('data-re')||el.name==='payType')renderSheet();return}
  const f=el.dataset.f,d=curDate();if(!f)return;
  if(f==='bed'||f==='wake')setDay(d,{sleep:{[f]:el.value||null}});
  else if(f==='study')setDay(d,{study:{[el.dataset.k]:toInt(el.value)}});
  else if(f==='readMin')setDay(d,{read:{min:toInt(el.value)}});
  else if(f==='pages')setDay(d,{read:{pages:toInt(el.value)}});
  else if(f==='pick'&&el.value){S.ui.date=el.value;render()}
  else if(f==='restore'){readBackupFile(el.files&&el.files[0],false);el.value=''}
  else if(f==='checkbk'){readBackupFile(el.files&&el.files[0],true);el.value=''}
  else if(f==='sessTeacher'){S.ui.sessTeacher=el.value;render()}
  else if(f==='taskOwner'){S.ui.taskOwner=el.value;saveUi();render()}
  else if(f==='txAcc'){S.ui.txAcc=el.value;S.ui.txSel=[];render()}
  else if(f==='finStart'||f==='finEnd'){if(el.value)saveDoc('settings','fin',{reset:{...S.fin.reset,[f==='finStart'?'start':'end']:el.value}})}
  else if(f==='impAcc'){S.sheet.draft.accountId=el.value;renderSheet()}
  else if(f==='fimport'){const file=el.files&&el.files[0];el.value='';if(!file)return;const acc=S.sheet.draft.accountId;
    readStatement(file).then(rows=>{rows=rows.filter(r=>r&&r.some(c=>String(c).trim()));if(!rows.length)throw new Error('empty');const hr=guessHeader(rows),mp=guessMap(rows[hr]||[]);
      openSheet('fimport',{accountId:acc,file:file.name,rows,headerRow:hr,map:mp,mode:mp.credit!=null||mp.debit!=null||mp.amount==null?'split':'signed',unit:'rial'})})
    .catch(err=>{openSheet('fimport',{accountId:acc,err:err&&err.message==='biff'?'This is an old-style Excel file (.xls). Open it in Excel or Numbers and export it as .xlsx or CSV, then try again.':err&&err.message==='empty'?'That file has no rows.':'Could not read that file. Try exporting it from the bank as Excel (.xlsx) or CSV.'})})}
});

async function shareFile(name,data,mime){

}

/* ================= Finance Hub (phase 1: financial clarity) =================
   One store for every money movement: the existing `money` collection. Each entry is one transaction on one
   account (or on no account), with a direction (type in/out), a whole-toman integer amount, a financial
   purpose (kind) and an owner (area: Personal or Pastel). Splits divide one payment into several purposes.
   Money moving between your own pockets (transfers, reserve moves, withdrawals, capital) is never income or spending. */
const FKINDS={
  p_out:{l:'Personal expense',dir:'out',area:'Personal',cats:true},
  b_out:{l:'Pastel expense',dir:'out',area:'Pastel',cats:true},
  p_in:{l:'Personal income',dir:'in',area:'Personal',cats:true},
  b_in:{l:'Pastel receipt',dir:'in',area:'Pastel',cats:true},
  draw:{l:'Founder withdrawal',s:'Money you took out of Pastel'},
  contrib:{l:'Founder capital',s:'Your own money put into Pastel'},
  transfer:{l:'Transfer between my accounts'},
  reserve:{l:'Savings / reserve move'},
  refund:{l:'Refund'},
  loan:{l:'Loan or debt'},
  uncat:{l:'Not sorted yet'}
};
const KIND_ORDER={out:['p_out','b_out','draw','transfer','reserve','contrib','refund','loan','uncat'],in:['b_in','p_in','draw','transfer','reserve','contrib','refund','loan','uncat']};
const OWN_MOVES=['draw','contrib','transfer','reserve'];
const ACC_TYPES=[['personal','Personal bank account','Personal'],['operating','Pastel operating account','Pastel'],['reserve','Pastel reserve account','Pastel'],['savings','Personal savings account','Personal'],['cash','Cash wallet','Personal'],['mixed','Old mixed account','Mixed'],['other','Other account','Personal']];
const accTypeLabel=t=>(ACC_TYPES.find(x=>x[0]===t)||ACC_TYPES[6])[1];
const DEFAULT_FIN={reset:{start:'',end:'',done:false,skipped:false,reportSeen:false},rules:[],batches:[],
  plan:{draw:50000000,buffer:20000000},
  assumptions:{revenue:140000000,costs:60000000,surplus:80000000,living:40000000}};
const kindOf=m=>m.kind&&FKINDS[m.kind]?m.kind:(m.area==='Pastel'?(m.type==='in'?'b_in':'b_out'):(m.type==='in'?(m.cat==='From Pastel'?'draw':'p_in'):'p_out'));
const kindLabel=(k,dir)=>{if(k==='draw')return dir==='in'?'Withdrawal received':'Founder withdrawal';if(k==='contrib')return dir==='in'?'Capital from you':'Capital to Pastel';if(k==='refund')return dir==='in'?'Refund received':'Refund paid';return (FKINDS[k]||FKINDS.uncat).l};
const statusOf=m=>m.status||'ok';
const accOf=id=>id&&(S.accounts[id]||(ARCH.accounts&&ARCH.accounts[id]));
const accName=id=>{const a=accOf(id);return a?a.name:''};
const accOwner=id=>{const a=accOf(id);return a?a.owner||'Personal':null};
const bizCash=id=>{const o=accOwner(id);return o==='Pastel'||o==='Mixed'};
const accountsAll=(all=false)=>Object.values(S.accounts).filter(a=>all||a.active!==false).sort(byName);
/* every transaction becomes one or more purpose lines (more than one when split) */
function txLines(m){const k=kindOf(m),base={id:m.id,date:m.date,dir:m.type,accountId:m.accountId||null,status:statusOf(m),pairId:m.pairId||null,tx:m};
  if(Array.isArray(m.splits)&&m.splits.length)return m.splits.map((s,i)=>({...base,i,kind:s.kind||k,area:s.area||m.area,cat:s.cat||'',amount:+s.amount||0}));
  return [{...base,i:0,kind:k,area:m.area||(FKINDS[k]&&FKINDS[k].area)||'Personal',cat:m.cat||'',amount:+m.amount||0}]}
const txIn=r=>Object.values(S.money).filter(m=>inRange(m.date,r));
const linesIn=r=>txIn(r).flatMap(txLines);
const needsSort=l=>l.kind==='uncat'||l.status==='new'||l.status==='flag';
/* draws: count the out-leg from Pastel money; count an in-leg on a personal account only when no out-leg is paired with it */
function finAgg(r){
  const L=linesIn(r),o={lines:L,n:L.length,
    tuition:0,receipts:0,stuRefunds:0,opex:0,vendorRefunds:0,drawsDirect:0,drawsRecv:0,personalFromBiz:0,contrib:0,
    pIn:0,pOut:0,pRefunds:0,saved:0,loanIn:0,loanOut:0,moved:0,unsorted:0,unsortedAmt:0,flagged:0,reviewed:0,cashIn:0,cashOut:0,
    pCats:{},bCats:{}};
  const paired=new Set(L.filter(l=>l.kind==='draw'&&l.dir==='out').map(l=>l.pairId).filter(Boolean));
  for(const l of L){const a=l.amount;
    if(l.i===0){if(l.dir==='in')o.cashIn+=+l.tx.amount||0;else o.cashOut+=+l.tx.amount||0}
    if(needsSort(l)){o.unsorted++;o.unsortedAmt+=a}else o.reviewed++;if(l.status==='flag')o.flagged++;
    switch(l.kind){
      case 'b_in':if(l.dir==='in'){o.receipts+=a;if(/tuition|شهریه/i.test(l.cat))o.tuition+=a;o.bCats['in:'+(l.cat||'Other')]=(o.bCats['in:'+(l.cat||'Other')]||0)+a}else o.stuRefunds+=a;break;
      case 'b_out':if(l.dir==='out'){o.opex+=a;o.bCats[l.cat||'Other']=(o.bCats[l.cat||'Other']||0)+a}else o.vendorRefunds+=a;break;
      case 'p_in':if(l.dir==='in')o.pIn+=a;else o.pOut+=a;break;
      case 'p_out':if(l.dir==='out'){o.pOut+=a;o.pCats[l.cat||'Other']=(o.pCats[l.cat||'Other']||0)+a;if(l.accountId&&bizCash(l.accountId))o.personalFromBiz+=a}else o.pRefunds+=a;break;
      case 'refund':if(l.area==='Pastel'){if(l.dir==='out')o.stuRefunds+=a;else o.vendorRefunds+=a}else{if(l.dir==='in')o.pRefunds+=a;else o.pOut+=a}break;
      case 'draw':o.moved+=a;if(l.dir==='out'){if(!l.accountId||bizCash(l.accountId))o.drawsDirect+=a}else{o.drawsRecv+=a;if(!(l.pairId&&paired.has(l.pairId))&&!(l.accountId&&bizCash(l.accountId)))o.drawsDirect+=a}break;
      case 'contrib':o.moved+=a;if(l.dir==='in'||!l.pairId)o.contrib+=a;break;
      case 'reserve':o.moved+=a;if(l.dir==='out'&&l.area==='Personal')o.saved+=a;break;
      case 'transfer':o.moved+=a;break;
      case 'loan':if(l.dir==='in')o.loanIn+=a;else o.loanOut+=a;break;
    }}
  o.bizIn=o.receipts-o.stuRefunds;o.bizOut=o.opex-o.vendorRefunds;o.bizNet=o.bizIn-o.bizOut;
  o.persOut=o.pOut-o.pRefunds;o.draws=o.drawsDirect+o.personalFromBiz;
  o.pct=o.n?Math.round(o.reviewed/o.n*100):100;
  o.bizLines=L.filter(l=>l.area==='Pastel'&&['b_in','b_out','refund'].includes(l.kind));
  return o}
/* the numbers older screens (Reports, Pastel overview) show, now purpose-aware */
function finTotals(r){const a=finAgg(r);return {Pastel:{in:a.bizIn,out:a.bizOut},Personal:{in:a.pIn,out:a.persOut}}}
/* balances: opening balance on its date plus every movement on or after it */
function accBalance(acc,upTo){if(!acc)return null;const start=acc.openingDate||'0000-01-01';let b=+acc.opening||0;
  for(const m of Object.values(S.money)){if(m.accountId!==acc.id||m.date<start)continue;if(upTo&&m.date>=upTo)continue;b+=m.type==='in'?(+m.amount||0):-(+m.amount||0)}return b}
const hasOpening=acc=>acc&&acc.opening!=null&&acc.opening!==''&&!!acc.openingDate;
/* recognised tuition: each linked payment buys sessions at its own price; delivered sessions earn it */
function tuitionRecog(r){
  let recog=0,owed=0,linked=0,unlinked=0;const t=todayISO();
  for(const st of Object.values(S.students)){const pays=Object.values(S.money).filter(m=>m.type==='in'&&m.studentId===st.id&&+m.sessions>0);
    if(!pays.length)continue;const paidS=sum(pays,p=>p.sessions),paidA=sum(pays,p=>p.amount),rate=paidA/paidS;
    const used=Object.values(S.sessions).filter(s=>(s.roster||[]).includes(st.id)&&usedUnit2(s,st.id)).map(s=>s.date).sort();
    const before=used.filter(d=>d<r.start).length,during=used.filter(d=>inRange(d,r)).length,upToEnd=used.filter(d=>d<r.end).length;
    const earnable=Math.max(0,Math.min(during,paidS-before));recog+=Math.round(earnable*rate);owed+=Math.round(Math.max(0,paidS-upToEnd)*rate)}
  for(const m of txIn(r).filter(m=>kindOf(m)==='b_in'&&m.type==='in'&&/tuition|شهریه/i.test(m.cat||'')))(m.studentId&&+m.sessions>0)?linked++:unlinked++;
  return {recog,owed,linked,unlinked}}
function usedUnit2(s,sid){const ab=(s.absent||[]).includes(sid);if(s.status==='held')return !ab||S.settings.noshowCounts;if(s.status==='noshow')return S.settings.noshowCounts;return false}
const owedTeachers=()=>sum(teamList(true).filter(t=>t.payType!=='none'),t=>Math.max(0,teacherStats(t.id,periodRange('month',todayISO())).balance));

function resetRange(){const R=S.fin.reset;let start=R.start,end=R.end;
  if(!start){const m0=periodRange('month',todayISO()).start;start=periodRange('month',addDays(m0,-1)).start}

function resetSteps(){const r=resetRange(),accs=accountsAll(),tx=txIn(r),L=tx.flatMap(txLines),uns=L.filter(needsSort).length;

    {k:'sort',t:'Separate Personal and Pastel',d:L.length?(uns?`${L.length-uns} of ${L.length} sorted · ${uns} to go`:`All ${L.length} sorted`):'Mark each payment as personal, Pastel, a withdrawal or a transfer.',done:L.length>0&&!uns,act:'finSort',cta:L.length&&!uns?'Review':'Sort now'},
    {k:'rec',t:'Match account balances',d:withTx.length?`${withTx.filter(a=>lastRec(a,r.endD)).length} of ${withTx.length} accounts checked against the bank`:'Compare what the app calculates with what the bank says.',done:recDone,act:'finSub',args:{v:'accounts'},cta:'Check balances'},
    {k:'rep',t:'See your first real report',d:'Where your money actually went over these two months.',done:!!S.fin.reset.reportSeen,act:'finSub',args:{v:'audit'},cta:'Open report'}]}
function lastRec(acc,onOrAfter){const recs=acc.recs||{};const ds=Object.keys(recs).filter(d=>!onOrAfter||d>=onOrAfter).sort();return ds.length?{date:ds[ds.length-1],bal:recs[ds[ds.length-1]]}:null}

VIEWS.money=()=>{
