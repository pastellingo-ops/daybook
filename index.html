   <div class="legend"><span><i style="background:var(--mint)"></i>${area==='Pastel'?'Receipts':'Income + from Pastel'}</span><span><i style="background:var(--ink);opacity:.55"></i>${area==='Pastel'?'Operating costs':'Spending'}</span><span>Top: ${fmtShort(mx)}</span></div>`}
function accountsTable(){const accs=accountsAll();if(!accs.length)return `<div class="empty">No accounts yet.</div><button class="btn sm" data-act="finAddAcc" style="margin-top:8px">Add account</button>`;
  return `<div class="list">${accs.map(x=>`<button class="row" data-act="finAcc" data-id="${x.id}"><span class="main"><span class="t">${esc(x.name)}</span><span class="s">${esc(accTypeLabel(x.type))} · ${esc(x.owner)}</span></span><span class="amt">${hasOpening(x)?fmtT(accBalance(x)):'<span class="pill warn">No opening balance</span>'}</span></button>`).join('')}</div>`}

/* Money audit report for the reset period */
FIN.audit=()=>{const r=resetRange(),a=finAgg(r);
  if(!S.fin.reset.reportSeen&&a.n){setTimeout(()=>saveDoc('settings','fin',{reset:{...S.fin.reset,reportSeen:true}},{render:false}),0)}
  const accs=accountsAll(true).filter(x=>txIn(r).some(m=>m.accountId===x.id));
  const recRows=accs.map(x=>{const rec=lastRec(x,null),open=hasOpening(x)?accBalance(x,r.startD):null,calc=hasOpening(x)?accBalance(x,rec?addDays(rec.date,1):r.end):null;const diff=rec&&calc!=null?rec.bal-calc:null;
    return {x,open,calc,rec,diff,inn:sum(txIn(r).filter(m=>m.accountId===x.id&&m.type==='in'),m=>m.amount),out:sum(txIn(r).filter(m=>m.accountId===x.id&&m.type==='out'),m=>m.amount)}});
  const diffs=recRows.filter(z=>z.diff),unrec=recRows.filter(z=>!z.rec);
  const sortedPct=a.pct;
  return `<div class="ph" style="margin-top:0"><div><h2 class="fr-h" style="font-size:20px">Money audit</h2><div class="fr-period" style="margin:4px 0 0"><input class="in" type="date" data-f="finStart" id="f-as" value="${r.startD}"><span class="hint">to</span><input class="in" type="date" data-f="finEnd" id="f-ae" value="${r.endD}"><span class="hint">${esc(shortDate(r.startD))} – ${esc(shortDate(r.endD))}</span></div></div></div>
  <div class="tiles">${amtTile('Money in',a.cashIn,'every deposit, all accounts')}${amtTile('Money out',a.cashOut,'every payment, all accounts')}${amtTile('Personal spending',a.persOut,'sorted as personal')}${amtTile('Pastel payments',a.bizOut,'sorted as Pastel costs')}${amtTile('Founder withdrawals',a.draws,`${fmtShort(a.drawsDirect)} direct · ${fmtShort(a.personalFromBiz)} personal from Pastel money`)}${amtTile('Pastel receipts',a.bizIn)}
   <div class="tile ${a.unsorted?'warnt':''}"><div class="k">Not identified</div><div class="v">${fmtShort(a.unsortedAmt)}</div><div class="d">${a.unsorted} transaction${a.unsorted===1?'':'s'} unsorted or unclear</div></div>
   <div class="tile"><div class="k">Reviewed</div><div class="v">${sortedPct}%</div><div class="prog"><i style="width:${sortedPct}%"></i></div></div>
   <div class="tile ${diffs.length?'warnt':''}"><div class="k">Balance differences</div><div class="v">${diffs.length?fmtShort(sum(diffs,z=>Math.abs(z.diff))):unrec.length?'—':'0'}</div><div class="d">${diffs.length?diffs.length+' account'+(diffs.length>1?'s':'')+' don’t match the bank':unrec.length?unrec.length+' not checked yet':'all checked accounts match'}</div></div></div>
  <div class="grid2" style="margin-top:14px">
   ${card('Accounts in this period','',recRows.length?`<div class="tblw"><table class="tbl"><thead><tr><th>Account</th><th class="r">In</th><th class="r">Out</th><th class="r">Bank says</th><th class="r">Difference</th></tr></thead><tbody>${recRows.map(z=>`<tr data-act="finRec" data-id="${z.x.id}"><td>${esc(z.x.name)}</td><td class="r">${fmtShort(z.inn)}</td><td class="r">${fmtShort(z.out)}</td><td class="r">${z.rec?fmtShort(z.rec.bal):'—'}</td><td class="r">${z.diff==null?(z.rec?'<span class="pill warn">no opening</span>':'<span class="pill">check</span>'):z.diff?`<span class="down">${fmtN(z.diff)}</span>`:'<span class="pill ok">matches</span>'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No account has transactions in this period yet.</div>')}
   ${card('What happened, in plain words','',auditStory(a))}
   ${card('Imported files','',importsList())}
  </div>
  <div class="btn-row"><button class="btn primary" data-act="finImport">Import a bank file</button><button class="btn" data-act="finSort">Sort transactions</button><button class="btn" data-act="export" data-k="fintx">Export transactions (CSV)</button></div>`};
function auditStory(a){if(!a.n)return '<div class="empty">Nothing to report yet. Bring in the last two months first.</div>';
  const lines=[`Pastel took in <b>${fmtT(a.bizIn)}</b> and spent <b>${fmtT(a.bizOut)}</b> on running the school.`,
    `You took <b>${fmtT(a.draws)}</b> out of Pastel: ${fmtT(a.drawsDirect)} as direct withdrawals and ${fmtT(a.personalFromBiz)} as personal spending paid straight from Pastel or the shared account.`,
    `Your personal spending was <b>${fmtT(a.persOut)}</b>${a.pIn?`, against ${fmtT(a.pIn)} of other personal income`:''}.`,
    a.moved?`${fmtT(a.moved)} only moved between your own accounts and is not counted as income or spending.`:'',
    (()=>{const ul=unlinkedMoves(resetRange()).length;return ul?`<span class="down">${ul} withdrawals or transfers look like two sides of the same move but aren’t linked yet, so they may be counted twice. Open each one and tap Link.</span>`:''})(),
    a.unsorted?`<span class="down">${a.unsorted} transaction${a.unsorted>1?'s':''} (${fmtT(a.unsortedAmt)}) ${a.unsorted>1?'are':'is'} still unidentified, so these totals will change.</span>`:'Every transaction in this period is sorted.'];
  return lines.filter(Boolean).map(x=>`<p class="story">${x}</p>`).join('')}
function importsList(){const b=(S.fin.batches||[]).slice().reverse();if(!b.length)return '<div class="empty">No bank files imported yet.</div>';
  return `<div class="list">${b.map(x=>{const live=Object.values(S.money).filter(m=>m.batchId===x.id).length;return `<div class="row"><span class="main"><span class="t">${esc(x.file)}</span><span class="s">${esc(accName(x.accountId)||'—')} · ${live} transactions${x.dup?' · '+x.dup+' duplicates skipped':''} · ${esc(new Date(x.at).toLocaleDateString('en-GB'))}</span></span>${live?`<button class="btn sm danger" data-act="finUndoBatch" data-id="${x.id}">Undo</button>`:'<span class="pill">Removed</span>'}</div>`}).join('')}</div>`}

/* Transactions */
FIN.tx=()=>{const U=S.ui,range=U.txRange==='reset'?resetRange():U.txRange==='all'?{start:'0000-01-01',end:'9999-12-31'}:periodRange('month',U.finAnchor);
  let list=txIn(range);const q=U.txQ.trim().toLowerCase();
  if(U.txStatus==='review')list=list.filter(m=>txLines(m).some(needsSort));else if(U.txStatus==='flag')list=list.filter(m=>statusOf(m)==='flag');
  if(U.txArea!=='All')list=list.filter(m=>txLines(m).some(l=>l.area===U.txArea&&!OWN_MOVES.includes(l.kind)));
  if(U.txAcc!=='all')list=list.filter(m=>(m.accountId||'none')===U.txAcc);
  if(q)list=list.filter(m=>[m.note,m.cat,m.cp,(m.src&&m.src.desc),accName(m.accountId),String(m.amount)].join(' ').toLowerCase().includes(q));
  list.sort((a,b)=>b.date.localeCompare(a.date)||String(b.time||'').localeCompare(String(a.time||''))||(b.createdAt||0)-(a.createdAt||0));
  const sel=new Set(U.txSel),shown=list.slice(0,300);
  const accOpts=[['all','All accounts'],...accountsAll(true).map(x=>[x.id,x.name]),['none','No account']];
  const nf=(U.txRange!=='month')+(U.txAcc!=='all')+(U.txArea!=='All')+(!!U.txQ.trim());
  return `<div class="toolbar">${segBtns('txStatus',[['all','All'],['review','To sort'],['flag','Unclear']],U.txStatus)}<button class="btn sm ${nf?'on':''}" data-act="txFilt">${U.txFilt?'Hide filters':'Filters'}${nf?' · '+nf:''}</button></div>
  ${U.txFilt?`<div class="filters"><input class="in" type="search" id="f-txq" data-f="txq" placeholder="Search description or amount" value="${esc(U.txQ)}">${segBtns('txRange',[['month','This month'],['reset','Reset period'],['all','Everything']],U.txRange)}<select class="in" data-f="txAcc" id="f-txacc">${optList(accOpts,U.txAcc)}</select>${segBtns('txArea',[['All','Everyone'],['Personal','Personal'],['Pastel','Pastel']],U.txArea)}</div>`:''}
  ${sel.size?`<div class="selbar"><b>${sel.size} selected</b><button class="btn sm primary" data-act="finBulk">Sort selected</button><button class="btn sm" data-act="finSelSame">Select same description</button><button class="btn sm" data-act="finSelNone">Clear</button></div>`:''}
  ${card('Transactions',`<span class="pill">${list.length}</span>${list.length?`<button class="link" data-act="finSelAll" style="padding:0 0 0 8px">Select all${list.length>300?' shown':''}</button>`:''}`,shown.length?`<div class="list">${shown.map(m=>txRow(m,sel.has(m.id))).join('')}</div>${list.length>300?'<p class="hint">Showing the first 300. Narrow the search to see more.</p>':''}`:`<div class="empty">${U.txStatus==='review'?'Nothing left to sort here.':'No transactions match.'}</div>`)}`};
function txRow(m,checked){const L=txLines(m),k=L[0].kind,ns=L.some(needsSort),st=statusOf(m);
  const title=m.splits&&m.splits.length?`Split · ${L.map(l=>l.area).filter((v,i,a)=>a.indexOf(v)===i).join(' + ')}`:(['p_in','p_out','b_in','b_out'].includes(k)?(m.cat||kindLabel(k,m.type)):kindLabel(k,m.type));
  let desc=(m.src&&m.src.desc)||m.note||'';const ttl0=title;
  const who=m.studentId?studentName(m.studentId):m.teamId?teamName(m.teamId):'';
  const quick=ns&&S.ui.finSub==='tx'?`<div class="qk">${(m.type==='out'?[['p_out','Personal'],['b_out','Pastel'],['draw','Withdrawal'],['transfer','Transfer']]:[['b_in','Pastel'],['p_in','Personal'],['draw','From Pastel'],['transfer','Transfer']]).map(([kk,l])=>`<button type="button" class="qb" data-act="finQuick" data-id="${m.id}" data-k="${kk}">${l}</button>`).join('')}</div>`:'';
  const t2=ns&&desc?desc:ttl0;if(ns&&desc)desc=kindLabel(k,m.type);
  return `<div class="txr ${ns?'ns':''}"><label class="tsel"><input type="checkbox" data-act="finSel" data-id="${m.id}" ${checked?'checked':''} aria-label="Select"></label><button type="button" class="row" data-act="editMoney" data-id="${m.id}"><span class="main"><span class="t">${esc(t2)}${who?' · '+esc(who):''}</span><span class="s">${esc(shortDate(m.date))}${m.time?' '+esc(m.time):''}${m.accountId?' · '+esc(accName(m.accountId)):''}${desc&&desc!==t2?' · '+esc(desc):''}</span></span>${st==='flag'?'<span class="pill warn">Unclear</span>':k==='uncat'||st==='new'?'<span class="pill">To sort</span>':''}<span class="amt ${m.type}">${m.type==='in'?'+':'−'}${fmtN(m.amount)}</span></button>${quick}</div>`}

/* Accounts */
FIN.accounts=()=>{const accs=accountsAll(true),R=S.fin.rules||[],P=S.fin.plan;
  return `<div class="toolbar"><button class="btn primary" data-act="finAddAcc">Add account</button><button class="btn" data-act="finImport">Import a bank file</button></div>
  ${accs.length?`<div class="cards">${accs.map(x=>{const rec=lastRec(x,null),bal=hasOpening(x)?accBalance(x):null,calcAtRec=rec&&hasOpening(x)?accBalance(x,addDays(rec.date,1)):null,diff=rec&&calcAtRec!=null?rec.bal-calcAtRec:null,n=Object.values(S.money).filter(m=>m.accountId===x.id).length;
   return `<section class="card"><header class="ch"><h2>${esc(x.name)}</h2><span class="pill ${x.owner==='Pastel'?'acc':x.owner==='Mixed'?'warn':''}">${esc(x.owner)}</span></header>
   <div class="stat-row"><span>Type</span><b>${esc(accTypeLabel(x.type))}</b></div><div class="stat-row"><span>Opening balance</span><b>${hasOpening(x)?fmtT(+x.opening)+' · '+esc(shortDate(x.openingDate)):'not set'}</b></div><div class="stat-row"><span>Balance now (calculated)</span><b>${bal==null?'—':fmtT(bal)}</b></div><div class="stat-row"><span>Transactions</span><b>${n}</b></div>
   <div class="stat-row"><span>Last check against the bank</span><b>${rec?esc(shortDate(rec.date))+' · '+(diff==null?'needs opening balance':diff?`<span class="down">off by ${fmtN(diff)}</span>`:'matches'):'never'}</b></div>
   <div class="btn-row"><button class="btn sm" data-act="finAcc" data-id="${x.id}">Edit</button><button class="btn sm primary" data-act="finRec" data-id="${x.id}">Check balance</button></div></section>`}).join('')}</div>`:card('No accounts yet','','<div class="empty">Add each bank account and card, your cash wallet, and the old account where personal and Pastel money were mixed. The app sorts each payment by its purpose, even when it came from the shared account.</div>')}
  <div class="grid2" style="margin-top:14px">
  ${card('Sorting rules',`<span class="pill">${R.length}</span>`,R.length?`<div class="list">${R.map((x,i)=>`<div class="row"><span class="main"><span class="t">“${esc(x.match)}”</span><span class="s">→ ${esc(kindLabel(x.kind,x.dir||'out'))}${x.cat?' · '+esc(x.cat):''}${x.dir?' · '+(x.dir==='in'?'deposits':'payments')+' only':''}</span></span><button class="btn sm danger" data-act="finDelRule" data-i="${i}">Remove</button></div>`).join('')}</div>`:'<div class="empty">When you sort a transaction you can tell the app to sort every payment with the same words the same way. Those rules appear here and run on every import.</div>')}
  ${card('Planning numbers','<span class="pill warn">Scenarios, not facts</span>',`<form data-form="finplan" class="sform" style="gap:10px"><div class="row2"><label class="fld"><span>Planned monthly withdrawal</span><input class="in num" name="draw" inputmode="decimal" value="${esc(String(P.draw||''))}"></label><label class="fld"><span>Minimum cash Pastel keeps</span><input class="in num" name="buffer" inputmode="decimal" value="${esc(String(P.buffer||''))}"></label></div><p class="hint" style="margin:0">Used only to say whether a withdrawal looks covered. Never a guarantee.</p><div><button class="btn sm primary" type="submit">Save</button></div></form>`)}
  </div>`};

/* Withdrawals */
FIN.draws=()=>{const r=periodRange('month',S.ui.finAnchor),a=finAgg(r),P=S.fin.plan;
  const months=[];let an=S.ui.finAnchor;for(let i=0;i<6;i++){const rr=periodRange('month',an);months.unshift({r:rr,a:finAgg(rr)});an=addDays(rr.start,-1)}
  const mx=niceMax(Math.max(+P.draw||0,...months.map(x=>x.a.draws),1));
  const L=a.lines.filter(l=>(l.kind==='draw')||(l.kind==='p_out'&&l.accountId&&bizCash(l.accountId))).sort((x,y)=>y.date.localeCompare(x.date));
  const aff=drawCheck(+P.draw||0);
  return `<div class="tiles">${amtTile('Taken this month',a.draws)}${amtTile('Direct withdrawals',a.drawsDirect)}${amtTile('Personal spending from Pastel money',a.personalFromBiz)}<div class="tile"><div class="k">Planning scenario</div><div class="v">${fmtShort(+P.draw||0)}</div><div class="d">${a.draws>(+P.draw||0)?`<span class="down">${fmtShort(a.draws-(+P.draw||0))} over</span>`:`${fmtShort((+P.draw||0)-a.draws)} left`} · not a salary</div></div></div>
  <div class="grid2" style="margin-top:14px">
   ${card('Last 6 months','',`<div class="fchart">${months.map(x=>{const lb=useJ()?JM[jParts(x.r.start).month-1].slice(0,3):GM[parseISO(x.r.start).getMonth()].slice(0,3);return `<div class="fc"><div class="fbars"><i class="fi" style="height:${x.a.draws/mx*100}%;width:60%" title="${fmtT(x.a.draws)}"></i></div><span>${lb}</span></div>`}).join('')}<div class="goal" style="bottom:calc(${(+P.draw||0)/mx*100}% + 18px)"><span>plan</span></div></div>`)}
   ${card('Does the plan look covered?','',aff)}
   ${card('This month, one by one',`<span class="pill">${L.length}</span>`,L.length?`<div class="list">${L.map(l=>`<button class="row" data-act="editMoney" data-id="${l.id}"><span class="main"><span class="t">${esc(l.kind==='draw'?kindLabel('draw',l.dir):'Personal · '+(l.cat||'expense'))}</span><span class="s">${esc(shortDate(l.date))}${l.accountId?' · '+esc(accName(l.accountId)):''}${l.tx.note?' · '+esc(l.tx.note):''}</span></span><span class="amt">${fmtN(l.amount)}</span></button>`).join('')}</div>`:'<div class="empty">No withdrawals this month.</div>')}
  </div>`};
function drawCheck(plan){const biz=accountsAll().filter(x=>bizCash(x.id)&&x.type!=='reserve');
  if(!biz.length||!biz.every(hasOpening))return '<p class="empty">Can’t tell yet. Add your Pastel accounts with opening balances first, then this compares your planned withdrawal with the cash Pastel actually has.</p>';
  const cash=sum(biz,x=>accBalance(x)),owed=owedTeachers(),buf=+S.fin.plan.buffer||0,bills=typeof upcoming==='function'?sum(upcoming(30).filter(o=>o.b.area==='Pastel'&&o.b.dir==='out'),o=>+o.b.amount):0,free=cash-owed-bills-buf;
  return `<div class="stat-row"><span>Pastel cash now</span><b>${fmtT(cash)}</b></div><div class="stat-row"><span>Owed to teachers</span><b>− ${fmtT(owed)}</b></div>${bills?`<div class="stat-row"><span>Bills in the next 30 days</span><b>− ${fmtT(bills)}</b></div>`:''}<div class="stat-row"><span>Minimum cash to keep</span><b>− ${fmtT(buf)}</b></div><div class="stat-row"><span><b>Free to take</b></span><b>${fmtT(free)}</b></div>
  <p class="story" style="margin-top:10px">${free>=plan?`A ${fmtShort(plan)} withdrawal <b>looks covered</b> by today's cash.`:`A ${fmtShort(plan)} withdrawal <b class="down">is not covered</b> by today's cash${free>0?`; about ${fmtShort(free)} is`:''}.`}</p><p class="hint" style="margin:0">Based on recorded balances, teacher pay and the bills you added in Plan. Not a guarantee.</p>`}

/* Monthly report */
FIN.report=()=>{const r=periodRange('month',S.ui.finAnchor),pr=periodRange('month',shiftAnchor('month',S.ui.finAnchor,-1)),a=finAgg(r),p=finAgg(pr),tr=tuitionRecog(r);
  const biz=accountsAll().filter(x=>bizCash(x.id)&&x.type!=='reserve'),cashKnown=biz.length&&biz.every(hasOpening),cash=cashKnown?sum(biz,x=>accBalance(x,r.end)):null;
  const noCosts=!a.bizLines.some(l=>l.kind==='b_out');
  const cmp=(c,v)=>p.n?`<span class="hint"> · last month ${fmtShort(v)}</span>`:'';
  const q=[
   ['How much did Pastel actually take in?',`${fmtT(a.bizIn)}${cmp(a.bizIn,p.bizIn)}`],
   ['How much of that was earned by teaching?',tr.linked?`${fmtT(tr.recog)} from sessions delivered${tr.unlinked?` (${tr.unlinked} tuition payments aren’t linked to a student yet)`:''}`:'Not yet: link tuition payments to students and sessions.'],
   ['How much did it spend?',`${fmtT(a.bizOut)}${cmp(a.bizOut,p.bizOut)}`],
   ['What was its operating profit?',noCosts?'Can’t be confirmed: no Pastel costs were recorded this month.':`${fmtT(a.bizNet)}${a.unsorted?' (provisional, '+a.unsorted+' transactions unsorted)':''}`],
   ['How much cash does Pastel have?',cashKnown?fmtT(cash)+' at month end':'Unknown until Pastel accounts have opening balances.'],
   ['How much did I withdraw?',`${fmtT(a.draws)} (${fmtShort(a.drawsDirect)} direct, ${fmtShort(a.personalFromBiz)} personal spending from Pastel money)`],
   ['How much did I personally spend?',`${fmtT(a.persOut)}${cmp(a.persOut,p.persOut)}`],
   ['How much was saved?',a.saved?fmtT(a.saved):'Nothing moved to savings.'],
   ['What payments are coming?',(()=>{const up=typeof upcoming==='function'?upcoming(30).filter(o=>o.b.dir==='out'):[];return `${fmtT(owedTeachers())} owed to teachers${up.length?`, plus ${up.length} bill${up.length>1?'s':''} in the next 30 days (${fmtT(sum(up,o=>+o.b.amount))})`:''}.`})()],
   ['Can Pastel keep my planned withdrawal?',drawCheck(+S.fin.plan.draw||0).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().split('.')[0]+'.'],
   ['What needs my attention?',finAttention(r).join(' ')||'Nothing stands out.']];
  return `<div class="report">${card('Founder review','',`<dl class="fq">${q.map(([k,v],i)=>`<dt>${i+1}. ${esc(k)}</dt><dd>${v}</dd>`).join('')}</dl>`)}
  <div class="grid2" style="margin-top:14px">${card('Pastel','',`<div class="stat-row"><span>Receipts</span><b>${fmtT(a.receipts)}</b></div><div class="stat-row"><span>Refunds to students</span><b>${fmtT(a.stuRefunds)}</b></div><div class="stat-row"><span>Operating costs</span><b>${fmtT(a.bizOut)}</b></div><div class="stat-row"><span>Founder capital in</span><b>${fmtT(a.contrib)}</b></div><div class="stat-row"><span>Founder withdrawals</span><b>${fmtT(a.draws)}</b></div>${catBars(a.bCats,true)}`)}
  ${card('Personal','',`<div class="stat-row"><span>Income</span><b>${fmtT(a.pIn)}</b></div><div class="stat-row"><span>Received from Pastel</span><b>${fmtT(a.drawsRecv+a.personalFromBiz)}</b></div><div class="stat-row"><span>Spending</span><b>${fmtT(a.persOut)}</b></div><div class="stat-row"><span>Saved</span><b>${fmtT(a.saved)}</b></div>${catBars(a.pCats)}`)}</div>
  <div class="btn-row"><button class="btn" data-act="export" data-k="fintx">Export transactions (CSV)</button></div></div>`};
function unlinkedMoves(r){return txIn(r).filter(m=>!m.pairId&&m.accountId&&OWN_MOVES.includes(kindOf(m))&&pairCands(m,kindOf(m)).length)}
function finAttention(r){const a=finAgg(r),out=[];if(a.unsorted)out.push(`${a.unsorted} transactions need sorting.`);const ul=unlinkedMoves(r).length;if(ul)out.push(`${ul} withdrawals or transfers may be counted twice: open them and link the two sides.`);
  const un=accountsAll().filter(x=>!hasOpening(x));if(un.length)out.push(`${un.length} account${un.length>1?'s have':' has'} no opening balance.`);
  if(a.draws>(+S.fin.plan.draw||Infinity))out.push(`Withdrawals passed the ${fmtShort(+S.fin.plan.draw)} plan.`);
  const owe=Object.values(S.students).filter(s=>(s.status||'Active')==='Active'&&studentStats(s.id).remaining<0).length;if(owe)out.push(`${owe} student${owe>1?'s':''} owe sessions.`);return out}

/* ---------- sheets ---------- */
SHEETS.facc=dr=>`<form data-form="facc" class="sform">${head(dr.id?'Edit account':'New account')}${errLine(dr)}
  <label class="fld"><span>Name</span><input class="in" name="name" id="a-name" value="${esc(dr.name||'')}" placeholder="e.g. Mellat card, Pastel Saman, Cash" autocomplete="off" ${dr.id?'':'autofocus'}></label>
  <label class="fld"><span>Type</span><select class="in" name="type" id="a-type" data-re>${optList(ACC_TYPES.map(x=>[x[0],x[1]]),dr.type||'personal')}</select></label>
  <div class="fld"><span>Whose money is it?</span>${segRadio('owner',[['Personal','Mine'],['Pastel','Pastel'],['Mixed','Mixed (old shared)']],dr.owner||'Personal',true)}<small class="hint">${(dr.owner||'Personal')==='Mixed'?'Money in a mixed account is treated as Pastel’s. Personal spending from it counts as a founder withdrawal.':'Each payment is still sorted by its own purpose.'}</small></div>
  <div class="row2"><label class="fld"><span>Opening balance (Toman)</span><input class="in num" name="opening" id="a-open" inputmode="decimal" value="${esc(dr.opening??'')}" placeholder="e.g. 12.5m"></label><label class="fld"><span>On date (start of day)</span><input class="in" type="date" name="openingDate" id="a-od" value="${esc(dr.openingDate||resetRange().startD)}"></label></div>
  <small class="hint">The balance the bank showed at the start of that day, before any payment that day. Use the first day of your reset period.</small>
  <label class="chip" style="align-self:flex-start"><input type="checkbox" name="active" value="1" ${dr.active!==false?'checked':''}><span>Still in use</span></label>
  ${foot(dr.id?'facc':'')}</form>`;
READ.facc=f=>{const o=fd(f);o.active=!!f.elements.active.checked;return o};
SAVE.facc=dr=>{const name=String(dr.name||'').trim();if(!name){dr.err='Give the account a name.';return false}
  const op=String(dr.opening??'').trim()===''?null:parseSigned(dr.opening);if(op!=null&&!isFinite(op)){dr.err='The opening balance isn’t a number.';return false}
  const id=dr.id||uid(),old=S.accounts[dr.id]||{};
  saveDoc('accounts',id,{name,type:dr.type||'personal',owner:dr.owner||'Personal',currency:'IRT',opening:op,openingDate:dr.openingDate||null,active:dr.active!==false,recs:old.recs||{},deleted:false,createdAt:old.createdAt||Date.now(),updatedAt:Date.now()});
  toast('Account saved');return true};
const parseSigned=v=>{const s=normDigits(v).trim();const neg=/^[-−(]/.test(s)||/[-)]$/.test(s);const n=parseAmount(s.replace(/[-−()]/g,''));return isFinite(n)?(neg?-n:n):NaN};

SHEETS.frec=dr=>{const x=S.accounts[dr.id];if(!x)return head('Account missing');const date=dr.date||resetRange().endD;
  const calc=hasOpening(x)?accBalance(x,addDays(date,1)):null,bal=String(dr.bal??'').trim()===''?null:parseSigned(dr.bal),diff=calc!=null&&bal!=null&&isFinite(bal)?bal-calc:null;
  const hist=Object.entries(x.recs||{}).sort((a,b)=>b[0].localeCompare(a[0]));
  return `<form data-form="frec" class="sform">${head('Check '+x.name)}
  ${hasOpening(x)?'':`<div class="err">This account has no opening balance, so nothing can be compared yet. <button type="button" class="link" data-act="finAcc" data-id="${x.id}">Add it</button></div>`}
  <div class="row2"><label class="fld"><span>Date on the bank statement</span><input class="in" type="date" name="date" id="r-date" value="${esc(date)}" data-re></label><label class="fld"><span>Balance the bank shows at the end of that day</span><input class="in num" name="bal" id="r-bal" inputmode="decimal" value="${esc(dr.bal??'')}" placeholder="Toman" data-re></label></div>
  <div class="result">${calc==null?'Calculated balance: —':`Calculated from opening balance + ${Object.values(S.money).filter(m=>m.accountId===x.id&&m.date>=x.openingDate&&m.date<=date).length} transactions: <b>${fmtT(calc)}</b>`}
   ${diff==null?'':diff===0?`<div class="up" style="font-weight:600;margin-top:6px">${I.tick} Matches the bank exactly.</div>`:`<div class="down" style="font-weight:600;margin-top:6px">Difference: ${fmtT(diff)}</div><div class="hint">${diff>0?'The bank has more than the app. A deposit is probably missing.':'The bank has less than the app. A payment is probably missing, or one was entered twice.'}</div>`}</div>
  ${hist.length?`<div class="fld"><span>Earlier checks</span>${hist.slice(0,6).map(([d,b])=>{const c=hasOpening(x)?accBalance(x,addDays(d,1)):null;return `<div class="stat-row"><span>${esc(shortDate(d))}</span><b>${fmtT(b)}${c!=null?(b-c?` · <span class="down">off ${fmtN(b-c)}</span>`:' · matches'):''}</b></div>`}).join('')}</div>`:''}
  ${foot('','Save check')}</form>`};
READ.frec=f=>fd(f);
SAVE.frec=dr=>{const x=S.accounts[dr.id];const bal=parseSigned(dr.bal);if(!x||!isFinite(bal)||!dr.date){dr.err='Enter the date and the bank’s balance.';return false}
  saveDoc('accounts',x.id,{recs:{...(x.recs||{}),[dr.date]:bal},updatedAt:Date.now()});toast('Balance check saved');return true};

/* transaction sheet (also the quick-add expense/income form) */
const finCatList=(area,dir)=>catsFor(area,dir).filter(c=>c!=='From Pastel');
SHEETS.money=dr=>{
  const type=dr.type||'out';let kind=dr.kind&&FKINDS[dr.kind]?dr.kind:(dr.area==='Pastel'?(type==='in'?'b_in':'b_out'):(type==='in'?'p_in':'p_out'));
  const K=FKINDS[kind],area=K.area||dr.area||(kind==='draw'?(type==='out'?'Pastel':'Personal'):kind==='contrib'?(type==='out'?'Personal':'Pastel'):(dr.accountId&&accOwner(dr.accountId)==='Pastel'?'Pastel':'Personal'));
  const showCats=K.cats||kind==='refund',cats=showCats?finCatList(area==='Pastel'?'Pastel':'Personal',kind==='refund'?'out':type):[],cat=cats.includes(dr.cat)?dr.cat:(dr.cat&&dr.id?dr.cat:(showCats?cats[0]:''));
  const allCats=showCats?(cats.includes(cat)||!cat?cats:[...cats,cat]):[];
  const stu=kind==='b_in'&&type==='in',tm=kind==='b_out'&&type==='out',accs=accountsAll(true).map(x=>[x.id,x.name+' · '+x.owner]);
  const pairable=!dr.id&&OWN_MOVES.includes(kind),splits=Array.isArray(dr.splits)?dr.splits:[];
  const m=dr.id?S.money[dr.id]:null,src=m&&m.src;
  const amt=parseAmount(dr.amount),left=isFinite(amt)?amt-sum(splits,s=>parseAmount(s.amount)||0):null;
  return `<form data-form="money" class="sform">${head(dr.id?'Transaction':type==='in'?'Money in':'Money out')}${errLine(dr)}
  ${segRadio('type',[['out','Money out'],['in','Money in']],type,true)}
  <label class="fld"><span>How much? (Toman)</span><input class="in big num" id="s-amount" name="amount" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(dr.amount??'')}" ${dr.id?'':'autofocus'}><small class="hint" id="amtPrev">${amtPrev(dr.amount)}${src&&src.rial?` · bank amount ${fmtN(src.rial)} rial`:''}</small></label>
  <div class="fld"><span>What was it?</span><div class="chips">${KIND_ORDER[type].map(k=>chipIn('radio','kind',k,kindLabel(k,type),k===kind,true)).join('')}</div>${K.s?`<small class="hint">${esc(K.s)}. Not counted as spending or income.</small>`:OWN_MOVES.includes(kind)?'<small class="hint">Money moving between your own pockets. Not counted as spending or income.</small>':''}</div>
  ${['refund','loan','uncat','reserve','transfer'].includes(kind)?`<div class="fld"><span>For</span>${segRadio('area',[['Personal','Me'],['Pastel','Pastel']],area,true)}</div>`:`<input type="hidden" name="area" value="${area}">`}
  ${showCats?`<div class="fld"><span>Category</span><div class="chips">${allCats.map(c=>chipIn('radio','cat',c,c,c===cat,true)).join('')}</div></div>`:''}
  ${stu?`<div class="row2"><label class="fld"><span>Student</span><select class="in" id="s-stu" name="studentId" data-re>${optList(Object.values(S.students).sort(byName).map(s=>[s.id,s.name]),dr.studentId,'No student')}</select></label><label class="fld"><span>Sessions paid for</span><input class="in num" id="s-sess" name="sessions" inputmode="numeric" value="${esc(dr.sessions??'')}" placeholder="e.g. 8"></label></div>`:''}
  ${tm?`<label class="fld"><span>Paid to (optional)</span><select class="in" id="s-team" name="teamId">${optList(teamList(true).map(t=>[t.id,t.name]),dr.teamId,'Nobody on the team')}</select></label>`:''}
  <div class="row2"><label class="fld"><span>${type==='in'?'Into account':'From account'}</span><select class="in" id="s-acc" name="accountId">${optList(accs,dr.accountId,'No account / not sure')}</select></label>${pairable?`<label class="fld"><span>${type==='in'?'Came from':'Went to'} (optional)</span><select class="in" id="s-to" name="toAccountId">${optList(accs.filter(x=>x[0]!==dr.accountId),dr.toAccountId,'— not one of mine')}</select></label>`:''}</div>
  <div class="row2"><label class="fld"><span>Date</span><input class="in" type="date" id="s-date" name="date" value="${esc(dr.date||S.ui.date)}"></label><label class="fld"><span>Note</span><input class="in" id="s-note" name="note" value="${esc(dr.note||'')}" placeholder="Optional" autocomplete="off"></label></div>
  ${splits.length?`<div class="fld splits"><span>Split between purposes</span>${splits.map((s,i)=>`<div class="spl"><select class="in" name="sp_kind_${i}" data-re>${optList(KIND_ORDER[type].filter(k=>k!=='uncat').map(k=>[k,kindLabel(k,type)]),s.kind||kind)}</select>${['refund','loan','reserve','transfer'].includes(s.kind)?`<select class="in" name="sp_area_${i}">${optList([['Personal','Me'],['Pastel','Pastel']],s.area||'Personal')}</select>`:''}${(FKINDS[s.kind||kind]||{}).cats?`<select class="in" name="sp_cat_${i}">${optList(finCatList(FKINDS[s.kind||kind].area,type).map(c=>[c,c]),s.cat,'Category')}</select>`:''}<input class="in num" name="sp_amt_${i}" inputmode="decimal" value="${esc(s.amount??'')}" placeholder="Amount"><button type="button" class="icon-btn" data-act="finSplitDel" data-i="${i}" aria-label="Remove">${I.x}</button></div>`).join('')}<small class="hint ${left?'down':''}">${left==null?'':left===0?'Adds up exactly.':`${fmtT(left)} ${left>0?'not assigned yet':'too much'}`}</small><div><button type="button" class="btn sm" data-act="finSplitAdd">Add a part</button></div></div>`:`<div><button type="button" class="link" data-act="finSplitAdd">Split this between personal and Pastel</button></div>`}
  <label class="chip" style="align-self:flex-start"><input type="checkbox" name="flag" value="1" ${dr.flag?'checked':''}><span>I’m not sure about this one yet</span></label>
  ${m&&OWN_MOVES.includes(kind)?pairBox(m,kind):''}
  ${src?`<div class="srcbox"><b>From ${esc(src.file||'import')}</b>${src.row?' · row '+src.row:''}${src.ref?' · ref '+esc(src.ref):''}<div>${esc(src.desc||'')}</div><label class="chip" style="margin-top:8px"><input type="checkbox" name="mkRule" value="1" ${dr.mkRule?'checked':''} data-re><span>Sort others like this automatically</span></label>${dr.mkRule?`<input class="in" name="ruleText" value="${esc(dr.ruleText??ruleSeed(src.desc))}" placeholder="Words to look for" style="margin-top:6px">`:''}</div>`:''}
  ${m&&m.hist&&m.hist.length?`<details class="hist"><summary>Edit history (${m.hist.length})</summary>${m.hist.slice().reverse().map(h=>`<div class="hint">${esc(new Date(h.t).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'}))} · was ${esc(kindLabel(h.kind||'uncat',h.type||type))}${h.cat?' / '+esc(h.cat):''} · ${fmtN(h.amount)}${h.status==='flag'?' · unclear':''}</div>`).join('')}</details>`:''}
  ${foot(dr.id?'money':'')}</form>`};
function pairCands(m,kind){return Object.values(S.money).filter(x=>x.id!==m.id&&!x.pairId&&kindOf(x)===kind&&x.type!==m.type&&x.amount===m.amount&&(x.accountId||'')!==(m.accountId||'')&&Math.abs(parseISO(x.date)-parseISO(m.date))<=10*864e5)}
function pairBox(m,kind){if(m.pairId){const o=Object.values(S.money).find(x=>x.pairId===m.pairId&&x.id!==m.id);return `<div class="srcbox"><b>Linked</b> with the ${o?(o.type==='in'?'deposit into ':'payment from ')+esc(accName(o.accountId)||'no account')+' on '+esc(shortDate(o.date)):'other side'}. Counted once. <button type="button" class="link" data-act="finUnlink" data-id="${m.id}">Unlink</button></div>`}
  const c=pairCands(m,kind);if(!c.length)return '';
  return `<div class="srcbox"><b>Is this the other side of one of these?</b> Linking them makes sure the move is counted once.${c.slice(0,4).map(x=>`<div class="stat-row"><span>${esc(shortDate(x.date))} · ${esc(accName(x.accountId)||'no account')}</span><button type="button" class="btn sm" data-act="finLink" data-a="${m.id}" data-b="${x.id}">Link</button></div>`).join('')}</div>`}
const ruleSeed=d=>normDigits(String(d||'')).replace(/[0-9\/:\-_.]+/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,3).join(' ');
READ.money=f=>{const o=fd(f);o.flag=!!(f.elements.flag&&f.elements.flag.checked);o.mkRule=!!(f.elements.mkRule&&f.elements.mkRule.checked);
  const sp=[];for(let i=0;i<20;i++){if(!f.elements['sp_amt_'+i])break;sp.push({kind:o['sp_kind_'+i],area:o['sp_area_'+i]||'',cat:o['sp_cat_'+i]||'',amount:o['sp_amt_'+i]})}
  const cur=S.sheet&&S.sheet.draft&&S.sheet.draft.splits;o.splits=sp.length||!(cur&&cur.length)?sp:cur;return o};
function snapshot(m){return {t:Date.now(),type:m.type,amount:m.amount,kind:kindOf(m),area:m.area,cat:m.cat,accountId:m.accountId||null,status:statusOf(m),splits:m.splits&&m.splits.length?m.splits.length:0}}
SAVE.money=dr=>{
  const amount=parseAmount(dr.amount);if(!(amount>0)){dr.err='Enter an amount greater than zero.';return false}
  const type=dr.type||'out';let kind=dr.kind&&FKINDS[dr.kind]?dr.kind:(dr.area==='Pastel'?(type==='in'?'b_in':'b_out'):(type==='in'?'p_in':'p_out'));
  const K=FKINDS[kind];let area=K.area||dr.area||'Personal';if(kind==='draw')area=type==='out'?'Pastel':'Personal';if(kind==='contrib')area=type==='out'?'Personal':'Pastel';
  let cat='';if(K.cats||kind==='refund'){const cats=finCatList(area,kind==='refund'?'out':type);cat=dr.cat&&(cats.includes(dr.cat)||dr.id)?dr.cat:(cats[0]||'Other')}
  let splits=(dr.splits||[]).map(s=>{const sk=FKINDS[s.kind]?s.kind:kind,SK=FKINDS[sk];let sa=SK.area||s.area||'Personal';if(sk==='draw')sa=type==='out'?'Pastel':'Personal';return {kind:sk,area:sa,cat:SK.cats?(s.cat||''):'',amount:parseAmount(s.amount)}}).filter(s=>s.amount>0);
  if(splits.length){const tot=sum(splits,s=>s.amount);if(tot!==amount){dr.err=`The parts add up to ${fmtT(tot)}, not ${fmtT(amount)}.`;return false}if(splits.length===1){kind=splits[0].kind;area=splits[0].area;cat=splits[0].cat||cat;splits=[]}}
  const date=dr.date||S.ui.date,id=dr.id||uid(),old=dr.id?S.money[dr.id]:null;
  const isStu=kind==='b_in'&&type==='in',isTeam=kind==='b_out'&&type==='out';
  const status=dr.flag?'flag':(kind==='uncat'?'new':'ok');
  const hist=old?[...(old.hist||[]),snapshot(old)].slice(-20):[];
  const e={date,type,amount,area:splits.length?splits[0].area:area,cat,kind,splits,accountId:dr.accountId||null,status,note:String(dr.note||'').trim(),
    studentId:isStu&&dr.studentId?dr.studentId:null,sessions:isStu&&dr.studentId?toInt(dr.sessions):0,teamId:isTeam&&dr.teamId?dr.teamId:null,
    billId:dr.billId||(old&&old.billId)||null,pairId:old?old.pairId||null:null,batchId:old?old.batchId||null:null,src:old?old.src||null:null,time:old?old.time||'':'',hist,deleted:false,updatedAt:Date.now(),createdAt:(old&&old.createdAt)||Date.now()};
  if(old&&old.date.slice(0,7)!==date.slice(0,7))write(`money/${old.date.slice(0,7)}`,{items:{[id]:{deleted:true}}},{render:false});
  if(!old&&dr.toAccountId&&OWN_MOVES.includes(kind)){const pid=uid(),id2=uid();e.pairId=pid;
    const otype=type==='out'?'in':'out';let oarea=area;if(kind==='draw')oarea=otype==='out'?'Pastel':'Personal';if(kind==='contrib')oarea=otype==='out'?'Personal':'Pastel';

/* ================= Finance Hub phase 2: control =================
   Plan tab: one card per question. Am I within my budget? How safe is Pastel? What's coming up? Where will cash be in 30 days?
   Nothing here invents numbers: budgets and targets start from measured months, and every estimate says so. */
Object.assign(DEFAULT_FIN,{budget:{total:null,cats:{},save:null},reserve:{months:3,monthly:20000000,essential:null},goals:[],bills:[],
  forecast:{usual:true,change:0},notify:{budget:true,bills:true,review:true,cash:true,reserve:true},seen:{}});
/* last n complete months before the month holding `anchor` */
function prevMonths(n,anchor=todayISO()){const out=[];let s=periodRange('month',anchor).start;for(let i=0;i<n;i++){const r=periodRange('month',addDays(s,-1));out.unshift(r);s=r.start}return out}
const monthName=r=>useJ()?JM[jParts(r.start).month-1]:GM[parseISO(r.start).getMonth()];
function measured(kind){/* average of the last 3 complete months that actually have sorted data */
  const ms=prevMonths(3).map(r=>({r,a:finAgg(r)})).filter(x=>kind==='personal'?x.a.lines.some(l=>l.kind==='p_out'&&!needsSort(l)):x.a.lines.some(l=>l.kind==='b_out'&&!needsSort(l)));
  if(!ms.length)return {avg:null,n:0,cats:{}};const cats={};
  ms.forEach(x=>Object.entries(kind==='personal'?x.a.pCats:x.a.bCats).forEach(([k,v])=>{if(!k.startsWith('in:'))cats[k]=(cats[k]||0)+v/ms.length}));
  return {avg:Math.round(sum(ms,x=>kind==='personal'?x.a.persOut:x.a.bizOut)/ms.length),n:ms.length,cats,recv:Math.round(sum(ms,x=>x.a.bizIn)/ms.length)}}
function essential(){const R=S.fin.reserve;if(R.essential)return {v:+R.essential,how:'set by you'};const m=measured('business');if(m.n)return {v:m.avg,how:`measured over ${m.n} month${m.n>1?'s':''}`};return {v:+S.fin.assumptions.costs,how:'estimate, not measured yet',est:true}}
const reserveAccs=()=>accountsAll().filter(x=>x.type==='reserve');
const daysLeftIn=r=>{const t=todayISO();return t<r.start?daysBetween(r.start,r.end).length:t>=r.end?0:daysBetween(t,r.end).length};
const bar=(p,cls='')=>`<div class="prog ${cls}"><i style="width:${Math.max(0,Math.min(1,p))*100}%"></i></div>`;

/* ---------- bills & money expected ---------- */
const billsAll=()=>(S.fin.bills||[]).filter(b=>b.active!==false);
function occurrences(from,to){const out=[];
  for(const b of billsAll()){
    if(b.repeat==='once'){if(b.date&&b.date>=from&&b.date<to)out.push({b,date:b.date});continue}
    let s=periodRange('month',from).start;while(s<to){const r=periodRange('month',s),len=daysBetween(r.start,r.end).length,d=addDays(r.start,Math.min(Math.max(1,+b.day||1),len)-1);if(d>=from&&d<to&&(!b.since||d>=b.since))out.push({b,date:d});s=r.end}}
  return out.map(o=>({...o,paid:billPaid(o.b,o.date)})).sort((x,y)=>x.date.localeCompare(y.date))}
function billPaid(b,date){const r=b.repeat==='once'?{start:'0000-01-01',end:'9999-12-31'}:periodRange('month',date);return Object.values(S.money).some(m=>m.billId===b.id&&inRange(m.date,r))}
function upcoming(days=30){const t=todayISO(),from=periodRange('month',t).start;return occurrences(from,addDays(t,days)).filter(o=>!o.paid)}
const billWhen=o=>{const t=todayISO();if(o.date<t)return `<span class="pill bad">${Math.round((parseISO(t)-parseISO(o.date))/864e5)}d late</span>`;if(o.date===t)return '<span class="pill warn">Today</span>';const n=Math.round((parseISO(o.date)-parseISO(t))/864e5);return `<span class="pill ${n<=3?'warn':''}">${n===1?'Tomorrow':'in '+n+'d'}</span>`};

/* ---------- 30-day cash forecast for Pastel ---------- */
function forecast(days=30,change=S.fin.forecast.change){
  const biz=accountsAll().filter(x=>bizCash(x.id)&&x.type!=='reserve');if(!biz.length||!biz.every(hasOpening))return null;
  const t=todayISO(),start=sum(biz,x=>accBalance(x)),ev={},add=(d,v,label)=>{(ev[d]||(ev[d]=[])).push({v,label})};
  for(const o of upcoming(days))if(o.b.area==='Pastel'||o.b.area==null){add(o.date<t?t:o.date,o.b.dir==='in'?+o.b.amount:-o.b.amount,o.b.name)}
  const owed=owedTeachers();if(owed>0){const end=addDays(periodRange('month',t).end,-1);add(end<addDays(t,days)?end:addDays(t,days-1),-owed,'Teacher pay owed')}
  const P=+S.fin.plan.draw||0;if(P>0){const end=addDays(periodRange('month',t).end,-1),taken=finAgg(periodRange('month',t)).draws;const left=Math.max(0,P-taken);if(left)add(end<addDays(t,days)?end:addDays(t,days-1),-left,'Planned withdrawal (scenario)')}
  const m=measured('business'),usual=S.fin.forecast.usual&&m.n&&m.recv?m.recv*(1+change/100)/30:0;
  const pts=[];let bal=start,low={v:start,d:t};
  for(let i=0;i<days;i++){const d=addDays(t,i);bal+=usual+sum(ev[d]||[],e=>e.v);pts.push({d,v:Math.round(bal)});if(bal<low.v)low={v:Math.round(bal),d}}
  return {start,pts,low,end:pts[pts.length-1].v,d7:pts[6].v,usual:Math.round(usual*30),usualN:m.n,events:Object.entries(ev).flatMap(([d,l])=>l.map(e=>({d,...e}))).sort((a,b)=>a.d.localeCompare(b.d))}}
function lineChart(f){const W=320,H=120,vals=f.pts.map(p=>p.v),buf=+S.fin.plan.buffer||0;let mn=Math.min(0,buf,...vals),mx=Math.max(f.start,buf,...vals);if(mx===mn)mx=mn+1;
  const x=i=>i/(vals.length-1)*W,y=v=>H-(v-mn)/(mx-mn)*H;const path=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  return `<svg viewBox="-2 -6 ${W+4} ${H+12}" class="fline" role="img" aria-label="Forecast cash for 30 days"><line x1="0" x2="${W}" y1="${y(buf)}" y2="${y(buf)}" class="fbuf"/>${mn<0?`<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" class="fzero"/>`:''}<path d="${path}" class="fpath"/><circle cx="${x(vals.indexOf(f.low.v))}" cy="${y(f.low.v)}" r="3.5" class="flow"/></svg>
   <div class="legend"><span><i style="background:var(--accent)"></i>Forecast (not actual)</span><span><i style="background:var(--warn)"></i>Minimum cash ${fmtShort(buf)}</span></div>`}

/* ---------- Plan tab ---------- */
FIN.plan=()=>{const t=todayISO(),r=periodRange('month',t),a=finAgg(r),B=S.fin.budget,me=measured('personal');
  /* budget */
  let budget;
  if(!B.total){budget=card('Monthly budget','',me.n?`<p class="story">Over the last ${me.n} measured month${me.n>1?'s':''} you spent <b>${fmtT(me.avg)}</b> a month on yourself.</p><div class="btn-row"><button class="btn primary" data-act="finBudgetUse">Use this as my budget</button><button class="btn" data-act="finBudget">Set my own</button></div>`
     :`<p class="empty">No complete month of personal spending is sorted yet. A budget needs a real number to start from, so this unlocks after your first measured month.</p><button class="btn sm" data-act="finBudget">Set one anyway</button>`)}
  else{const spent=a.persOut,left=B.total-spent,dl=daysLeftIn(r),p=spent/B.total,cls=p>1?'bad':p>.85?'warn':'';
    const cl=Object.entries(B.cats||{}).filter(([,v])=>+v>0).map(([c,lim])=>{const s=a.pCats[c]||0;return `<div class="cbar"><span>${esc(c)}</span><span class="amt ${s>lim?'down':''}">${fmtShort(s)} / ${fmtShort(lim)}</span><div class="track ${s>lim?'bad':''}"><i style="width:${Math.min(1,s/lim)*100}%"></i></div></div>`}).join('');
    budget=card('Monthly budget',`<button class="link" data-act="finBudget">Edit</button>`,`<div class="big-num ${left<0?'down':''}">${fmtT(left)}</div><div class="hint">${left>=0?'left this month':'over budget'} · spent ${fmtShort(spent)} of ${fmtShort(B.total)}${me.n?` · usual ${fmtShort(me.avg)}`:''}</div>${bar(p,cls)}
     ${left>0&&dl?`<p class="story" style="margin-top:10px">About <b>${fmtT(Math.floor(left/dl/10000)*10000)}</b> a day for the next ${dl} days.</p>`:''}${cl?`<div style="margin-top:8px">${cl}</div>`:''}
     ${B.save?`<div class="stat-row" style="margin-top:8px"><span>Planned savings</span><b>${fmtShort(a.saved)} / ${fmtShort(B.save)} moved</b></div>`:''}`)}
  /* reserve */
  const R=S.fin.reserve,ess=essential(),target=Math.round(ess.v*(+R.months||3)),ra=reserveAccs(),known=ra.length&&ra.every(hasOpening),bal=known?sum(ra,x=>accBalance(x)):null;
  const movedIn=sum(a.lines.filter(l=>l.kind==='reserve'&&l.dir==='in'&&ra.some(x=>x.id===l.accountId)),l=>l.amount);
  let reserve;
  if(!ra.length)reserve=card('Pastel emergency reserve','',`<p class="story">Target: <b>${fmtT(target)}</b>, which is ${R.months} months of essential costs (${fmtShort(ess.v)} a month, ${esc(ess.how)}).</p><p class="hint">Add a “Pastel reserve account” to start tracking real money set aside.</p><button class="btn sm primary" data-act="finAddReserve">Add reserve account</button>`);
  else{const p=bal==null?0:bal/target,need=bal==null?null:Math.max(0,target-bal),mo=need&&+R.monthly?Math.ceil(need/+R.monthly):0;
    reserve=card('Pastel emergency reserve',`<button class="link" data-act="finReserve">Edit</button>`,bal==null?'<p class="empty">Add an opening balance to the reserve account.</p>':`<div class="big-num">${fmtT(bal)}</div><div class="hint">of ${fmtShort(target)} target · covers ${(bal/Math.max(1,ess.v)).toFixed(1)} months of costs${ess.est?' (estimate)':''}</div>${bar(p)}
     <div class="stat-row" style="margin-top:10px"><span>Planned this month</span><b>${fmtShort(+R.monthly||0)}</b></div><div class="stat-row"><span>Actually moved this month</span><b class="${movedIn<(+R.monthly||0)?'':'up'}">${fmtShort(movedIn)}</b></div>
     <p class="hint" style="margin:8px 0 0">${need?`At ${fmtShort(+R.monthly)} a month, full in about ${mo} month${mo>1?'s':''}.`:'Target reached.'} Only money really moved to the reserve account counts.</p>`)}
  /* coming up */
  const up=upcoming(30),owed=owedTeachers();
  const coming=card('Coming up · 30 days',`<button class="link" data-act="finBill">Add</button>`,(up.length||owed>0)?`<div class="list">${up.map(o=>`<div class="row"><span class="main"><span class="t">${esc(o.b.name)}</span><span class="s">${esc(shortDate(o.date))} · ${esc(o.b.area==='Pastel'?'Pastel':'Me')}${o.b.repeat==='month'?' · monthly':''}</span></span>${billWhen(o)}<span class="amt ${o.b.dir==='in'?'in':''}">${o.b.dir==='in'?'+':'−'}${fmtShort(o.b.amount)}</span><button class="btn sm" data-act="finBillPay" data-id="${o.b.id}" data-d="${o.date}">${o.b.dir==='in'?'Got it':'Paid'}</button></div>`).join('')}
     ${owed>0?`<div class="row"><span class="main"><span class="t">Teacher pay owed</span><span class="s">from sessions taught, minus payouts</span></span><span class="amt">−${fmtShort(owed)}</span><button class="btn sm" data-act="pastelSubGo" data-v="team">See</button></div>`:''}</div>`
    :`<p class="empty">Add rent, software, salaries and other regular payments, and tuition you're expecting. They show here before they're due, and in the forecast.</p><button class="btn sm primary" data-act="finBill">Add a bill or expected payment</button>`);
  /* forecast */
  const f=forecast(30),F=S.fin.forecast;
  const fc=card('Pastel cash · next 30 days','<span class="pill">Forecast</span>',!f?'<p class="empty">Needs Pastel accounts with opening balances.</p>':`<div class="mini-tiles"><div class="tile"><div class="k">Now</div><div class="v">${fmtShort(f.start)}</div></div><div class="tile"><div class="k">In 7 days</div><div class="v">${fmtShort(f.d7)}</div></div><div class="tile"><div class="k">In 30 days</div><div class="v ${f.end<0?'down':''}">${fmtShort(f.end)}</div></div><div class="tile ${f.low.v<(+S.fin.plan.buffer||0)?'warnt':''}"><div class="k">Lowest</div><div class="v ${f.low.v<0?'down':''}">${fmtShort(f.low.v)}</div><div class="d">${esc(shortDate(f.low.d))}</div></div></div>
    ${lineChart(f)}
    <div class="fld" style="margin-top:10px"><span>If tuition income changes</span>${segBtns('finChange',[[0,'As usual'],[-10,'−10%'],[-20,'−20%'],[-30,'−30%']],F.change)}</div>
    <p class="hint" style="margin:8px 0 0">${f.usualN?`Usual tuition: ${fmtShort(f.usual)} a month, from your last ${f.usualN} measured month${f.usualN>1?'s':''}, spread evenly. <button class="link" data-act="finUsual" style="padding:0">${F.usual?'Leave it out':'Include it'}</button>`:'No measured month of tuition yet, so only known bills and expected payments are included.'}${f.events.length?` Includes ${f.events.length} known item${f.events.length>1?'s':''}.`:''}</p>`);
  /* goals */

  const gl=card('Personal goals',`<button class="link" data-act="finGoal">Add</button>`,goals.length?goals.map(g=>{const have=goalHave(g),p=have/Math.max(1,g.target),ml=g.deadline?Math.max(1,Math.round((parseISO(g.deadline)-parseISO(t))/(30.4*864e5))):null;
    return `<div class="goalrow"><div class="ch" style="margin:0"><b style="margin-right:auto">${esc(g.name)}</b><button class="link" data-act="finGoal" data-id="${g.id}" style="padding:0">Edit</button></div><div class="hint">${fmtShort(have)} of ${fmtShort(g.target)}${g.deadline?' · by '+esc(shortDate(g.deadline)):''}${ml&&have<g.target?` · ${fmtShort(Math.ceil((g.target-have)/ml))} a month to get there`:''}</div>${bar(p)}${!g.accountId?`<button class="btn sm" data-act="finGoalAdd" data-id="${g.id}" style="margin-top:6px">Add money</button>`:''}</div>`}).join(''):'<p class="empty">A personal emergency fund, travel, a course abroad… Each goal shows how much is needed each month.</p>');
  return `<div class="cards">${budget}${reserve}${coming}${fc}${gl}${card('Reminders','',notifyChips())}</div>`};
const goalHave=g=>g.accountId&&accOf(g.accountId)&&hasOpening(accOf(g.accountId))?accBalance(accOf(g.accountId)):sum(g.contribs||[],c=>c.amount);
function notifyChips(){const N=S.fin.notify,L=[['budget','Budget running out'],['bills','Bills due soon'],['review','Monthly money review'],['cash','Cash dropping below minimum'],['reserve','Reserve milestones']];
  return `<p class="hint" style="margin:0 0 8px">Shown on Today under “Needs attention”. Tap to turn off.</p><div class="chips">${L.map(([k,l])=>`<button type="button" class="chipb ${N[k]!==false?'on':''}" data-act="finNotify" data-k="${k}">${N[k]!==false?I.tick:''}${l}</button>`).join('')}</div>`}

/* attention items for Today and the Finance overview */
function finAlerts(){const N=S.fin.notify,t=todayISO(),out=[],r=periodRange('month',t),a=finAgg(r),B=S.fin.budget;
  if(N.bills!==false)for(const o of upcoming(4)){out.push({kind:o.date<t?'bad':'warn',text:`${o.b.name}: ${fmtShort(o.b.amount)} ${o.date<t?'was due '+shortDate(o.date):o.date===t?'due today':'due '+shortDate(o.date)}`,act:'finBillPay',args:{id:o.b.id,d:o.date},cta:o.b.dir==='in'?'Got it':'Paid'})}
  if(N.budget!==false&&B.total){const p=a.persOut/B.total;if(p>=1)out.push({kind:'bad',text:`Personal budget passed by ${fmtShort(a.persOut-B.total)}`,act:'finPlanGo',cta:'See'});else if(p>=.85)out.push({kind:'warn',text:`${Math.round(p*100)}% of this month's budget used`,act:'finPlanGo',cta:'See'})}
  if(N.review!==false){const d=daysBetween(r.start,addDays(t,1)).length,last=prevMonths(1)[0],key='rev:'+last.start;if(d<=5&&!S.fin.seen[key])out.push({kind:'warn',text:`Review ${monthName(last)}'s money`,act:'finReview',args:{k:key,d:last.start},cta:'Open'})}
  if(N.cash!==false){const f=forecast(30);if(f&&f.low.v<(+S.fin.plan.buffer||0))out.push({kind:'bad',text:`Pastel cash may drop to ${fmtShort(f.low.v)} around ${shortDate(f.low.d)}`,act:'finPlanGo',cta:'See'})}
  if(N.reserve!==false){const ra=reserveAccs();if(ra.length&&ra.every(hasOpening)){const ess=essential(),target=ess.v*(+S.fin.reserve.months||3),p=sum(ra,x=>accBalance(x))/target;const ms=[1,.75,.5,.25].find(m=>p>=m);if(ms&&!S.fin.seen['res:'+ms])out.push({kind:'warn',text:`Reserve reached ${ms*100}% of its target`,act:'finSeen',args:{k:'res:'+ms},cta:'Nice'})}}
  return out}

/* ================= Learning OS (phase 1: CEO Academy MVP) =================
   Paths → modules → topics. A deterministic, explainable planner picks at most one main session plus the reviews
   that fit today's time. Only a rated review moves a topic's review date; opening or rereading never counts. */
const L_DEFAULT={budgets:{light:15,normal:35,deep:75},ladder:[1,3,7,14,30,60],reviewMin:5,seeded:false};
const LMODES=[['light','Light'],['normal','Normal'],['deep','Deep']];
const LSTAT=['Active','Maintenance','Paused','Completed'];
const RATINGS=[['forgot','Forgot'],['hard','Difficult'],['good','Good'],['easy','Easy']];
const APPST=['Not started','Planned','Applied','Evaluated'];
const RES_TYPES=['Book','Article','Research paper','PDF','Online course','Video','Podcast','Personal notes'];
const LP=()=>S.learn||L_DEFAULT;
const lpathsAll=()=>Object.values(S.lpaths).sort((a,b)=>(+a.priority||9)-(+b.priority||9)||byName(a,b));
const topicsOf=pid=>Object.values(S.ltopics).filter(t=>t.pathId===pid).sort((a,b)=>(+a.mOrder||0)-(+b.mOrder||0)||(+a.order||0)-(+b.order||0)||String(a.id).localeCompare(String(b.id)));
const pathOfT=t=>t&&S.lpaths[t.pathId];
const lsessAll=()=>Object.values(S.lsess);
const topicMinutesSpent=tid=>sum(lsessAll().filter(s=>s.topicId===tid&&s.kind==='learn'),s=>s.minutes);
const prereqsDone=t=>(t.prereqs||[]).every(id=>!S.ltopics[id]||S.ltopics[id].status==='done');
const learnDay=d=>(dayOf(d).learn)||{};

/* ---------- the planner: same data in, same plan out ---------- */
function learnPlan(d=todayISO()){
  const P=LP(),day=learnDay(d),mode=day.mode||'normal',budget=+P.budgets[mode]||35,rmin=+P.reviewMin||5,R={mode,budget,main:null,reviews:[],waiting:0,total:0,skipped:!!day.skip,note:''};
  const today=lsessAll().filter(s=>s.date===d);
  R.doneMain=today.find(s=>s.kind==='learn');R.doneReviews=today.filter(s=>s.kind==='review').map(s=>s.topicId);
  if(day.skip)return R;
  const live=t=>{const p=pathOfT(t);return p&&p.status!=='Paused'};
  const due=Object.values(S.ltopics).filter(t=>t.rev&&t.rev.due&&t.rev.due<=d&&live(t)&&!R.doneReviews.includes(t.id))
    .sort((a,b)=>a.rev.due.localeCompare(b.rev.due)||(+b.rev.lapses||0)-(+a.rev.lapses||0)||(+pathOfT(a).priority||9)-(+pathOfT(b).priority||9)||String(a.id).localeCompare(String(b.id)));
  let main=null,why=[];
  if(day.focus&&S.ltopics[day.focus]&&S.ltopics[day.focus].status!=='done'){main=S.ltopics[day.focus];why=['You chose this for today.']}
  else{const cands=Object.values(S.ltopics).filter(t=>t.status!=='done'&&(S.lpaths[t.pathId]||{}).status==='Active'&&prereqsDone(t))
      .sort((a,b)=>(b.status==='learning')-(a.status==='learning')||(+pathOfT(a).priority||9)-(+pathOfT(b).priority||9)||String(pathOfT(a).target||'9999').localeCompare(String(pathOfT(b).target||'9999'))||(+a.mOrder||0)-(+b.mOrder||0)||(+a.order||0)-(+b.order||0)||String(a.id).localeCompare(String(b.id)));
    main=cands[0]||null;
    if(main){const p=pathOfT(main);why=[main.status==='learning'?`You started this and haven't finished it, so it comes before anything new.`:`Next step in ${p.title}${(main.prereqs||[]).length?' — the topic before it is done':''}.`];
      if(+p.priority===1||lpathsAll().filter(x=>x.status==='Active')[0]===p)why.push(`${p.title} is your top-priority path.`);
      if(p.target)why.push(`Path goal date: ${shortDate(p.target)}.`);
      if(!lsessAll().some(s=>s.kind==='review'))why.push('No review results yet, so this follows your path order and priorities, not your performance.')}}
  if(R.doneMain&&!day.focus)main=null;
  const left=main?Math.max(10,(+main.minutes||25)-topicMinutesSpent(main.id)):0;
  let nRev,mainMin=0;
  if(budget<20){if(due.length){nRev=Math.min(due.length,Math.floor(budget/rmin));main=null;R.note='Short day: just the reviews that are due.'}else{nRev=0;mainMin=main?Math.min(left,budget):0}}
  else{nRev=Math.min(due.length,Math.floor(Math.floor(budget/3)/rmin)||(due.length?1:0));mainMin=main?Math.min(left,budget-nRev*rmin):0;if(main&&mainMin<10){main=null;mainMin=0;nRev=Math.min(due.length,Math.floor(budget/rmin))}}
  if(main)R.main={t:main,min:mainMin,why};
  R.reviews=due.slice(0,nRev).map(t=>({t,why:reviewWhy(t,d)}));R.waiting=due.length-R.reviews.length;
  R.total=mainMin+R.reviews.length*rmin;return R}
function reviewWhy(t,d){const r=t.rev,late=Math.round((parseISO(d)-parseISO(r.due))/864e5),last=(r.hist||[]).slice(-1)[0];
  return [late>0?`Due ${late} day${late>1?'s':''} ago.`:'Due today.',last?(last.r==='forgot'?'You forgot it last time, so it came back sooner.':last.r==='hard'?'It was difficult last time.':`Last time: ${last.r}.`):'First review since you learned it.']}
/* spaced review: a starting ladder, moved by results */
function schedule(t,rating,d){const L=LP().ladder,r={...(t.rev||{step:0,reps:0,lapses:0,hist:[]})};let step=+r.step||0;
  if(rating==='forgot'){step=0;r.lapses=(+r.lapses||0)+1;r.due=addDays(d,1)}
  else if(rating==='hard'){r.due=addDays(d,Math.max(1,L[Math.max(0,step-1)]))}
  else{step=Math.min(L.length-1,step+(rating==='easy'?2:1));r.due=addDays(d,L[step]*(rating==='easy'&&step===L.length-1?2:1))}
  r.step=step;r.reps=(+r.reps||0)+1;r.last=d;r.hist=[...(r.hist||[]),{d,r:rating}].slice(-12);return r}
const retention=ts=>{const h=ts.flatMap(t=>((t.rev&&t.rev.hist)||[]).slice(-3));return h.length?{n:h.length,ok:h.filter(x=>x.r==='good'||x.r==='easy').length}:null};

/* ---------- Today card ---------- */
function learnCard(d){if(!Object.keys(S.lpaths).length)return '';const t=todayISO();if(d!==t)return '';
  const p=learnPlan(d),day=learnDay(d);
  const modeSeg=`<div class="lmode">${LMODES.map(([k,l])=>`<button type="button" data-act="learnMode" data-v="${k}" aria-pressed="${p.mode===k}">${l}<small>${LP().budgets[k]}m</small></button>`).join('')}</div>`;
  let body;
  if(p.skipped)body=`<p class="lc-t">Skipped today. That's fine.</p><button class="link" data-act="learnUnskip">Plan something after all</button>`;
  else if(!p.main&&!p.reviews.length)body=p.doneMain?`<p class="lc-t">${I.tick} Learned today: ${esc((S.ltopics[p.doneMain.topicId]||{}).title||'session')} · ${p.doneMain.minutes} min</p>`:`<p class="lc-t">Nothing planned. ${lpathsAll().some(x=>x.status==='Active')?'Every available topic is done.':'No active path.'}</p><button class="link" data-act="learnGo">Open Learning</button>`;
  else{const m=p.main;body=`${m?`<div class="lc-main"><span class="ltag" style="--c:var(--accent)">${esc(pathOfT(m.t).title)}</span><b>${esc(m.t.title)}</b><span class="hint">${m.min} min · ${esc(m.t.module||'')}</span></div>`:''}
    ${p.reviews.length?`<div class="hint" style="margin-top:4px">${m?'+ ':''}${p.reviews.length} quick review${p.reviews.length>1?'s':''} · ${p.reviews.length*LP().reviewMin} min${p.waiting?` · ${p.waiting} more wait for another day`:''}</div>`:''}
    ${p.note?`<div class="hint">${esc(p.note)}</div>`:''}
    <button class="btn big primary" data-act="learnStart" style="margin-top:12px">Start learning · ${p.total} min</button>
    <div class="lc-acts"><button class="link" data-act="learnWhy">${S.ui.learnWhy?'Hide why':'Why this?'}</button><button class="link" data-act="learnChange">Change</button>${top3Link(d,m)}<button class="link" data-act="learnSkip">Skip today</button></div>
    ${S.ui.learnWhy?`<ul class="lwhy">${[...(m?m.why:[]),...p.reviews.slice(0,2).map(r=>`${r.t.title}: ${r.why.join(' ')}`)].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}`}
  return `<section class="lcard"><div class="ch" style="margin-bottom:8px"><h2>Today's learning</h2><button class="link" data-act="learnGo" style="padding:0">Open</button></div>${p.skipped||(!p.main&&!p.reviews.length)?'':modeSeg}${body}</section>`}
function top3Link(d,m){if(!m)return '';const t3=dayOf(d).top3||{};if([1,2,3].some(i=>t3[i]&&t3[i].link==='learn'))return '<span class="hint">In your Top 3</span>';return [1,2,3].some(i=>!(t3[i]&&String(t3[i].t||'').trim()))?'<button class="link" data-act="learnTop3">Add to Top 3</button>':''}

/* ---------- Learning view (opened from Today; no new bottom tab) ---------- */
VIEWS.learn=()=>{const sub=S.ui.learnSub;
  return `<div class="ph"><button class="icon-btn" data-act="tab" data-tab="today" aria-label="Back to Today">${I.left}</button><h1>Learning</h1></div><div class="toolbar">${segBtns('learnSub',[['today','Today'],['paths','Paths'],['library','Library'],['progress','Progress']],sub)}</div>`+(LEARN[sub]||LEARN.today)()};
const LEARN={};
LEARN.today=()=>{const t=todayISO(),p=learnPlan(t),due=Object.values(S.ltopics).filter(x=>x.rev&&x.rev.due).sort((a,b)=>a.rev.due.localeCompare(b.rev.due));
  return `${learnCard(t)||card('Learning','','<p class="empty">No learning path yet.</p>')}
  <div class="grid2" style="margin-top:14px">${card('Review queue',`<span class="pill">${due.filter(x=>x.rev.due<=t).length} due</span>`,due.length?`<div class="list">${due.slice(0,12).map(x=>`<button class="row" data-act="ltopic" data-id="${x.id}"><span class="main"><span class="t">${esc(x.title)}</span><span class="s">${esc(pathOfT(x)?pathOfT(x).title:'')} · reviewed ${x.rev.reps||0}×</span></span><span class="pill ${x.rev.due<=t?'warn':''}">${x.rev.due<=t?'due':esc(shortDate(x.rev.due))}</span></button>`).join('')}</div>`:'<p class="empty">Topics you finish come back here for short reviews: after 1 day, then 3, 7, 14… Forgetting brings one back sooner.</p>')}
  ${card('This week','',weekStats())}</div>`};
function weekStats(){const r=periodRange('week',todayISO()),ss=lsessAll().filter(s=>inRange(s.date,r)),rv=ss.filter(s=>s.kind==='review'),ok=rv.filter(s=>s.rating==='good'||s.rating==='easy').length;
  return `<div class="stat-row"><span>Learning time</span><b>${fmtDur(sum(ss,s=>s.minutes))}</b></div><div class="stat-row"><span>Sessions finished</span><b>${ss.filter(s=>s.kind==='learn').length}</b></div><div class="stat-row"><span>Reviews done</span><b>${rv.length}</b></div><div class="stat-row"><span>Recalled well</span><b>${rv.length?ok+' of '+rv.length:'no reviews yet'}</b></div>`}
LEARN.paths=()=>{const ps=lpathsAll(),open=S.ui.learnPath&&S.lpaths[S.ui.learnPath];
  if(open)return pathView(open);
  return `<div class="cards">${ps.map(p=>{const ts=topicsOf(p.id),dn=ts.filter(t=>t.status==='done').length;return `<section class="card"><header class="ch"><h2>${esc(p.title)}</h2><span class="pill ${p.status==='Active'?'acc':p.status==='Paused'?'':'warn'}">${esc(p.status)}</span></header>${p.goal?`<p class="hint" style="margin:0 0 8px">${esc(p.goal)}</p>`:''}<div class="hint">${ts.length?`${dn} of ${ts.length} topics done`:'No topics yet'} · priority ${p.priority||'—'}</div>${ts.length?bar(dn/ts.length):''}<div class="btn-row"><button class="btn sm primary" data-act="lpathOpen" data-id="${p.id}">Open</button><button class="btn sm" data-act="lpath" data-id="${p.id}">Edit</button></div></section>`}).join('')}</div>
  <div class="btn-row"><button class="btn" data-act="lpath">New path</button><button class="btn" data-act="lprefs">Time & review settings</button></div>`};
function pathView(p){const ts=topicsOf(p.id),mods=[];ts.forEach(t=>{let m=mods.find(x=>x.name===(t.module||'Topics'));if(!m)mods.push(m={name:t.module||'Topics',ts:[]});m.ts.push(t)});const nx=learnPlan().main;
  return `<div class="toolbar"><button class="btn sm" data-act="lpathOpen" data-id="">${I.left} All paths</button><button class="btn sm" data-act="lpath" data-id="${p.id}">Edit path</button><button class="btn sm primary" data-act="ltopic" data-path="${p.id}">Add topic</button></div>
  <h2 class="fr-h" style="font-size:21px">${esc(p.title)} <span class="pill ${p.status==='Active'?'acc':''}">${esc(p.status)}</span></h2>${p.goal?`<p class="hint" style="margin-top:0">${esc(p.goal)}</p>`:''}
  ${mods.map(m=>`<section class="card" style="margin-bottom:12px"><header class="ch"><h2>${esc(m.name)}</h2><span class="pill">${m.ts.filter(t=>t.status==='done').length}/${m.ts.length}</span></header><div class="list">${m.ts.map(t=>{const st=t.status==='done'?'done':t.status==='learning'?'learning':prereqsDone(t)?'open':'locked';
    return `<button class="row" data-act="ltopic" data-id="${t.id}"><span class="tdot ${st}">${st==='done'?I.tick:''}</span><span class="main"><span class="t">${esc(t.title)}</span><span class="s">${st==='done'?'Learned'+(t.rev&&t.rev.due?' · review '+esc(shortDate(t.rev.due)):''):st==='learning'?'In progress · '+fmtDur(topicMinutesSpent(t.id))+' so far':st==='locked'?'After the topic before it':(+t.minutes||25)+' min'}${t.app&&t.app.status&&t.app.status!=='Not started'?' · '+esc(t.app.status):''}</span></span>${nx&&nx.t.id===t.id?'<span class="pill acc">Next</span>':''}</button>`}).join('')}</div></section>`).join('')||card('Empty path','','<p class="empty">Add the first topic.</p>')}`}
LEARN.library=()=>{const rs=Object.values(S.lres).sort(byName);
  return `<div class="toolbar"><button class="btn primary" data-act="lres">Add a resource</button></div>${card('Library',`<span class="pill">${rs.length}</span>`,rs.length?`<div class="list">${rs.map(r=>`<button class="row" data-act="lres" data-id="${r.id}"><span class="main"><span class="t">${esc(r.title)}</span><span class="s">${esc(r.type||'')}${r.author?' · '+esc(r.author):''}${(r.topicIds||[]).length?' · '+(r.topicIds||[]).length+' topic'+((r.topicIds||[]).length>1?'s':''):''}${r.suggested?' · suggested starting point':''}</span></span><span class="pill ${r.status==='Done'?'ok':r.status==='Reading'?'acc':''}">${esc(r.status||'To read')}</span></button>`).join('')}</div>`:'<p class="empty">Books, articles, courses, PDFs and your own notes. Link each one to the topics it teaches and it shows up in the session.</p>')}`};
LEARN.progress=()=>{const ps=lpathsAll(),m=periodRange('month',todayISO()),ss=lsessAll().filter(s=>inRange(s.date,m)),applied=Object.values(S.ltopics).filter(t=>t.app&&['Applied','Evaluated'].includes(t.app.status));
  return `<div class="grid2">${card('This week','',weekStats())}
  ${card('This month','',`<div class="stat-row"><span>Learning time</span><b>${fmtDur(sum(ss,s=>s.minutes))}</b></div><div class="stat-row"><span>Days with learning</span><b>${new Set(ss.map(s=>s.date)).size}</b></div><div class="stat-row"><span>Skipped days</span><b>${Object.entries(S.days).filter(([d,x])=>inRange(d,m)&&x.learn&&x.learn.skip).length}</b></div><div class="stat-row"><span>Concepts applied at Pastel</span><b>${applied.length}</b></div>`)}
  ${card('Paths','',ps.map(p=>{const ts=topicsOf(p.id),dn=ts.filter(t=>t.status==='done').length,ret=retention(ts),mins=sum(lsessAll().filter(s=>pathOfT(S.ltopics[s.topicId])===p),s=>s.minutes);
    return `<div class="goalrow"><div class="ch" style="margin:0"><b style="margin-right:auto">${esc(p.title)}</b><span class="pill">${esc(p.status)}</span></div><div class="hint">${dn}/${ts.length} topics learned · ${fmtDur(mins)} total · ${ret?`recalled well ${ret.ok} of last ${ret.n} reviews`:'no review results yet, so no retention score'}</div>${ts.length?bar(dn/ts.length):''}</div>`}).join(''))}
  ${card('Applied at Pastel',`<span class="pill">${applied.length}</span>`,applied.length?`<div class="list">${applied.map(t=>`<button class="row" data-act="ltopic" data-id="${t.id}"><span class="main"><span class="t">${esc(t.title)}</span><span class="s">${esc(t.app.status)}${t.app.note?' · '+esc(t.app.note):''}</span></span></button>`).join('')}</div>`:'<p class="empty">Learning a concept and using it are different things. Mark a topic Applied when you have used it at Pastel.</p>')}</div>
  <p class="hint">Time and completed topics show effort, not mastery. Retention comes only from reviews you rated.</p>`};

/* ---------- session player ---------- */
SHEETS.lplay=dr=>{const steps=dr.steps||[],i=dr.i||0,s=steps[i];
  if(!s)return `${head('Done')}<p class="story">${I.tick} Session saved.</p><div class="sh-foot"><span class="spacer"></span><button class="btn primary" data-act="closeSheet">Close</button></div>`;
  const t=S.ltopics[s.id],dots=`<div class="dots">${steps.map((x,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>`,stepTxt=`Step ${i+1} of ${steps.length}`;
  if(s.kind==='review'){const q=t.q||`Without looking: what is the core idea of “${t.title}”?`;
    return `<div class="sh-head"><div style="margin-right:auto;min-width:0"><h2>Quick review</h2><div class="step-ind">${stepTxt} · recall first, then check</div></div><button type="button" class="icon-btn" data-act="closeSheet" aria-label="Close">${I.x}</button></div>${dots}
    <p class="hint" style="margin:0">${esc(t.title)}</p><p class="q">${esc(q)}</p><textarea class="in" id="lp-ans" data-f="lpAns" placeholder="Type or say your answer before you look (optional)">${esc(dr.ans||'')}</textarea>
    ${dr.show?`<div class="result" style="margin-top:12px"><b style="font-size:15px">Check yourself</b><div style="margin-top:4px">${esc(t.a||t.objective||'')}</div></div><p class="q" style="margin-top:14px">How did it go?</p><div class="rate">${RATINGS.map(([k,l])=>`<button type="button" class="rb ${k}" data-act="lpRate" data-v="${k}">${l}</button>`).join('')}</div>`:`<button type="button" class="btn big primary" data-act="lpShow" style="margin-top:12px">Show answer</button>`}`}
  const res=Object.values(S.lres).filter(r=>(r.topicIds||[]).includes(t.id));
  if(!dr.finish)return `<div class="sh-head"><div style="margin-right:auto;min-width:0"><h2>${esc(t.title)}</h2><div class="step-ind">${stepTxt} · ${esc(pathOfT(t).title)} · ${esc(t.module||'')} · ${s.min} min</div></div><button type="button" class="icon-btn" data-act="closeSheet" aria-label="Close">${I.x}</button></div>${dots}
    <div class="lfield"><span>Goal</span><p>${esc(t.objective||'—')}</p></div>
    <div class="lfield"><span>Resource</span>${res.length?res.map(r=>`<p>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}${r.author?' · '+esc(r.author):''}${r.where?' · '+esc(r.where):''}</p>`).join(''):`<p class="hint">No resource linked yet. <button type="button" class="link" data-act="lres" data-topic="${t.id}" style="padding:0">Add one</button></p>`}</div>
    ${t.app&&t.app.task?`<div class="lfield"><span>Apply it to Pastel</span><p>${esc(t.app.task)}</p></div>`:''}
    <div class="ltimer"><span class="num" data-ltimer>${lTimerText()}</span><span class="hint">of ${s.min} min</span></div>
    <div class="sh-foot"><button type="button" class="btn" data-act="lpFinish" data-v="partial">Stop for now</button><span class="spacer"></span><button type="button" class="btn primary" data-act="lpFinish" data-v="done">I finished this topic</button></div>`;
  return `<form data-form="lpfin" class="sform">${head(dr.finish==='done'?'Nicely done':'Saved for next time')}
    <label class="fld"><span>Minutes spent</span><input class="in num" name="min" inputmode="numeric" value="${esc(dr.min)}"></label>
    <label class="fld"><span>One line: what's the key idea? (optional, helps your first review)</span><input class="in" name="note" value="${esc(dr.note||'')}" autocomplete="off"></label>
    <label class="chip" style="align-self:flex-start"><input type="checkbox" name="reading" value="1" ${dr.reading?'checked':''}><span>This was book or article reading (counts in Reading, not twice)</span></label>
    ${dr.finish==='done'?'<p class="hint" style="margin:0">First review tomorrow. Only reviews you rate change when it comes back.</p>':'<p class="hint" style="margin:0">It stays as your next session until it’s finished.</p>'}
    ${foot('',steps.length>i+1?'Save and continue':'Save')}</form>`};
READ.lpfin=f=>{const o=fd(f);o.reading=!!f.elements.reading.checked;return o};
SAVE.lpfin=dr=>{const s=dr.steps[dr.i],t=S.ltopics[s.id],d=todayISO(),min=toInt(dr.min)||1,done=dr.finish==='done';
  addLsess({date:d,topicId:t.id,kind:'learn',minutes:min,status:done?'finished':'partial',note:String(dr.note||'').trim(),reading:!!dr.reading,chosen:learnDay(d).focus===t.id?'override':'suggested'});
  saveDoc('ltopics',t.id,{status:done?'done':'learning',doneAt:done?d:null,rev:done?{step:0,reps:0,lapses:0,hist:[],due:addDays(d,LP().ladder[0])}:t.rev||null,keyNote:dr.note?String(dr.note).trim():t.keyNote||'',updatedAt:Date.now()},{render:false});
  linkTop3Done(d);setDay(d,{learn:{active:null,focus:null}},{render:false});
  if(dr.steps.length>dr.i+1){openSheet('lplay',{steps:dr.steps,i:dr.i+1});startStepTimer();render();return 'keep'}
  render();toast(done?'Topic learned. First review tomorrow.':'Saved. It continues next time.');return true};
function addLsess(x){const id=uid();write(`lsess/${x.date.slice(0,7)}`,{items:{[id]:{...x,deleted:false,createdAt:Date.now()}}},{render:false});return id}
function linkTop3Done(d){const t3=dayOf(d).top3||{};for(const i of [1,2,3])if(t3[i]&&t3[i].link==='learn'&&!t3[i].done)setDay(d,{top3:{[i]:{done:true}}},{render:false})}
let LTIMER=null;
function startStepTimer(){LTIMER={start:Date.now()};lsSet('daybook.ltimer',JSON.stringify(LTIMER))}
function lTimerText(){if(!LTIMER)return '0:00';const s=Math.floor((Date.now()-LTIMER.start)/1000);return `${Math.floor(s/60)}:${pad(s%60)}`}
setInterval(()=>{document.querySelectorAll('[data-ltimer]').forEach(n=>n.textContent=lTimerText())},1000);

READ.lpath=f=>fd(f);

SHEETS.ltopic=dr=>{const p=S.lpaths[dr.pathId],sib=topicsOf(dr.pathId).filter(t=>t.id!==dr.id),mods=[...new Set(sib.map(t=>t.module).filter(Boolean))],res=Object.values(S.lres).filter(r=>(r.topicIds||[]).includes(dr.id));

  <div class="fld"><span>Status</span>${segRadio('status',[['new','Not started'],['learning','In progress'],['done','Learned']],dr.status||'new',false)}</div>
  ${res.length?`<div class="fld"><span>Resources</span>${res.map(r=>`<div class="hint">${esc(r.title)}</div>`).join('')}</div>`:''}
  ${rv?`<div class="hint">Reviews: ${rv.reps||0} · next ${esc(shortDate(rv.due))}${(rv.hist||[]).length?' · last: '+rv.hist.slice(-3).map(h=>h.r).join(', '):''}</div>`:''}
  ${dr.id?`<div class="btn-row" style="margin-top:0"><button type="button" class="btn sm" data-act="learnFocus" data-id="${dr.id}">Learn this today instead</button></div>`:''}
  ${foot(dr.id?'ltopic':'')}</form>`};
READ.ltopic=f=>fd(f);
SAVE.ltopic=dr=>{const title=String(dr.title||'').trim();if(!title){dr.err='Name the topic.';return false}const id=dr.id||uid(),o=S.ltopics[id]||{},sib=topicsOf(dr.pathId);
  const module=String(dr.module||'').trim();const mo=sib.find(t=>t.module===module);
  const status=dr.status||'new';
  saveDoc('ltopics',id,{pathId:dr.pathId,title,module,mOrder:mo?mo.mOrder:(Math.max(0,...sib.map(t=>+t.mOrder||0))+1),order:o.order??(Math.max(0,...sib.filter(t=>t.module===module).map(t=>+t.order||0))+1),
    minutes:toInt(dr.minutes)||25,objective:String(dr.objective||'').trim(),q:String(dr.q||'').trim(),a:String(dr.a||'').trim(),prereqs:o.prereqs||(()=>{const prev=sib.filter(t=>t.module===module).slice(-1)[0];return prev&&!o.id?[prev.id]:[]})(),
    app:{task:String(dr.appTask||'').trim(),status:dr.appStatus||'Not started',note:String(dr.appNote||'').trim()},status,
    rev:status==='done'?(o.rev||{step:0,reps:0,lapses:0,hist:[],due:addDays(todayISO(),1)}):(status==='new'?null:o.rev||null),deleted:false,createdAt:o.createdAt||Date.now(),updatedAt:Date.now()});if(dr.fromInbox)inboxMoved(dr.fromInbox,'learning');toast('Saved');return true};
SHEETS.lres=dr=>{const ts=Object.values(S.ltopics).sort((a,b)=>(pathOfT(a)||{}).title===(pathOfT(b)||{}).title?(+a.mOrder-b.mOrder)||(+a.order-b.order):String((pathOfT(a)||{}).title).localeCompare(String((pathOfT(b)||{}).title))),sel=arr(dr.topicIds);

  <div class="row2"><label class="fld"><span>Type</span><select class="in" name="type">${optList(RES_TYPES.map(x=>[x,x]),dr.type||'Book')}</select></label><label class="fld"><span>Author / creator</span><input class="in" name="author" value="${esc(dr.author||'')}" autocomplete="off"></label></div>

  <label class="fld"><span>Notes</span><textarea class="in" name="notes" style="min-height:60px">${esc(dr.notes||'')}</textarea></label>

  saveDoc('lres',id,{title,type:dr.type||'Book',author:String(dr.author||'').trim(),url:String(dr.url||'').trim(),where:String(dr.where||'').trim(),status:dr.status||'To read',topicIds:arr(dr.topicIds),notes:String(dr.notes||'').trim(),suggested:false,deleted:false,createdAt:o.createdAt||Date.now(),updatedAt:Date.now()});toast('Saved');return true};
SHEETS.lprefs=dr=>`<form data-form="lprefs" class="sform">${head('Time & review')}
  <div class="fld"><span>Minutes for each kind of day</span><div class="row2">${LMODES.map(([k,l])=>`<label class="fld"><span>${l}</span><input class="in num" name="b_${k}" inputmode="numeric" value="${esc(dr.budgets[k])}"></label>`).join('')}</div></div>

READ.lprefs=f=>fd(f);
SAVE.lprefs=dr=>{const b={};LMODES.forEach(([k])=>b[k]=toInt(dr['b_'+k])||L_DEFAULT.budgets[k]);const lad=String(dr.ladder||'').split(/[,\s]+/).map(toInt).filter(x=>x>0);
