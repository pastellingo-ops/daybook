/* ================= Safety layer =================
   Safety copies of the whole database live on this phone (before updates, restores, merges, and once a day).
   Backups carry a schema version and a checksum, can be passphrase-protected, and can be checked without restoring.
   Deleted things stay recoverable for 30 days. */
const SCHEMA=3;
const SNAP_MAX=10;
const hasData=()=>COLS.some(c=>c!=='settings'&&Object.keys(DB.cache[c]||{}).length);
async function snapList(){try{return (await storeGet('snaps'))||[]}catch(e){return []}}
async function snapshot(reason){if(!STORE.kind||!hasData())return false;try{const list=await snapList();list.push({id:uid(),at:Date.now(),reason,schema:S.meta.schema||SCHEMA,data:clone(DB.cache)});
  while(list.length>SNAP_MAX){const i=list.findIndex(s=>s.reason==='Daily copy');list.splice(i>=0&&i<list.length-1?i:0,1)}await storeSet('snaps',list);return true}catch(e){console.warn('snapshot',e);return false}}
async function safetyBoot(){if(!STORE.kind)return;const v=+S.meta.schema||1;
  if(v<SCHEMA&&hasData())await snapshot(`Before updating to data version ${SCHEMA}`);
  const list=await snapList(),last=list.length?list[list.length-1].at:0;if(hasData()&&Date.now()-last>20*3600e3)await snapshot('Daily copy');
  if(v!==SCHEMA){S.meta.schema=SCHEMA;saveMeta()}}
async function restoreSnap(id){const list=await snapList(),s=list.find(x=>x.id===id);if(!s)return false;await snapshot('Before going back to a safety copy');
  DB.cache=clone(s.data);COLS.forEach(c=>{if(!isObj(DB.cache[c]))DB.cache[c]={}});COLS.forEach(rebuild);COLS.forEach(schedulePersist);await persistNow();render();return true}
async function sha256hex(str){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptBackup(plain,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=310000,key=await deriveKey(pass,salt,iter);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(plain)));
  return JSON.stringify({app:'daybook',enc:'AES-GCM-256',kdf:'PBKDF2-SHA256',iter,salt:b64e(salt),iv:b64e(iv),exported:new Date().toISOString(),data:b64e(ct)})}
async function decryptBackup(o,pass){const key=await deriveKey(pass,b64d(o.salt),+o.iter||310000);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},key,b64d(o.data));return JSON.parse(new TextDecoder().decode(pt))}
async function buildBackup(){const cache=DB.cache,sum_=await sha256hex(JSON.stringify(cache));
  return JSON.stringify({app:'daybook',version:3,schema:SCHEMA,exported:new Date().toISOString(),checksum:sum_,counts:Object.fromEntries(COLS.map(c=>[c,countCol(cache,c)])),cache},null,1)}
function countCol(cache,c){const v=cache[c]||{};if(c==='days')return sum(Object.values(v),d=>Object.keys(d.days||{}).length);if(BUCKETS.includes(c))return sum(Object.values(v),d=>Object.values(d.items||{}).filter(x=>x&&!x.deleted).length);return Object.values(v).filter(x=>x&&!x.deleted).length}
/* checks a parsed backup without touching this device */
async function verifyBackup(o){const out={ok:true,notes:[],counts:{}};
  if(o.schema&&+o.schema>SCHEMA){out.ok=false;out.notes.push('This backup comes from a newer version of Daybook. Open the app with internet to update it first.');return out}
  if(o.cache){if(!isObj(o.cache)){out.ok=false;out.notes.push('The data inside is damaged.');return out}
    for(const c of COLS)if(o.cache[c]!=null&&!isObj(o.cache[c])){out.ok=false;out.notes.push(`The “${c}” part is damaged.`)}
    if(o.checksum){const s=await sha256hex(JSON.stringify(o.cache));if(s!==o.checksum){out.ok=false;out.notes.push('The file was changed or cut off after it was made (checksum doesn’t match).')}else out.notes.push('Checksum matches: the file is complete and unchanged.')}
    else out.notes.push('Older backup without a checksum: it reads fine, but completeness can’t be proven.');
    for(const c of COLS)out.counts[c]=countCol(o.cache,c)}
  else{out.notes.push('Very old backup format: it can be restored, but it has no checksum.');['days','money','sessions','students','classes','team','tasks'].forEach(c=>out.counts[c]=Object.keys(o[c]||{}).length)}
  return out}
const COL_LABEL={days:'Days',money:'Transactions',sessions:'Class sessions',students:'Students',classes:'Classes',team:'Team',tasks:'Tasks',accounts:'Accounts',lpaths:'Learning paths',ltopics:'Learning topics',lres:'Library',lsess:'Learning sessions',inbox:'Inbox & decisions'};

function readBackupFile(file,checkOnly){if(!file)return;const r=new FileReader();
  r.onload=async()=>{let o;try{o=JSON.parse(r.result)}catch(e){toast('That file is not a Daybook backup.','bad');return}
    if(!o||typeof o!=='object'||o.app&&o.app!=='daybook'){toast('That file is not a Daybook backup.','bad');return}
    if(o.enc){S.back=null;openSheet('unlock',{raw:o,checkOnly,pass:S.meta.bkPass||''});return}
    if(!(o.days||o.money||o.settings||o.team||o.cache)){toast('That file is not a Daybook backup.','bad');return}
    await showBackup(o,checkOnly)};
  r.onerror=()=>toast('Could not read that file.','bad');r.readAsText(file)}
async function showBackup(o,checkOnly){const v=await verifyBackup(o);S.back=null;openSheet('import',{data:o,when:o.exported||'',v,checkOnly})}

ACT.doImport=async(ds,el)=>{const dr=S.sheet&&S.sheet.draft;if(!dr||!dr.data||(dr.v&&!dr.v.ok))return;
  if(el&&!el.hasAttribute('data-armed')){el.setAttribute('data-armed','');el.textContent='Tap again to replace';setTimeout(()=>{if(el.isConnected){el.removeAttribute('data-armed');el.textContent='Replace'}},4000);return}
  await snapshot('Before replacing with a backup');importData(dr.data);closeSheet();toast('Backup restored. The previous state is kept as a safety copy.')};
ACT.doMerge=async()=>{const dr=S.sheet&&S.sheet.draft;if(!dr||!dr.data||(dr.v&&!dr.v.ok))return;await snapshot('Before merging a backup');const c=mergeData(dr.data);closeSheet();
  const parts=Object.entries(c).filter(([,x])=>x.n).map(([k,x])=>`${x.n} ${(COL_LABEL[k]||k).toLowerCase()}`);toast(parts.length?'Merged: '+parts.join(', '):'Already up to date. Nothing new in that backup.')};

/* safety copies + recently deleted */
SHEETS.snaps=dr=>`${head('Safety copies on this phone')}<p class="hint" style="margin-top:0">Taken automatically once a day and before every update, restore or merge. They protect against mistakes, not against losing the phone, so keep sending backups outside it too.</p>
  ${(dr.list||[]).length?`<div class="list">${dr.list.slice().reverse().map(s=>`<div class="row"><span class="main"><span class="t">${esc(s.reason)}</span><span class="s">${esc(new Date(s.at).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}))} · ${COLS.reduce((a,c)=>a+countCol(s.data,c),0)} items</span></span><button class="btn sm" data-act="snapGo" data-id="${s.id}">Go back</button></div>`).join('')}</div>`:'<p class="empty">No safety copies yet.</p>'}
  <div class="sh-foot"><span class="spacer"></span><button class="btn" data-act="closeSheet">Close</button></div>`;
ACT.snaps=async()=>{S.back=null;openSheet('snaps',{list:await snapList()})};
ACT.snapGo=async(ds,el)=>{if(!el.hasAttribute('data-armed')){el.setAttribute('data-armed','');el.textContent='Tap again';setTimeout(()=>{if(el.isConnected){el.removeAttribute('data-armed');el.textContent='Go back'}},4000);return}
  const ok=await restoreSnap(ds.id);closeSheet();toast(ok?'Back to that copy. What you had a moment ago is saved as a safety copy too.':'That copy is gone.','')};
function deletedItems(){const out=[],lim=Date.now()-30*864e5;
  for(const c of COLS){if(c==='settings'||c==='days')continue;const v=DB.cache[c]||{};
    if(BUCKETS.includes(c)){for(const [bk,d] of Object.entries(v))for(const [id,x] of Object.entries(d.items||{}))if(x&&x.deleted&&x.deletedAt>lim)out.push({c,bk,id,x})}
    else for(const [id,x] of Object.entries(v))if(x&&x.deleted&&x.deletedAt>lim)out.push({c,id,x})}
  return out.sort((a,b)=>b.x.deletedAt-a.x.deletedAt)}
const delLabel=({c,x})=>c==='money'?`${x.type==='in'?'+':'−'}${fmtN(x.amount)} · ${x.cat||kindLabel(kindOf(x),x.type)}${x.date?' · '+shortDate(x.date):''}`:c==='sessions'?`${className(x.classId)} · ${x.date?shortDate(x.date):''}`:(x.name||x.title||x.text||'Item');
SHEETS.trash=()=>{const L=deletedItems();return `${head('Recently deleted')}<p class="hint" style="margin-top:0">Anything deleted in the last 30 days can come back.</p>
  ${L.length?`<div class="list">${L.map(i=>`<div class="row"><span class="main"><span class="t">${esc(delLabel(i))}</span><span class="s">${esc(COL_LABEL[i.c]||i.c)} · deleted ${esc(new Date(i.x.deletedAt).toLocaleDateString('en-GB'))}</span></span><button class="btn sm" data-act="undel" data-c="${i.c}" data-id="${i.id}" data-bk="${i.bk||''}">Restore</button></div>`).join('')}</div>`:'<p class="empty">Nothing deleted recently.</p>'}
  <div class="sh-foot"><span class="spacer"></span><button class="btn" data-act="closeSheet">Close</button></div>`};
ACT.trash=()=>{S.back=null;openSheet('trash',{})};
ACT.undel=ds=>{if(ds.bk)write(`${ds.c}/${ds.bk}`,{items:{[ds.id]:{deleted:false,deletedAt:null}}},{render:false});else saveDoc(ds.c,ds.id,{deleted:false,deletedAt:null,updatedAt:Date.now()},{render:false});renderSheet();render();toast('Restored')};
SHEETS.bkpass=dr=>`<form data-form="bkpass" class="sform">${head('Protect backups')}${errLine(dr)}
  <p class="hint" style="margin:0">Backups will be locked with this passphrase (AES-256). The app itself stays open on this phone.</p>
  <label class="fld"><span>Passphrase</span><input class="in" type="password" name="p1" autocomplete="new-password"></label><label class="fld"><span>Again</span><input class="in" type="password" name="p2" autocomplete="new-password"></label>
  <div class="err" style="font-weight:500">If you forget it, protected backups can’t be opened by anyone, including you. Write it down somewhere safe.</div>
  <div class="sh-foot">${S.meta.bkPass?'<button type="button" class="btn danger" data-act="bkOff">Turn off</button>':''}<span class="spacer"></span><button type="button" class="btn" data-act="closeSheet">Cancel</button><button class="btn primary" type="submit">Save</button></div></form>`;
READ.bkpass=f=>fd(f);
SAVE.bkpass=dr=>{if(String(dr.p1||'').length<6){dr.err='Use at least 6 characters.';return false}if(dr.p1!==dr.p2){dr.err='The two don’t match.';return false}S.meta.bkPass=dr.p1;saveMeta();toast('Backups will be protected');return true};
ACT.bkPass=()=>{S.back=null;openSheet('bkpass',{})};
ACT.bkOff=()=>{delete S.meta.bkPass;saveMeta();closeSheet();toast('Backups are no longer protected')};

/* ================= Inbox: capture anything in one step, sort it later ================= */
const IN_KINDS=[['idea','Idea'],['task','Task'],['concern','Concern'],['learn','To learn'],['decision','Decision'],['note','Note'],['daybook','App feedback']];
const inKind=k=>(IN_KINDS.find(x=>x[0]===k)||['note','Note'])[1];
const inboxOpen=()=>Object.values(S.inbox).filter(x=>x.status==='open').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
const decisions=()=>Object.values(S.inbox).filter(x=>x.kind==='decision'&&x.status!=='open').sort((a,b)=>String(a.reviewOn||'9').localeCompare(String(b.reviewOn||'9')));
const capBox=()=>`<form data-form="cap" class="capbox"><input class="in" name="text" id="cap-text" placeholder="Capture anything… an idea, a worry, a task" autocomplete="off" autofocus><div class="chips">${IN_KINDS.map(([k,l],i)=>chipIn('radio','kind',k,l,i===0?false:false,false)).join('')}<label class="chip"><input type="checkbox" name="pastel" value="1"><span>Pastel</span></label></div><button class="btn primary" type="submit">Save to Inbox</button></form>`;
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form!=='cap')return;e.preventDefault();e.stopImmediatePropagation();
  const o=fd(f),text=String(o.text||'').trim();if(!text){$('#cap-text')&&$('#cap-text').focus();return}
  saveDoc('inbox',uid(),{text,kind:o.kind||'note',area:o.pastel?'Pastel':'Personal',status:'open',deleted:false,createdAt:Date.now(),updatedAt:Date.now()},{render:false});closeSheet();toast('In your Inbox. Sort it when you have a minute.')},true);
function inboxCard(){const L=inboxOpen(),D=decisions().filter(x=>x.status==='decided');if(!L.length&&!D.length)return '';
  return `${L.length?card('Inbox',`<span class="pill">${L.length}</span>`,`<div class="list">${L.slice(0,30).map(x=>`<button class="row" data-act="inOpen" data-id="${x.id}"><span class="main"><span class="t">${esc(x.text)}</span><span class="s">${esc(inKind(x.kind))}${x.area==='Pastel'?' · Pastel':''} · ${esc(ago(x.createdAt))}</span></span><span class="pill">Sort</span></button>`).join('')}</div>`,'inbox-card'):''}
  ${D.length?card('Decisions to look back on',`<span class="pill">${D.length}</span>`,`<div class="list">${D.map(x=>`<button class="row" data-act="inOpen" data-id="${x.id}"><span class="main"><span class="t">${esc(x.text)}</span><span class="s">expected: ${esc(x.expected||'—')}</span></span><span class="pill ${x.reviewOn&&x.reviewOn<=todayISO()?'warn':''}">${x.reviewOn?esc(shortDate(x.reviewOn)):'no date'}</span></button>`).join('')}</div>`):''}`}
const ago=t=>{const d=Math.floor((Date.now()-t)/864e5);return d<=0?'today':d===1?'yesterday':d+' days ago'};
SHEETS.inbox=dr=>{const x=S.inbox[dr.id];if(!x)return head('Gone');
  if(x.kind==='decision'&&x.status!=='open')return decisionForm(x,dr);
  return `${head('Sort this')}<p class="story" style="font-size:16px">${esc(x.text)}</p><div class="hint">${esc(inKind(x.kind))}${x.area==='Pastel'?' · Pastel':''} · ${esc(ago(x.createdAt))}</div>
  <div class="addgrid" style="margin-top:14px"><button class="btn" data-act="inTask" data-id="${x.id}">${I.tasks}Make it a task</button><button class="btn" data-act="inLearn" data-id="${x.id}">${I.book}Learning topic</button><button class="btn" data-act="inDecide" data-id="${x.id}">${I.target}Record a decision</button><button class="btn" data-act="inDone" data-id="${x.id}">${I.tick}Done / keep as note</button></div>
  <div class="sh-foot"><button type="button" class="btn danger" data-act="del" data-k="inbox">Delete</button><span class="spacer"></span><button class="btn" data-act="closeSheet">Later</button></div>`};
function decisionForm(x,dr){const due=x.reviewOn&&x.reviewOn<=todayISO()&&x.status==='decided';
  return `<form data-form="idec" class="sform">${head(x.status==='reviewed'?'Decision':'Decision journal')}${errLine(dr)}
  <label class="fld"><span>Decision</span><input class="in" name="text" value="${esc(dr.text??x.text)}" autocomplete="off"></label>
  <label class="fld"><span>The real problem</span><textarea class="in" name="problem" style="min-height:56px">${esc(dr.problem??x.problem??'')}</textarea></label>
  <label class="fld"><span>Options you had</span><textarea class="in" name="options" style="min-height:56px">${esc(dr.options??x.options??'')}</textarea></label>
  <label class="fld"><span>What you knew and assumed · why you chose this</span><textarea class="in" name="why" style="min-height:56px">${esc(dr.why??x.why??'')}</textarea></label>
  <div class="row2"><label class="fld"><span>What you expect to happen</span><input class="in" name="expected" value="${esc(dr.expected??x.expected??'')}" autocomplete="off"></label><label class="fld"><span>Look back on</span><input class="in" type="date" name="reviewOn" value="${esc(dr.reviewOn??x.reviewOn??addDays(todayISO(),30))}"></label></div>
  ${due||x.status==='reviewed'?`<div class="fld"><span>${due?'Time to look back. ':''}What actually happened?</span><textarea class="in" name="actual" style="min-height:56px">${esc(dr.actual??x.actual??'')}</textarea></div><label class="fld"><span>What you learned</span><textarea class="in" name="lesson" style="min-height:56px">${esc(dr.lesson??x.lesson??'')}</textarea></label>`:''}
  ${foot('inbox',due?'Save look-back':'Save decision')}</form>`}
READ.idec=f=>fd(f);
SAVE.idec=dr=>{const x=S.inbox[dr.id];if(!x)return true;const text=String(dr.text||'').trim();if(!text){dr.err='Name the decision.';return false}
  const reviewed=String(dr.actual||'').trim()!=='';
  saveDoc('inbox',x.id,{text,kind:'decision',problem:dr.problem||'',options:dr.options||'',why:dr.why||'',expected:dr.expected||'',reviewOn:dr.reviewOn||null,actual:dr.actual||'',lesson:dr.lesson||'',status:reviewed?'reviewed':'decided',updatedAt:Date.now()});toast(reviewed?'Look-back saved':'Decision recorded');return true};
ACT.inOpen=ds=>{S.back=null;openSheet('inbox',{id:ds.id})};
ACT.inDone=ds=>{saveDoc('inbox',ds.id,{status:'done',updatedAt:Date.now()});closeSheet();toast('Done')};
ACT.inTask=ds=>{const x=S.inbox[ds.id];openSheet('task',{title:x.text,owner:'me',area:x.area,status:'open',fromInbox:x.id})};
ACT.inLearn=ds=>{const x=S.inbox[ds.id],p=lpathsAll().find(p=>p.status==='Active')||lpathsAll()[0];openSheet('ltopic',{pathId:p&&p.id,title:x.text,minutes:25,status:'new',fromInbox:x.id})};
ACT.inDecide=ds=>{saveDoc('inbox',ds.id,{kind:'decision',status:'decided',reviewOn:addDays(todayISO(),30),updatedAt:Date.now()},{render:false});openSheet('inbox',{id:ds.id})};
function inboxMoved(id,to){if(id&&S.inbox[id])saveDoc('inbox',id,{status:'moved',movedTo:to,updatedAt:Date.now()},{render:false})}
function inboxAlerts(){const out=[],t=todayISO(),old=inboxOpen().filter(x=>Date.now()-x.createdAt>2*864e5);
  if(old.length)out.push({kind:'warn',text:`${old.length} item${old.length>1?'s':''} waiting in your Inbox`,act:'gotoInbox',cta:'Sort'});
  for(const x of decisions())if(x.status==='decided'&&x.reviewOn&&x.reviewOn<=t)out.push({kind:'warn',text:`Look back on your decision: ${x.text}`,act:'inOpen',args:{id:x.id},cta:'Open'});
  return out}
ACT.gotoInbox=()=>{S.ui.tab='tasks';saveUi();closeSheetIfOpen();render();window.scrollTo(0,0)};


/* ---------------- toast ---------------- */
let toastT=null;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast'+(kind?' '+kind:'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},kind==='bad'?5000:2400)}

/* ---------------- boot ---------------- */
async function boot(){
  restoreUi();$('#b-settings').innerHTML=I.gear;$('#fab').innerHTML=I.plus;render();
  await storeInit();
  if(STORE.kind){for(const c of COLS){try{DB.cache[c]=(await storeGet(c))||{}}catch(e){DB.cache[c]={}}rebuild(c)}try{S.meta=(await storeGet('meta'))||{}}catch(e){S.meta={}}S.db='ready'}
  else S.db='off';
  if(S.db==='ready'){await safetyBoot();finMigrate();learnSeed()}
  render();startPendingFlow();
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('offline cache',e));
}
boot();
</script>
