ACT.setSleep=ds=>{const d=curDate(),s=dayOf(d).sleep||{};setDay(d,{sleep:{[ds.k]:s[ds.k]===ds.v?null:ds.v}})};
ACT.study=ds=>{const d=curDate();setDay(d,{study:{[ds.k]:Math.max(0,studyOf(dayOf(d),ds.k)+(+ds.n))}})};
ACT.timer=ds=>{TIMER&&TIMER.k===ds.k?stopTimer():startTimer(ds.k)};
ACT.stopTimer=()=>stopTimer();
ACT.readAdd=ds=>{const d=curDate();setDay(d,{read:{min:Math.max(0,readMin(dayOf(d))+(+ds.n))}})};
ACT.pagesAdd=ds=>{const d=curDate(),r=dayOf(d).read||{};setDay(d,{read:{pages:Math.max(0,(+r.pages||0)+(+ds.n))}})};
ACT.useBook=ds=>{setDay(curDate(),{read:{book:ds.v}})};
ACT.revSet=ds=>{const d=curDate(),r=dayOf(d).review||{};setDay(d,{review:{min:+r.min===+ds.v?0:+ds.v}})};
ACT.rate=ds=>{const d=curDate(),r=dayOf(d).review||{};setDay(d,{review:{[ds.k]:+r[ds.k]===+ds.v?null:+ds.v}})};
ACT.habit=ds=>{const d=curDate(),h=dayOf(d).habits||{};setDay(d,{habits:{[ds.h]:!h[ds.h]}})};
ACT.topDone=ds=>{const d=curDate(),t=(dayOf(d).top3||{})[ds.i]||{};setDay(d,{top3:{[ds.i]:{done:!t.done}}})};
ACT.planTomorrow=()=>openSub('sec',{sec:'top3',date:addDays(todayISO(),1)});
ACT.toggleAlerts=()=>{S.ui.allAlerts=!S.ui.allAlerts;render()};

ACT.quickHeld=ds=>{const c=classOf(ds.c);if(!c)return;newSession(c,ds.d,'held');toast(`${c.name} marked as held`)};
ACT.quickStatus=ds=>{const c=classOf(ds.c);if(!c)return;if(ds.s==='noshow'){newSession(c,ds.d,'noshow');toast(`${c.name} marked as no-show`);return}
  openSub('session',{classId:c.id,date:ds.d,status:'cancelled',cause:'Student',minutes:c.minutes,teacherId:c.teacherId,roster:(c.studentIds||[]).slice()})};
ACT.logSession=ds=>{const c=ds.c?classOf(ds.c):null;openSub('session',{classId:ds.c||'',date:ds.d||S.ui.date,status:'held',minutes:c?c.minutes:'',teacherId:c?c.teacherId:'',roster:c?(c.studentIds||[]).slice():[]})};

ACT.addMoney=ds=>openSub('money',{type:ds.t||'out',area:ds.t==='in'?'Pastel':'Personal',date:S.sheet&&S.sheet.kind==='sec'?curDate():(S.ui.tab==='today'?S.ui.date:todayISO())});
ACT.editMoney=ds=>{const m=S.money[ds.id];if(m)openSub('money',{...clone(m),amount:String(m.amount),sessions:m.sessions?String(m.sessions):''})};
ACT.openClass=ds=>{const c=ds.id?S.classes[ds.id]:null;openSub('cls',c?{...clone(c),price:c.price?String(c.price):'',perTerm:c.perTerm||''}:{type:'Private',minutes:75,status:'Active',start:todayISO(),teacherId:(teamList().find(m=>m.isMe)||{}).id})};

ACT.recordPayment=ds=>{const c=Object.values(S.classes).find(x=>(x.studentIds||[]).includes(ds.id));openSheet('money',{type:'in',area:'Pastel',cat:'Tuition',studentId:ds.id,sessions:c?String(termSize(c)):'',amount:c&&c.price?String(c.price):'',date:todayISO()})};
ACT.recordPayout=ds=>{const t=S.team[ds.id];if(!t)return;const k=teacherStats(t.id,periodRange('month',todayISO()));const cats=catsFor('Pastel','out');const cat=/psych/i.test(t.role||'')&&cats.includes('Psychologist')?'Psychologist':(cats.includes('Teacher pay')?'Teacher pay':cats[0]);
  openSheet('money',{type:'out',area:'Pastel',cat,teamId:t.id,amount:k.balance>0?String(Math.round(k.balance)):'',date:todayISO()})};
ACT.del=(ds,el)=>{if(!el.hasAttribute('data-armed')){el.setAttribute('data-armed','');el.textContent='Tap again to delete';setTimeout(()=>{if(el.isConnected){el.removeAttribute('data-armed');el.textContent='Delete'}},4000);return}
  const dr=S.sheet&&S.sheet.draft;if(!dr||!dr.id)return;const k=ds.k;
  if(k==='money'){const m=S.money[dr.id];if(m)write(`money/${m.date.slice(0,7)}`,{items:{[dr.id]:{deleted:true}}},{debounce:0})}
  else if(k==='session'){const s=S.sessions[dr.id];if(s)write(`sessions/${s.date.slice(0,7)}`,{items:{[dr.id]:{deleted:true}}},{debounce:0})}
  else{const col={cls:'classes',student:'students',team:'team',task:'tasks'}[k];
    if(k==='student')classesAll().filter(c=>(c.studentIds||[]).includes(dr.id)).forEach(c=>saveDoc('classes',c.id,{studentIds:c.studentIds.filter(x=>x!==dr.id)},{render:false}));
    saveDoc(col,dr.id,{deleted:true,updatedAt:Date.now()})}
  closeSheet();toast('Deleted')};

/* ---------------- export ---------------- */
const csvCell=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const csv=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\n');
const jd=d=>J_OK?jDate(d):'';
ACT.export=async ds=>{let name,data;const k=ds.k;
  if(k==='daily'){const hs=habits();name='daybook-daily.csv';data=csv([['date','persian_date','bed','wake','sleep_hours',...LANGS.map(l=>l.k+'_min'),'study_total_min','reading_min','pages','book','review_min','mood','energy',...hs,'top3_done','note'],
    ...Object.keys(S.days).sort().map(d=>{const x=dayOf(d),sm=sleepMins(x),t3=x.top3||{};return [d,jd(d),x.sleep&&x.sleep.bed,x.sleep&&x.sleep.wake,sm==null?'':(sm/60).toFixed(2),...LANGS.map(l=>studyOf(x,l.k)),studyTotal(x),readMin(x),x.read&&x.read.pages,x.read&&x.read.book,x.review&&x.review.min,x.review&&x.review.mood,x.review&&x.review.energy,...hs.map(h=>x.habits&&x.habits[h]?1:0),[1,2,3].filter(i=>t3[i]&&t3[i].done).length,x.review&&x.review.note]})])}
  else if(k==='money'){name='daybook-money.csv';data=csv([['date','persian_date','type','amount_toman','area','category','note','student','sessions','paid_to'],...Object.values(S.money).sort((a,b)=>a.date.localeCompare(b.date)).map(m=>[m.date,jd(m.date),m.type==='in'?'income':'expense',m.amount,m.area,m.cat,m.note,m.studentId?studentName(m.studentId):'',m.sessions||'',m.teamId?teamName(m.teamId):''])])}
  else if(k==='sessions'){name='daybook-sessions.csv';data=csv([['date','persian_date','class','teacher','status','minutes','students','absent','caused_by','reason','makeup_date','note'],...Object.values(S.sessions).sort((a,b)=>a.date.localeCompare(b.date)).map(s=>[s.date,jd(s.date),className(s.classId),teamName(s.teacherId),s.status,s.minutes,(s.roster||[]).map(studentName).join('; '),(s.absent||[]).map(studentName).join('; '),s.cause,s.reason,s.makeup,s.note])])}
  else{name=`daybook-backup-${todayISO()}.json`;data=JSON.stringify({app:'daybook',version:1,exported:new Date().toISOString(),settings:S.settings,days:S.days,money:S.money,sessions:S.sessions,students:S.students,classes:S.classes,team:S.team,tasks:S.tasks},null,2)}
  const ok=await shareFile(name,data,k==='json'?'application/json':'text/csv');
  if(ok&&k==='json'){S.meta.lastBackup=todayISO();saveMeta();if(S.sheet&&S.sheet.kind==='settings')renderSheet();render();toast('Backup ready. Keep the file somewhere safe.')}
};
async function shareFile(name,data,mime){
  const blob=new Blob([data],{type:mime});
  try{const file=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}
  catch(e){if(e&&e.name==='AbortError')return false;console.warn('share',e)}
  try{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},2000);return true}
  catch(e){toast('The file could not be saved here.','bad');return false}
}
ACT.backupNow=()=>ACT.export({k:'json'});
function readRestore(file){if(!file)return;const r=new FileReader();
  r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(e){toast('That file is not a Daybook backup.','bad');return}
    if(!o||typeof o!=='object'||!(o.days||o.money||o.settings||o.team)){toast('That file is not a Daybook backup.','bad');return}
    const n=k=>Object.keys(o[k]||{}).length;S.back=null;openSheet('import',{data:o,when:o.exported||'',n:{days:n('days'),money:n('money'),sessions:n('sessions'),students:n('students'),team:n('team'),tasks:n('tasks')}})};
  r.onerror=()=>toast('Could not read that file.','bad');r.readAsText(file)}
SHEETS.import=dr=>`${head('Restore a backup')}<p style="margin:0">This replaces everything in Daybook on this device with the backup${dr.when?' from '+esc(new Date(dr.when).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})):''}.</p>
  <div class="mini-tiles" style="margin-top:12px">${[['Days',dr.n.days],['Money',dr.n.money],['Sessions',dr.n.sessions],['Students',dr.n.students],['Team',dr.n.team],['Tasks',dr.n.tasks]].map(([k,v])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>
  <div class="sh-foot"><span class="spacer"></span><button type="button" class="btn" data-act="closeSheet">Cancel</button><button type="button" class="btn primary" data-act="doImport">Replace with backup</button></div>`;
ACT.doImport=()=>{const dr=S.sheet&&S.sheet.draft;if(!dr||!dr.data)return;importData(dr.data);closeSheet();toast('Backup restored')};

/* ---------------- toast ---------------- */
let toastT=null;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast'+(kind?' '+kind:'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},kind==='bad'?5000:2400)}

/* ---------------- boot ---------------- */
async function boot(){
  restoreUi();$('#b-settings').innerHTML=I.gear;$('#fab').innerHTML=I.plus;render();
  await storeInit();
  if(STORE.kind){for(const c of COLS){try{DB.cache[c]=(await storeGet(c))||{}}catch(e){DB.cache[c]={}}rebuild(c)}try{S.meta=(await storeGet('meta'))||{}}catch(e){S.meta={}}S.db='ready'}
  else S.db='off';
  render();startPendingFlow();
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('offline cache',e));
}
boot();
</script>
