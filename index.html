r pay per session, materials, platform). What remains contributes to fixed costs and profit.":"درآمد هر جلسه (شهریه ÷ تعداد جلسه‌ها) منهای هزینه‌هایی که برگزاری‌اش دارد (حقوق معلم برای هر جلسه، منابع، پلتفرم). باقی‌مانده سهمش در هزینه‌های ثابت و سود است.","Pick one group and one private class and work out each one’s margin per session.":"یک کلاس گروهی و یک کلاس خصوصی انتخاب کن و حاشیه سود هر جلسه هر کدام را حساب کن.","Budgets and reserves":"بودجه و ذخیره","Build a monthly operating budget and decide how big a cash reserve should be.":"یک بودجه جاری ماهانه بساز و تصمیم بگیر ذخیره نقدی چقدر باید باشد.","What is an emergency reserve sized on, and why not on revenue?":"اندازه ذخیره اضطراری بر چه اساسی تعیین می‌شود و چرا بر اساس درآمد نه؟","On essential monthly costs (what must be paid even if revenue drops), usually 3–6 months of them. Revenue is the thing that may disappear, so it is the wrong base.":"بر اساس هزینه‌های ضروری ماهانه (چیزهایی که حتی اگر درآمد کم شود باید پرداخت شوند)، معمولاً ۳ تا ۶ ماهِ آن. درآمد همان چیزی است که ممکن است از بین برود، پس مبنای اشتباهی است.","Set Pastel’s reserve target in Finance Hub → Plan from measured costs.":"هدف ذخیره پاستل را در مالی ← برنامه بر اساس هزینه‌های اندازه‌گیری‌شده تعیین کن.","Pricing":"قیمت‌گذاری","Understand cost-based, value-based and competitor-based pricing and when to raise prices.":"قیمت‌گذاری بر اساس هزینه، ارزش و رقبا را بفهم و بدان کی باید قیمت را بالا برد.","Name three ways to set a price and the risk of each.":"سه روش قیمت‌گذاری و ریسک هر کدام را نام ببر.","Cost-plus (safe floor, ignores value), competitor-based (easy, races to the bottom), value-based (captures what students gain, needs clear positioning and proof).":"هزینه به‌علاوه سود (کف امن، ارزش را نادیده می‌گیرد)، بر اساس رقبا (آسان، به رقابت در ارزان‌فروشی می‌کشد)، بر اساس ارزش (چیزی را که دانش‌آموز به دست می‌آورد می‌گیرد، جایگاه‌یابی و شواهد روشن لازم دارد).","Review Pastel’s IELTS course price against its value and competitors.":"قیمت دوره آیلتس پاستل را با ارزشش و رقبا مقایسه کن.","Time Management":"مدیریت زمان","Weekly planning":"برنامه‌ریزی هفتگی","Plan the week around a few outcomes instead of a task list.":"هفته را حول چند نتیجه برنامه‌ریزی کن، نه یک فهرست کار.","What should a weekly plan start from?":"برنامه هفتگی باید از کجا شروع شود؟","From 2–3 outcomes that matter this week, then the time blocks to produce them, then everything else fits around.":"از ۲ تا ۳ نتیجه مهم این هفته، بعد بلوک‌های زمانی برای رسیدن به آن‌ها، و بعد بقیه کارها دورشان چیده می‌شوند.","Do a 20-minute weekly plan this Saturday with 3 outcomes.":"این شنبه یک برنامه‌ریزی هفتگی ۲۰ دقیقه‌ای با ۳ نتیجه انجام بده.","Deep work and energy":"کار عمیق و انرژی","Protect focused blocks and match hard work to high-energy hours.":"از بلوک‌های تمرکز محافظت کن و کارهای سخت را در ساعت‌های پرانرژی بگذار.","Why schedule deep work by energy rather than by free time?":"چرا کار عمیق را بر اساس انرژی برنامه‌ریزی کنیم، نه وقت آزاد؟","Block two 90-minute deep-work slots for Pastel this week.":"این هفته دو بلوک ۹۰ دقیقه‌ای کار عمیق برای پاستل بگذار.","Prioritising and saying no":"اولویت‌بندی و نه گفتن","Use urgent/important and opportunity cost to decide what not to do.":"با فوری/مهم و هزینه فرصت تصمیم بگیر چه کاری را انجام ندهی.","What is the opportunity cost of saying yes?":"هزینه فرصت بله گفتن چیست؟","List three recurring things you will stop or hand off.":"سه کار تکراری را که متوقف می‌کنی یا به دیگری می‌سپاری فهرست کن.","Delegation":"تفویض کار","Levels of delegation":"سطح‌های تفویض","Match how much authority you hand over to the person and the task.":"میزان اختیاری که می‌سپاری را با آدم و کار متناسب کن.","Describe a ladder of delegation from least to most authority.":"نردبان تفویض را از کمترین تا بیشترین اختیار توضیح بده.","From “do exactly this” → “look into it and report” → “recommend” → “decide and tell me” → “decide, act, no report needed”. Pick the level by skill and risk.":"از «دقیقاً این را انجام بده» ← «بررسی کن و گزارش بده» ← «پیشنهاد بده» ← «تصمیم بگیر و به من بگو» ← «تصمیم بگیر و انجام بده، گزارش لازم نیست». سطح را بر اساس مهارت و ریسک انتخاب کن.","Choose one task for Asal and agree its delegation level.":"یک کار برای عسل انتخاب کن و روی سطح تفویضش توافق کنید.","Roles and responsibilities (RACI)":"نقش‌ها و مسئولیت‌ها (RACI)","Make clear who is Responsible, Accountable, Consulted and Informed.":"مشخص کن چه کسی مجری، پاسخگو، مشاور و مطلع است.","What does each letter in RACI mean?":"هر حرف RACI یعنی چه؟","Responsible: does the work. Accountable: owns the result and signs off (one person). Consulted: gives input before. Informed: told after.":"مجری (R): کار را انجام می‌دهد. پاسخگو (A): صاحب نتیجه است و تأیید می‌کند (یک نفر). مشاور (C): قبل از کار نظر می‌دهد. مطلع (I): بعد از کار خبردار می‌شود.","Write a RACI for founder, academic supervisor and coordinator for 5 key Pastel processes.":"برای ۵ فرایند کلیدی پاستل یک RACI برای مؤسس، سرپرست آموزشی و هماهنگ‌کننده بنویس.","Follow-up without micromanaging":"پیگیری بدون مدیریت ذره‌بینی","Set check-ins and results to look at, not how every step is done.":"جلسه‌های پیگیری و نتیجه‌هایی برای بررسی تعیین کن، نه نحوه انجام هر قدم.","How do you keep oversight without micromanaging?":"چطور بدون مدیریت ذره‌بینی نظارت داشته باشی؟","Set a weekly 15-minute check-in format with your team.":"یک قالب جلسه پیگیری ۱۵ دقیقه‌ای هفتگی با تیمت بگذار.","Leadership":"رهبری","Situational leadership":"رهبری موقعیتی","Adjust direction and support to each person’s competence and commitment.":"میزان راهنمایی و حمایت را با توانایی و تعهد هر نفر تنظیم کن.","Why would one leadership style fail with a whole team?":"چرا یک سبک رهبری با کل تیم شکست می‌خورد؟","Map each teacher’s skill/confidence for their main task.":"مهارت و اعتمادبه‌نفس هر معلم را در کار اصلی‌اش مشخص کن.","Giving feedback":"بازخورد دادن","Give specific, timely feedback that changes behaviour.":"بازخورد مشخص و به‌موقع بده که رفتار را تغییر دهد.","What is the SBI model?":"مدل SBI چیست؟","Situation (when/where), Behaviour (what you observed, not judgments), Impact (its effect). Then ask and agree a next step.":"موقعیت (کی/کجا)، رفتار (چیزی که دیدی، نه قضاوت)، اثر (نتیجه‌اش). بعد بپرس و روی قدم بعدی توافق کنید.","Give one SBI feedback to a team member this week.":"این هفته یک بازخورد SBI به یکی از اعضای تیم بده.","One-to-ones":"جلسه‌های دونفره","Run short regular 1:1s that the team member owns.":"جلسه‌های دونفره کوتاه و منظم برگزار کن که صاحبش عضو تیم است.","Whose meeting is a 1:1, and what goes in it?":"جلسه دونفره مال کیست و در آن چه مطرح می‌شود؟","Theirs: their agenda, blockers, growth and feedback both ways. Status updates belong elsewhere.":"مال اوست: دستور جلسه خودش، موانع، رشد و بازخورد دوطرفه. گزارش وضعیت جای دیگری است.","Start monthly 1:1s with your teachers.":"جلسه‌های دونفره ماهانه با معلم‌هایت را شروع کن.","Operations Management":"مدیریت عملیات","Mapping a process":"ترسیم فرایند","Draw a key process step by step to see delays and handoffs.":"یک فرایند کلیدی را قدم به قدم رسم کن تا تأخیرها و دست‌به‌دست شدن‌ها را ببینی.","Why map a process before improving it?":"چرا قبل از بهبود یک فرایند باید آن را ترسیم کرد؟","You can’t fix what you can’t see: mapping exposes handoffs, waiting, duplicated work and unclear owners.":"چیزی را که نمی‌بینی نمی‌توانی درست کنی: ترسیم، دست‌به‌دست شدن‌ها، انتظارها، کارهای تکراری و مسئول‌های نامشخص را نشان می‌دهد.","Map Pastel’s student journey from first message to first class.":"مسیر دانش‌آموز در پاستل را از اولین پیام تا اولین کلاس ترسیم کن.","Checklists and SOPs":"چک‌لیست‌ها و دستورالعمل‌ها","Turn repeated work into short checklists anyone can follow.":"کارهای تکراری را به چک‌لیست‌های کوتاهی تبدیل کن که هر کسی بتواند دنبال کند.","When is a checklist better than training alone?":"کی چک‌لیست از آموزش تنها بهتر است؟","Write a checklist for onboarding a new student.":"یک چک‌لیست برای پذیرش دانش‌آموز جدید بنویس.","KPIs that matter":"شاخص‌های کلیدی مهم","Choose a few leading and lagging indicators for the school.":"چند شاخص پیشرو و پسرو برای آموزشگاه انتخاب کن.","What is the difference between leading and lagging indicators?":"فرق شاخص پیشرو و پسرو چیست؟","Lagging ones report results after the fact (revenue, retention). Leading ones move earlier and predict them (trial lessons booked, attendance).":"شاخص‌های پسرو نتیجه را بعد از وقوع گزارش می‌کنند (درآمد، ماندگاری). شاخص‌های پیشرو زودتر تغییر می‌کنند و آن‌ها را پیش‌بینی می‌کنند (جلسه‌های آزمایشی رزروشده، حضور).","Pick 4 KPIs for Pastel and where each comes from.":"۴ شاخص کلیدی برای پاستل انتخاب کن و مشخص کن هر کدام از کجا می‌آید.","Human Resource Management":"مدیریت منابع انسانی","Hiring with a scorecard":"استخدام با کارنامه نقش","Define the outcomes and competencies for a role before interviewing.":"قبل از مصاحبه نتیجه‌ها و شایستگی‌های لازم برای نقش را تعریف کن.","What goes into a role scorecard?":"کارنامه نقش شامل چه چیزهایی است؟","The mission of the role, 3–5 measurable outcomes, and the competencies needed. Candidates are scored against it, not gut feeling.":"مأموریت نقش، ۳ تا ۵ نتیجه قابل اندازه‌گیری و شایستگی‌های لازم. داوطلب‌ها بر اساس آن امتیاز می‌گیرند، نه حس درونی.","Write a scorecard for your next teacher hire.":"برای استخدام معلم بعدی یک کارنامه نقش بنویس.","Onboarding teachers":"آشنا کردن معلم‌های تازه‌وارد","Get a new teacher productive and aligned in their first weeks.":"معلم تازه را در هفته‌های اول هماهنگ و کارآمد کن.","What should the first 30 days of onboarding cover?":"۳۰ روز اول آشنایی باید شامل چه باشد؟","Expectations and outcomes, methods and materials, tools and processes, a buddy or check-ins, and early feedback.":"انتظارها و نتیجه‌ها، روش‌ها و منابع، ابزارها و فرایندها، یک همراه یا جلسه‌های پیگیری، و بازخورد زودهنگام.","Draft a 30-day onboarding plan for teachers.":"یک برنامه آشنایی ۳۰ روزه برای معلم‌ها بنویس.","Pay and incentives":"حقوق و انگیزه‌ها","Design fair pay and see how incentives change behaviour.":"حقوق منصفانه طراحی کن و ببین مشوق‌ها چطور رفتار را تغییر می‌دهند.","What can go wrong with incentives?":"مشوق‌ها چه مشکلی می‌توانند ایجاد کنند؟","People optimise for what is measured, sometimes at the expense of what matters (e.g., hours over quality). Keep them simple, fair and tied to real outcomes.":"آدم‌ها برای چیزی که اندازه‌گیری می‌شود بهینه می‌کنند، گاهی به قیمت چیزی که مهم است (مثلاً ساعت به جای کیفیت). مشوق‌ها را ساده، منصفانه و وابسته به نتیجه واقعی نگه دار.","Review how teacher pay rewards quality, not just sessions.":"بررسی کن حقوق معلم‌ها چطور به کیفیت پاداش می‌دهد، نه فقط به تعداد جلسه.","Organisational Psychology":"روانشناسی سازمانی","Motivation":"انگیزه","Use autonomy, competence and relatedness to keep people motivated.":"با خودمختاری، شایستگی و تعلق، انگیزه آدم‌ها را حفظ کن.","What are the three needs in self-determination theory?":"سه نیاز در نظریه خودتعیین‌گری چیست؟","Autonomy (choice), competence (getting better) and relatedness (belonging). Meeting them supports lasting motivation more than rewards alone.":"خودمختاری (انتخاب)، شایستگی (بهتر شدن) و تعلق (احساس عضویت). برآوردن این‌ها بیشتر از پاداش به تنهایی انگیزه پایدار می‌سازد.","Find one change that gives teachers more autonomy.":"یک تغییر پیدا کن که به معلم‌ها خودمختاری بیشتری بدهد.","Psychological safety":"امنیت روانی","Build a team where people speak up about problems and mistakes.":"تیمی بساز که آدم‌ها در آن درباره مشکل‌ها و اشتباه‌ها حرف بزنند.","What is psychological safety?":"امنیت روانی چیست؟","A shared belief that it’s safe to take interpersonal risks: ask, admit mistakes, disagree. It predicts learning and team performance.":"این باور مشترک که ریسک‌های میان‌فردی امن است: پرسیدن، پذیرفتن اشتباه، مخالفت کردن. یادگیری و عملکرد تیم را پیش‌بینی می‌کند.","Open your next team meeting by inviting problems, and thank people who raise them.":"جلسه بعدی تیم را با دعوت به گفتن مشکل‌ها شروع کن و از کسانی که مطرحشان می‌کنند تشکر کن.","Preventing burnout":"پیشگیری از فرسودگی","Spot signs of burnout in yourself and the team and reduce its causes.":"نشانه‌های فرسودگی را در خودت و تیم ببین و دلیل‌هایش را کم کن.","What are the core signs of burnout?":"نشانه‌های اصلی فرسودگی چیست؟","Exhaustion, cynicism or distance from the work, and reduced sense of effectiveness — usually from chronic workload, low control or poor recovery.":"خستگی شدید، بدبینی یا فاصله گرفتن از کار، و کم شدن حس اثربخشی — معمولاً به خاطر حجم کار مزمن، کنترل کم یا استراحت ناکافی.","Check your own workload and recovery in Daybook for the past month.":"حجم کار و استراحت خودت را در ماه گذشته در دی‌بوک بررسی کن.","Decision-Making":"تصمیم‌گیری","Reversible vs irreversible decisions":"تصمیم‌های برگشت‌پذیر و برگشت‌ناپذیر","Decide fast on reversible choices and slowly on irreversible ones.":"درباره انتخاب‌های برگشت‌پذیر سریع و درباره برگشت‌ناپذیرها آهسته تصمیم بگیر.","Why treat one-way and two-way door decisions differently?":"چرا تصمیم‌های «در یک‌طرفه» و «در دوطرفه» را متفاوت برخورد کنیم؟","Sort three pending Pastel decisions into one-way and two-way doors.":"سه تصمیم معلق پاستل را به در یک‌طرفه و دوطرفه دسته‌بندی کن.","Biases in decisions":"سوگیری‌ها در تصمیم‌گیری","Recognise confirmation bias, sunk cost and overconfidence.":"سوگیری تأییدی، هزینه ازدست‌رفته و اعتمادبه‌نفس بیش از حد را بشناس.","What is the sunk cost fallacy?":"خطای هزینه ازدست‌رفته چیست؟","Continuing something because of what you already invested, rather than judging future costs and benefits.":"ادامه دادن کاری به خاطر چیزی که قبلاً در آن گذاشته‌ای، به جای سنجیدن هزینه و فایده آینده.","Check one ongoing Pastel project for sunk-cost thinking.":"یک پروژه جاری پاستل را از نظر تفکر هزینه ازدست‌رفته بررسی کن.","Decision journal":"دفتر تصمیم‌ها","Record decisions and expected outcomes to learn from them later.":"تصمیم‌ها و نتیجه‌های مورد انتظار را ثبت کن تا بعداً از آن‌ها یاد بگیری.","Why write decisions down before the outcome is known?":"چرا تصمیم‌ها را قبل از معلوم شدن نتیجه بنویسیم؟","It separates decision quality from luck and memory bias, so you can learn what was actually good reasoning.":"کیفیت تصمیم را از شانس و سوگیری حافظه جدا می‌کند، تا بفهمی کدام استدلال واقعاً خوب بود.","Start a decision log for important Pastel choices.":"برای انتخاب‌های مهم پاستل یک دفتر تصمیم شروع کن.","Business Strategy":"استراتژی کسب‌وکار","Positioning":"جایگاه‌یابی","Define who Pastel serves best and why students choose it.":"مشخص کن پاستل به چه کسانی بهتر از همه خدمت می‌کند و چرا دانش‌آموزان انتخابش می‌کنند.","What does a positioning statement include?":"بیانیه جایگاه‌یابی شامل چه چیزهایی است؟","Target customer, their need, the category, the key benefit, and why you are different from alternatives.":"مشتری هدف، نیازش، دسته، مزیت کلیدی و این‌که چرا با جایگزین‌ها فرق داری.","Write Pastel’s positioning in two sentences.":"جایگاه پاستل را در دو جمله بنویس.","Competitor analysis":"تحلیل رقبا","Compare alternatives students have, including doing nothing.":"جایگزین‌هایی که دانش‌آموزان دارند را مقایسه کن، از جمله هیچ کاری نکردن.","Who counts as a competitor?":"چه کسی رقیب حساب می‌شود؟","Every alternative a student could choose: other schools, private tutors, apps, self-study, or postponing.":"هر جایگزینی که دانش‌آموز ممکن است انتخاب کند: آموزشگاه‌های دیگر، معلم خصوصی، اپلیکیشن، خودآموزی یا عقب انداختن.","Compare Pastel with 3 real alternatives on price, results and experience.":"پاستل را با ۳ جایگزین واقعی از نظر قیمت، نتیجه و تجربه مقایسه کن.","Setting strategic priorities":"تعیین اولویت‌های استراتژیک","Choose a few priorities and what not to do.":"چند اولویت و کارهایی که نباید انجام دهی را انتخاب کن.","What makes a strategy good rather than a list of goals?":"چه چیزی یک استراتژی را خوب می‌کند، نه فقط فهرستی از هدف‌ها؟","A clear diagnosis of the main challenge, a guiding policy for dealing with it, and coherent actions — including what you won’t do.":"تشخیص روشن چالش اصلی، یک سیاست راهنما برای رویارویی با آن، و اقدام‌های هماهنگ — از جمله کارهایی که انجام نمی‌دهی.","Pick Pastel’s 3 priorities for the next quarter.":"۳ اولویت پاستل برای فصل بعد را انتخاب کن.","Business Growth":"رشد کسب‌وکار","Acquisition channels":"کانال‌های جذب","Find which channels bring students and at what cost.":"پیدا کن کدام کانال‌ها و با چه هزینه‌ای دانش‌آموز می‌آورند.","What is customer acquisition cost (CAC)?":"هزینه جذب مشتری (CAC) چیست؟","Total sales and marketing spend in a period divided by new customers gained in it.":"کل هزینه فروش و بازاریابی در یک بازه تقسیم بر تعداد مشتری‌های تازه همان بازه.","Estimate where Pastel’s last 10 students came from.":"تخمین بزن ۱۰ دانش‌آموز اخیر پاستل از کجا آمده‌اند.","Retention and referrals":"ماندگاری و معرفی","Grow by keeping students longer and earning referrals.":"با نگه داشتن طولانی‌تر دانش‌آموزان و گرفتن معرفی رشد کن.","Why can retention matter more than acquisition?":"چرا ماندگاری می‌تواند از جذب مهم‌تر باشد؟","Measure how many students renewed last term.":"اندازه بگیر ترم قبل چند دانش‌آموز تمدید کردند.","Growth experiments":"آزمایش‌های رشد","Test small changes with a clear hypothesis and measure them.":"تغییرهای کوچک را با یک فرضیه روشن آزمایش و اندازه‌گیری کن.","What does a good growth experiment define before it starts?":"یک آزمایش رشد خوب قبل از شروع چه چیزهایی را مشخص می‌کند؟","A hypothesis, the change, the metric, the time frame and what result would count as success.":"فرضیه، تغییر، معیار، بازه زمانی و این‌که چه نتیجه‌ای موفقیت حساب می‌شود.","Run one small experiment for Pastel this month.":"این ماه یک آزمایش کوچک برای پاستل اجرا کن.","Suggested starting point. Replace with your own sources.":"نقطه شروع پیشنهادی. با منابع خودت جایگزینش کن.","Daily copy":"نسخه روزانه","Before updating to data version §":"قبل از به‌روزرسانی به نسخه داده §1","Before going back to a safety copy":"قبل از برگشت به نسخه ایمنی","This backup comes from a newer version of Daybook. Open the app with internet to update it first.":"این پشتیبان از نسخه جدیدتر دی‌بوک است. اول برنامه را با اینترنت باز کن تا به‌روز شود.","The data inside is damaged.":"داده‌های داخلش خراب است.","The “§” part is damaged.":"بخش «§1» خراب است.","The file was changed or cut off after it was made (checksum doesn’t match).":"فایل بعد از ساخته شدن تغییر کرده یا ناقص شده (کد بررسی نمی‌خواند).","Checksum matches: the file is complete and unchanged.":"کد بررسی می‌خواند: فایل کامل و دست‌نخورده است.","Older backup without a checksum: it reads fine, but completeness can’t be proven.":"پشتیبان قدیمی بدون کد بررسی: خوانده می‌شود، ولی کامل بودنش قابل اثبات نیست.","Very old backup format: it can be restored, but it has no checksum.":"قالب پشتیبان خیلی قدیمی: قابل بازگردانی است ولی کد بررسی ندارد.","Class sessions":"جلسه‌های کلاس","Learning paths":"مسیرهای یادگیری","Learning topics":"موضوع‌های یادگیری","Learning sessions":"جلسه‌های یادگیری","Inbox & decisions":"صندوق ایده‌ها و تصمیم‌ها","Protected backup ready. Keep it somewhere outside this phone.":"پشتیبان محافظت‌شده آماده است. جایی بیرون از این گوشی نگهش دار.","Backup ready. Keep it somewhere outside this phone.":"پشتیبان آماده است. جایی بیرون از این گوشی نگهش دار.","Protected backup":"پشتیبان محافظت‌شده","Unlock":"باز کردن قفل","This backup is locked with a passphrase.":"این پشتیبان با رمز قفل شده.","Passphrase":"رمز","Wrong passphrase, or the file is damaged.":"رمز اشتباه است یا فایل خراب است.","Backup check":"بررسی پشتیبان","This backup can be restored":"این پشتیبان قابل بازگردانی است","Backup checked":"پشتیبان بررسی شد","Problem with this backup":"این پشتیبان مشکل دارد","Nothing on this phone was changed.":"هیچ چیز روی این گوشی تغییر نکرد.","adds everything new from the backup and keeps everything on this phone. When the same entry changed in both places, the newer change wins.":"هر چیز تازه‌ای را از پشتیبان اضافه می‌کند و همه چیز روی این گوشی را نگه می‌دارد. اگر یک مورد در هر دو جا تغییر کرده باشد، تغییر جدیدتر می‌ماند.","makes this phone an exact copy of the backup. A safety copy of what's here now is kept first either way.":"این گوشی را دقیقاً مثل پشتیبان می‌کند. در هر صورت اول یک نسخه ایمنی از وضع فعلی نگه داشته می‌شود.","Before replacing with a backup":"قبل از جایگزینی با پشتیبان","Backup restored. The previous state is kept as a safety copy.":"پشتیبان بازگردانی شد. وضع قبلی به صورت نسخه ایمنی نگه داشته شد.","Before merging a backup":"قبل از ادغام پشتیبان","Safety copies on this phone":"نسخه‌های ایمنی روی این گوشی","§ · § items":"§1 · §2 مورد","Go back":"برگرد","No safety copies yet.":"هنوز نسخه ایمنی نیست.","Taken automatically once a day and before every update, restore or merge. They protect against mistakes, not against losing the phone, so keep sending backups outside it too.":"روزی یک بار و قبل از هر به‌روزرسانی، بازگردانی یا ادغام خودکار گرفته می‌شوند. از اشتباه‌ها محافظت می‌کنند، نه از گم شدن گوشی، پس پشتیبان بیرون از گوشی را هم ادامه بده.","Back to that copy. What you had a moment ago is saved as a safety copy too.":"به آن نسخه برگشتی. چیزی که چند لحظه پیش داشتی هم به صورت نسخه ایمنی ذخیره شد.","That copy is gone.":"آن نسخه دیگر نیست.","Item":"مورد","§ · deleted §":"§1 · حذف‌شده در §2","Restore":"بازگردانی","Nothing deleted recently.":"اخیراً چیزی حذف نشده.","Anything deleted in the last 30 days can come back.":"هر چیزی که در ۳۰ روز اخیر حذف شده قابل برگشت است.","Restored":"بازگردانده شد","Turn off":"خاموش کن","Backups will be locked with this passphrase (AES-256). The app itself stays open on this phone.":"پشتیبان‌ها با این رمز قفل می‌شوند (AES-256). خود برنامه روی این گوشی باز می‌ماند.","Again":"دوباره","If you forget it, protected backups can’t be opened by anyone, including you. Write it down somewhere safe.":"اگر فراموشش کنی، هیچ‌کس، حتی خودت، نمی‌تواند پشتیبان‌های محافظت‌شده را باز کند. جایی امن بنویسش.","Use at least 6 characters.":"حداقل ۶ حرف بگذار.","The two don’t match.":"این دو یکی نیستند.","Backups will be protected":"پشتیبان‌ها محافظت می‌شوند","Backups are no longer protected":"پشتیبان‌ها دیگر محافظت‌شده نیستند","Idea":"ایده","Concern":"نگرانی","To learn":"برای یادگیری","Decision":"تصمیم","App feedback":"بازخورد برنامه","Capture anything… an idea, a worry, a task":"هر چیزی را ثبت کن… یک ایده، یک نگرانی، یک کار","Save to Inbox":"ذخیره در صندوق","In your Inbox. Sort it when you have a minute.":"در صندوقت است. هر وقت فرصت کردی مرتبش کن.","Inbox":"صندوق ایده‌ها","· Pastel":"· پاستل","Decisions to look back on":"تصمیم‌هایی برای بازنگری","no date":"بدون تاریخ","expected: §":"انتظار: §1","days ago":"روز پیش","Gone":"رفته","Sort this":"مرتبش کن","§Make it a task":"§1تبدیل به کار","Make it a task":"تبدیل به کار","§Learning topic":"§1موضوع یادگیری","Learning topic":"موضوع یادگیری","§Record a decision":"§1ثبت تصمیم","Record a decision":"ثبت تصمیم","§Done / keep as note":"§1انجام شد / به عنوان یادداشت بماند","Done / keep as note":"انجام شد / به عنوان یادداشت بماند","Later":"بعداً","Time to look back.":"وقت بازنگری است.","§What actually happened?":"§1واقعاً چه شد؟","What actually happened?":"واقعاً چه شد؟","What you learned":"چه یاد گرفتی","Save look-back":"ذخیره بازنگری","Save decision":"ذخیره تصمیم","The real problem":"مسئله واقعی","Options you had":"گزینه‌هایی که داشتی","What you knew and assumed · why you chose this":"چه می‌دانستی و چه فرض کردی · چرا این را انتخاب کردی","What you expect to happen":"انتظار داری چه شود","Look back on":"بازنگری در تاریخ","Name the decision.":"برای تصمیم نام بگذار.","Look-back saved":"بازنگری ذخیره شد","Decision recorded":"تصمیم ثبت شد","§ item§ waiting in your Inbox":"§1 مورد در صندوقت منتظر است","Look back on your decision: §":"بازنگری تصمیمت: §1","The synced file on GitHub is damaged. Your data on this device is fine.":"فایل همگام‌سازی روی گیت‌هاب خراب است. داده‌های این دستگاه سالم است.","The repository has a file Daybook doesn’t recognise. Use an empty private repository just for Daybook.":"در مخزن فایلی هست که دی‌بوک نمی‌شناسد. یک مخزن خصوصی خالی فقط برای دی‌بوک استفاده کن.","This device’s browser is too old to read the synced data. Update iOS/macOS and try again.":"مرورگر این دستگاه برای خواندن داده‌های همگام‌سازی خیلی قدیمی است. سیستم‌عامل را به‌روز کن و دوباره امتحان کن.","Can’t reach GitHub right now. Everything is safe on this device and will sync later.":"الان به گیت‌هاب دسترسی نیست. همه چیز روی این دستگاه امن است و بعداً همگام م   const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let t;const L=[];
  while((t=w.nextNode()))L.push(t);
  L.forEach(faNode);
}
function faAttrs(el){
  if(el.closest&&el.closest('[data-notr]'))return;
  for(const a of ['placeholder','aria-label','title']){const v=el.getAttribute&&el.getAttribute(a);if(v){const o=tr(v);if(o!==v)el.setAttribute(a,o)}}
}
let FA_OBS=null;
function faStart(){
  if(!isFa()||FA_OBS||typeof MutationObserver==='undefined')return;
  const de=document.documentElement;de.lang='fa';de.dir='rtl';
  const t=I.left;I.left=I.right;I.right=t;
  FA_OBS=new MutationObserver(list=>{
    FA_OBS.disconnect();
    try{for(const r of list){
      if(r.type==='characterData')faNode(r.target);
      else if(r.type==='attributes')faAttrs(r.target);
      else r.addedNodes.forEach(faNode);
    }}finally{FA_OBS.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']})}
  });
  faNode(document.body);
  FA_OBS.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title']});
}
const langBtns=()=>`<div class="fld"><span>Language</span><div class="seg" data-notr><button type="button" data-act="setLang" data-v="en" aria-pressed="${!isFa()}">English</button><button type="button" data-act="setLang" data-v="fa" aria-pressed="${isFa()}">فارسی</button></div></div>`;
ACT.setLang=d=>{const v=d.v==='fa'?'fa':'en';if(v===LANG)return;try{localStorage.setItem('daybook.lang',v)}catch(e){}location.reload()};
faStart();


/* ---------------- toast ---------------- */
let toastT=null;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast'+(kind?' '+kind:'');t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},kind==='bad'?5000:2400)}

/* ---------------- boot ---------------- */
async function boot(){
  restoreUi();$('#b-settings').innerHTML=I.gear;$('#fab').innerHTML=I.plus;render();
  await storeInit();
  if(STORE.kind){for(const c of COLS){try{DB.cache[c]=(await storeGet(c))||{}}catch(e){DB.cache[c]={}}rebuild(c)}try{S.meta=(await storeGet('meta'))||{}}catch(e){S.meta={}}S.db='ready'}
  else S.db='off';
  if(S.db==='ready'){await safetyBoot();finMigrate();learnSeed();seedDedupe();syncBoot()}
  render();startPendingFlow();
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('offline cache',e));
}
boot();
</script>
